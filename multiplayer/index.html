<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTERLIGHT 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
}

#hud{
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    color:white;
    background:rgba(5,10,18,.75);
    border:1px solid rgba(0,220,255,.35);
    border-radius:12px;
    padding:15px 18px;
    backdrop-filter:blur(8px);
}

#hud h1{
    margin:0 0 5px;
    font-size:20px;
    letter-spacing:3px;
}

#status{
    color:#8deaff;
    font-size:13px;
}

#instructions{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#aaa;
    background:rgba(0,0,0,.65);
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    text-align:center;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <h1>AFTERLIGHT</h1>
    <div id="status">3D Multiplayer Foundation</div>
</div>

<div id="instructions">
    WASD = Move &nbsp; | &nbsp; Mouse = Look &nbsp; | &nbsp; Click game to control camera
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070b);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

document
.getElementById("game")
.appendChild(renderer.domElement);


// LIGHTING

const ambient = new THREE.AmbientLight(
    0x668899,
    1.5
);

scene.add(ambient);

const light = new THREE.PointLight(
    0x00ccff,
    20,
    40
);

light.position.set(0,8,0);

scene.add(light);


// FLOOR

const floor =
    new THREE.Mesh(
        new THREE.PlaneGeometry(40,40),
        new THREE.MeshStandardMaterial({
            color:0x111820,
            metalness:.7,
            roughness:.35
        })
    );

floor.rotation.x = -Math.PI / 2;

scene.add(floor);


// AFTERLIGHT CORE

const core =
    new THREE.Mesh(
        new THREE.CylinderGeometry(
            1.5,
            1.5,
            5,
            32
        ),
        new THREE.MeshStandardMaterial({
            color:0x07151c,
            emissive:0x00aacc,
            emissiveIntensity:2,
            metalness:.8,
            roughness:.2
        })
    );

core.position.y = 2.5;

scene.add(core);


// RINGS

for(let i=0;i<3;i++){

    const ring =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                2 + i*.7,
                .04,
                12,
                64
            ),
            new THREE.MeshBasicMaterial({
                color:0x00d9ff
            })
        );

    ring.rotation.x = Math.PI / 2;
    ring.position.y = 1 + i*1.5;

    scene.add(ring);
}


// WALLS

function wall(x,z,w,d){

    const object =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                w,
                5,
                d
            ),
            new THREE.MeshStandardMaterial({
                color:0x0a1018,
                metalness:.6,
                roughness:.4
            })
        );

    object.position.set(
        x,
        2.5,
        z
    );

    scene.add(object);
}

wall(0,-20,40,1);
wall(0,20,40,1);
wall(-20,0,1,40);
wall(20,0,1,40);


// PLAYER

const player =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .45,
            1.2,
            8,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0xeeeeee,
            emissive:0x003344,
            emissiveIntensity:.5
        })
    );

player.position.set(
    0,
    1.1,
    7
);

scene.add(player);


// CAMERA

let yaw = 0;
let pitch = 0;

const cameraDistance = 7;
const cameraHeight = 3.2;

let mouseLocked = false;


// MOUSE LOOK

renderer.domElement.addEventListener(
    "click",
    () => {

        renderer.domElement.requestPointerLock();

    }
);

document.addEventListener(
    "pointerlockchange",
    () => {

        mouseLocked =
            document.pointerLockElement === renderer.domElement;

    }
);

document.addEventListener(
    "mousemove",
    event => {

        if(!mouseLocked)
            return;

        yaw -= event.movementX * 0.002;
        pitch -= event.movementY * 0.002;

        pitch =
            THREE.MathUtils.clamp(
                pitch,
                -0.8,
                0.8
            );

    }
);


// KEYBOARD

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        keys[event.key.toLowerCase()] = true;

    }
);

window.addEventListener(
    "keyup",
    event => {

        keys[event.key.toLowerCase()] = false;

    }
);


// MOVEMENT

function updatePlayer(){

    const speed = 0.12;

    const forward =
        new THREE.Vector3(
            -Math.sin(yaw),
            0,
            -Math.cos(yaw)
        );

    const right =
        new THREE.Vector3(
            Math.cos(yaw),
            0,
            -Math.sin(yaw)
        );

    if(keys["w"]){

        player.position.add(
            forward.clone().multiplyScalar(speed)
        );

    }

    if(keys["s"]){

        player.position.add(
            forward.clone().multiplyScalar(-speed)
        );

    }

    if(keys["a"]){

        player.position.add(
            right.clone().multiplyScalar(-speed)
        );

    }

    if(keys["d"]){

        player.position.add(
            right.clone().multiplyScalar(speed)
        );

    }

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -18,
            18
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -18,
            18
        );

    player.rotation.y = yaw;

    updateCamera();

}


// CAMERA FOLLOW

function updateCamera(){

    const offsetX =
        Math.sin(yaw) * cameraDistance;

    const offsetZ =
        Math.cos(yaw) * cameraDistance;

    camera.position.set(
        player.position.x + offsetX,
        player.position.y + cameraHeight +
        pitch * 2,
        player.position.z + offsetZ
    );

    const lookTarget =
        new THREE.Vector3(
            player.position.x,
            player.position.y + 1.2 +
            pitch * 2,
            player.position.z
        );

    camera.lookAt(
        lookTarget
    );

}


// ANIMATION

function animate(){

    requestAnimationFrame(
        animate
    );

    core.rotation.y += 0.005;

    updatePlayer();

    renderer.render(
        scene,
        camera
    );

}

animate();


// RESIZE

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);

</script>

</body>
</html>
