<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTERLIGHT 3D</title>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#05070b;
    font-family:Arial,sans-serif;
}

#game{
    width:100%;
    height:100%;
}

#hud{
    position:absolute;
    top:20px;
    left:20px;
    z-index:10;
    color:white;
    background:rgba(5,10,18,.75);
    border:1px solid rgba(0,220,255,.35);
    border-radius:12px;
    padding:15px 18px;
    backdrop-filter:blur(8px);
}

#hud h1{
    margin:0 0 5px;
    font-size:20px;
    letter-spacing:3px;
}

#status{
    color:#8deaff;
    font-size:13px;
}

#instructions{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    color:#aaa;
    background:rgba(0,0,0,.65);
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    <h1>AFTERLIGHT</h1>
    <div id="status">3D Multiplayer Foundation</div>
</div>

<div id="instructions">
    WASD = Move &nbsp; | &nbsp; Mouse = Look
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070b);

const camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);

camera.position.set(0,4,8);

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
);

document
.getElementById("game")
.appendChild(renderer.domElement);


// LIGHTING

const ambient = new THREE.AmbientLight(
    0x668899,
    1.5
);

scene.add(ambient);

const light = new THREE.PointLight(
    0x00ccff,
    20,
    40
);

light.position.set(0,8,0);

scene.add(light);


// FLOOR

const floorGeometry =
    new THREE.PlaneGeometry(40,40);

const floorMaterial =
    new THREE.MeshStandardMaterial({
        color:0x111820,
        metalness:.7,
        roughness:.35
    });

const floor =
    new THREE.Mesh(
        floorGeometry,
        floorMaterial
    );

floor.rotation.x = -Math.PI/2;

scene.add(floor);


// CENTRAL AFTERLIGHT CORE

const coreGeometry =
    new THREE.CylinderGeometry(
        1.5,
        1.5,
        5,
        32
    );

const coreMaterial =
    new THREE.MeshStandardMaterial({
        color:0x07151c,
        emissive:0x00aacc,
        emissiveIntensity:2,
        metalness:.8,
        roughness:.2
    });

const core =
    new THREE.Mesh(
        coreGeometry,
        coreMaterial
    );

core.position.y = 2.5;

scene.add(core);


// RINGS AROUND CORE

for(let i=0;i<3;i++){

    const ring =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                2+i*.7,
                .04,
                12,
                64
            ),
            new THREE.MeshBasicMaterial({
                color:0x00d9ff
            })
        );

    ring.rotation.x =
        Math.PI/2;

    ring.position.y =
        1+i*1.5;

    scene.add(ring);
}


// WALLS

function wall(x,z,w,d){

    const geometry =
        new THREE.BoxGeometry(
            w,
            5,
            d
        );

    const material =
        new THREE.MeshStandardMaterial({
            color:0x0a1018,
            metalness:.6,
            roughness:.4
        });

    const object =
        new THREE.Mesh(
            geometry,
            material
        );

    object.position.set(
        x,
        2.5,
        z
    );

    scene.add(object);
}

wall(0,-20,40,1);
wall(0,20,40,1);
wall(-20,0,1,40);
wall(20,0,1,40);


// PLAYER

const player =
    new THREE.Mesh(
        new THREE.CapsuleGeometry(
            .45,
            1.2,
            8,
            16
        ),
        new THREE.MeshStandardMaterial({
            color:0xeeeeee,
            emissive:0x003344,
            emissiveIntensity:.5
        })
    );

player.position.set(
    0,
    1.1,
    7
);

scene.add(player);


// MOVEMENT

const keys = {};

window.addEventListener(
    "keydown",
    e => keys[e.key.toLowerCase()] = true
);

window.addEventListener(
    "keyup",
    e => keys[e.key.toLowerCase()] = false
);


function updatePlayer(){

    const speed = .12;

    if(keys["w"])
        player.position.z -= speed;

    if(keys["s"])
        player.position.z += speed;

    if(keys["a"])
        player.position.x -= speed;

    if(keys["d"])
        player.position.x += speed;

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -18,
            18
        );

    player.position.z =
        THREE.MathUtils.clamp(
            player.position.z,
            -18,
            18
        );

    camera.position.x =
        player.position.x;

    camera.position.z =
        player.position.z + 8;

    camera.lookAt(
        player.position.x,
        1,
        player.position.z
    );
}


// ANIMATION

function animate(){

    requestAnimationFrame(
        animate
    );

    core.rotation.y += .005;

    updatePlayer();

    renderer.render(
        scene,
        camera
    );
}

animate();


// RESIZE

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);

</script>

</body>
</html>
