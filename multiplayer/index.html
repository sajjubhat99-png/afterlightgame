<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AFTERLIGHT — Multiplayer</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
      color: white;
      font-family: Arial, sans-serif;
    }

    #hud {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 10;
      background: rgba(5, 10, 15, 0.75);
      border: 1px solid rgba(0, 220, 255, 0.35);
      border-radius: 12px;
      padding: 14px 18px;
      backdrop-filter: blur(8px);
    }

    #hud h1 {
      margin: 0 0 6px;
      font-size: 22px;
      letter-spacing: 3px;
    }

    #status {
      font-size: 13px;
      color: #7eefff;
    }

    #players {
      margin-top: 8px;
      font-size: 12px;
      color: #b8cbd4;
    }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 8px;
      height: 8px;
      margin-left: -4px;
      margin-top: -4px;
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 50%;
      z-index: 5;
      pointer-events: none;
    }

    #help {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 16px;
      border-radius: 10px;
      background: rgba(5, 10, 15, 0.72);
      color: #b8cbd4;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>

<div id="hud">
  <h1>AFTERLIGHT</h1>
  <div id="status">Connecting...</div>
  <div id="players">Players: 0</div>
</div>

<div id="crosshair"></div>

<div id="help">
  WASD = Move · Mouse = Look · Click = Lock Camera
</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";


/* =========================
   SCENE
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x05070a);

scene.fog = new THREE.Fog(
  0x05070a,
  20,
  70
);


/* =========================
   CAMERA
========================= */

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);


/* =========================
   RENDERER
========================= */

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

document.body.appendChild(
  renderer.domElement
);


/* =========================
   LIGHTING
========================= */

const ambient = new THREE.AmbientLight(
  0x668899,
  1.4
);

scene.add(ambient);


const mainLight = new THREE.PointLight(
  0x00d9ff,
  7,
  40
);

mainLight.position.set(
  0,
  6,
  0
);

scene.add(mainLight);


/* =========================
   FLOOR
========================= */

const floorGeometry =
  new THREE.PlaneGeometry(
    50,
    50
  );

const floorMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x101820,
    metalness: 0.7,
    roughness: 0.35
  });

const floor =
  new THREE.Mesh(
    floorGeometry,
    floorMaterial
  );

floor.rotation.x =
  -Math.PI / 2;

scene.add(floor);


/* =========================
   WALLS
========================= */

const wallMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x0b151d,
    metalness: 0.7,
    roughness: 0.3
  });


function createWall(
  x,
  y,
  z,
  sx,
  sy,
  sz
) {

  const geometry =
    new THREE.BoxGeometry(
      sx,
      sy,
      sz
    );

  const wall =
    new THREE.Mesh(
      geometry,
      wallMaterial
    );

  wall.position.set(
    x,
    y,
    z
  );

  scene.add(wall);
}


createWall(
  0,
  5,
  -25,
  50,
  10,
  1
);

createWall(
  0,
  5,
  25,
  50,
  10,
  1
);

createWall(
  -25,
  5,
  0,
  1,
  10,
  50
);

createWall(
  25,
  5,
  0,
  1,
  10,
  50
);


/* =========================
   AFTERLIGHT CORE
========================= */

const coreGeometry =
  new THREE.CylinderGeometry(
    3,
    3,
    7,
    64
  );

const coreMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x061b24,
    emissive: 0x00d9ff,
    emissiveIntensity: 2.2,
    metalness: 0.8,
    roughness: 0.2
  });

const core =
  new THREE.Mesh(
    coreGeometry,
    coreMaterial
  );

core.position.y = 3.5;

scene.add(core);


/* =========================
   CORE RINGS
========================= */

for (let i = 0; i < 3; i++) {

  const ringGeometry =
    new THREE.TorusGeometry(
      4 + i * 0.8,
      0.08,
      16,
      100
    );

  const ringMaterial =
    new THREE.MeshBasicMaterial({
      color: 0x00eaff
    });

  const ring =
    new THREE.Mesh(
      ringGeometry,
      ringMaterial
    );

  ring.position.y =
    1.5 + i * 2;

  ring.rotation.x =
    Math.PI / 2;

  scene.add(ring);
}


/* =========================
   LOCAL PLAYER
========================= */

const playerGeometry =
  new THREE.CapsuleGeometry(
    0.45,
    1,
    8,
    16
  );

const playerMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x00d9ff,
    emissive: 0x003344,
    metalness: 0.5,
    roughness: 0.35
  });

const player =
  new THREE.Mesh(
    playerGeometry,
    playerMaterial
  );

player.position.set(
  0,
  1,
  8
);

scene.add(player);


/* =========================
   OTHER PLAYERS
========================= */

const otherPlayers =
  new Map();


function createOtherPlayer(data) {

  if (otherPlayers.has(data.id)) {
    return otherPlayers.get(data.id);
  }

  const geometry =
    new THREE.CapsuleGeometry(
      0.45,
      1,
      8,
      16
    );

  const material =
    new THREE.MeshStandardMaterial({
      color: 0xff4fd8,
      emissive: 0x330022,
      metalness: 0.4,
      roughness: 0.4
    });

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.position.set(
    data.x || 0,
    data.y || 1,
    data.z || 0
  );

  scene.add(mesh);

  otherPlayers.set(
    data.id,
    mesh
  );

  return mesh;
}


function updatePlayers(list) {

  const activeIds =
    new Set();

  for (const data of list) {

    activeIds.add(data.id);

    if (data.id === myId) {
      continue;
    }

    const mesh =
      createOtherPlayer(data);

    mesh.position.set(
      data.x,
      data.y,
      data.z
    );
  }

  for (
    const [id, mesh]
    of otherPlayers
  ) {

    if (!activeIds.has(id)) {

      scene.remove(mesh);

      otherPlayers.delete(id);
    }
  }

  document.getElementById(
    "players"
  ).textContent =
    "Players: " + list.length;
}


/* =========================
   MULTIPLAYER
========================= */

let socket = null;

let myId = null;

const SERVER =
  "wss://afterlightgame.sajjubhat99.workers.dev/ws";


function connectMultiplayer() {

  socket =
    new WebSocket(SERVER);

  socket.addEventListener(
    "open",
    () => {

      document.getElementById(
        "status"
      ).textContent =
        "● Multiplayer connected";

      socket.send(
        JSON.stringify({
          type: "join",
          name: "YOU"
        })
      );
    }
  );


  socket.addEventListener(
    "message",
    event => {

      try {

        const message =
          JSON.parse(
            event.data
          );

        if (
          message.type ===
          "welcome"
        ) {

          myId =
            message.id;

          updatePlayers(
            message.players
          );
        }

        if (
          message.type ===
          "players"
        ) {

          updatePlayers(
            message.players
          );
        }

      } catch (error) {

        console.error(
          "Server message error:",
          error
        );
      }
    }
  );


  socket.addEventListener(
    "close",
    () => {

      document.getElementById(
        "status"
      ).textContent =
        "○ Multiplayer disconnected";

    }
  );


  socket.addEventListener(
    "error",
    () => {

      document.getElementById(
        "status"
      ).textContent =
        "⚠ Multiplayer connection error";

    }
  );
}


connectMultiplayer();


/* =========================
   MOVEMENT
========================= */

const keys = {};

window.addEventListener(
  "keydown",
  event => {

    keys[event.code] = true;
  }
);


window.addEventListener(
  "keyup",
  event => {

    keys[event.code] = false;
  }
);


/* =========================
   MOUSE LOOK
========================= */

let yaw = 0;

let pitch = -0.15;

document.body.addEventListener(
  "click",
  () => {

    if (
      document.pointerLockElement !==
      document.body
    ) {

      document.body.requestPointerLock();

    }

  }
);


document.addEventListener(
  "mousemove",
  event => {

    if (
      document.pointerLockElement !==
      document.body
    ) {
      return;
    }

    yaw -=
      event.movementX * 0.002;

    pitch -=
      event.movementY * 0.002;

    pitch =
      Math.max(
        -1.2,
        Math.min(
          0.7,
          pitch
        )
      );

  }
);


/* =========================
   GAME LOOP
========================= */

const clock =
  new THREE.Clock();

let networkTimer = 0;


function animate() {

  requestAnimationFrame(
    animate
  );

  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );


  /* Movement */

  const speed =
    5 * delta;

  const forward =
    new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );

  const right =
    new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );


  if (keys["KeyW"]) {

    player.position.addScaledVector(
      forward,
      speed
    );

  }

  if (keys["KeyS"]) {

    player.position.addScaledVector(
      forward,
      -speed
    );

  }

  if (keys["KeyA"]) {

    player.position.addScaledVector(
      right,
      -speed
    );

  }

  if (keys["KeyD"]) {

    player.position.addScaledVector(
      right,
      speed
    );

  }


  /* Keep inside facility */

  player.position.x =
    Math.max(
      -22,
      Math.min(
        22,
        player.position.x
      )
    );

  player.position.z =
    Math.max(
      -22,
      Math.min(
        22,
        player.position.z
      )
    );


  /* Send position */

  networkTimer += delta;

  if (
    networkTimer >= 0.05 &&
    socket &&
    socket.readyState ===
      WebSocket.OPEN
  ) {

    networkTimer = 0;

    socket.send(
      JSON.stringify({
        type: "move",
        x: player.position.x,
        y: player.position.y,
        z: player.position.z
      })
    );
  }


  /* Camera */

  const cameraDistance =
    7;

  const cameraHeight =
    3.5;

  camera.position.x =
    player.position.x -
    Math.sin(yaw) *
    cameraDistance;

  camera.position.y =
    player.position.y +
    cameraHeight +
    Math.sin(pitch) * 2;

  camera.position.z =
    player.position.z -
    Math.cos(yaw) *
    cameraDistance;


  const lookTarget =
    new THREE.Vector3(
      player.position.x,
      player.position.y + 1,
      player.position.z
    );

  camera.lookAt(
    lookTarget
  );


  /* Core animation */

  core.rotation.y +=
    delta * 0.4;


  renderer.render(
    scene,
    camera
  );
}


animate();


/* =========================
   RESIZE
========================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

</script>

</body>
</html>
