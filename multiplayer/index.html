<script type="module">

import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { AfterlightWorld }
  from "./world.js";

import { AfterlightPlayer }
  from "./player.js";


/* =========================================================
   CONNECTION
========================================================= */

const SERVER_URL =
  "wss://afterlightgame.sajjubhat99.workers.dev/ws";

const MAX_PLAYERS = 16;


/* =========================================================
   DOM
========================================================= */

const canvas =
  document.getElementById("game");

const joinScreen =
  document.getElementById("joinScreen");

const hud =
  document.getElementById("hud");

const nameInput =
  document.getElementById("nameInput");

const joinButton =
  document.getElementById("joinButton");

const connectionStatus =
  document.getElementById("connectionStatus");

const phaseElement =
  document.getElementById("phase");

const creditsElement =
  document.getElementById("credits");

const influenceElement =
  document.getElementById("influence");

const trustElement =
  document.getElementById("trust");

const energyElement =
  document.getElementById("energy");

const playerCountElement =
  document.getElementById("playerCount");

const competitorsElement =
  document.getElementById("competitors");

const logElement =
  document.getElementById("log");

const locationText =
  document.getElementById("locationText");


/* =========================================================
   THREE.JS
========================================================= */

const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x02070b);

scene.fog =
  new THREE.FogExp2(
    0x02070b,
    0.018
  );


const camera =
  new THREE.PerspectiveCamera(
    60,
    window.innerWidth /
      window.innerHeight,
    0.1,
    1000
  );

camera.position.set(
  0,
  7,
  12
);


const renderer =
  new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    powerPreference: "high-performance"
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    1.5
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


/* =========================================================
   WORLD
========================================================= */

const world =
  new AfterlightWorld(
    scene
  );


/* =========================================================
   STATE
========================================================= */

let socket = null;

let connected = false;

let joined = false;

let joinRequested = false;

let localPlayerId = null;

let localPlayer = null;

let reconnectTimer = null;

const players =
  new Map();

const keys = {
  w: false,
  a: false,
  s: false,
  d: false,
  ArrowUp: false,
  ArrowDown: false,
  ArrowLeft: false,
  ArrowRight: false
};

const movement =
  new THREE.Vector3();

const clock =
  new THREE.Clock();


/* =========================================================
   HELPERS
========================================================= */

function safeNumber(
  value,
  fallback = 0
) {

  const number =
    Number(value);

  return Number.isFinite(number)
    ? number
    : fallback;
}


function addLog(
  message
) {

  if (!message) {
    return;
  }

  const line =
    document.createElement(
      "div"
    );

  line.className =
    "logLine";

  line.textContent =
    `[${new Date().toLocaleTimeString()}] ${message}`;

  logElement.appendChild(
    line
  );

  while (
    logElement.children.length > 80
  ) {

    logElement.removeChild(
      logElement.firstChild
    );
  }

  logElement.scrollTop =
    logElement.scrollHeight;
}


function showGame() {

  joinScreen.style.display =
    "none";

  hud.style.display =
    "block";

  joined = true;
}


function updateStats(
  data
) {

  if (!data) {
    return;
  }

  creditsElement.textContent =
    safeNumber(
      data.credits,
      500
    );

  influenceElement.textContent =
    safeNumber(
      data.influence,
      10
    );

  trustElement.textContent =
    safeNumber(
      data.trust,
      50
    );

  energyElement.textContent =
    safeNumber(
      data.energy,
      100
    );
}


function updatePhase(
  data
) {

  if (!data) {
    return;
  }

  const phase =
    data.phase ||
    data.currentPhase ||
    "LOBBY";

  phaseElement.textContent =
    String(
      phase
    ).toUpperCase();

  if (
    phase === "CHALLENGE"
  ) {

    locationText.textContent =
      "CHALLENGE ARENA";

  } else if (
    phase === "SOCIAL"
  ) {

    locationText.textContent =
      "SOCIAL FACILITY";

  } else if (
    phase === "VOTING"
  ) {

    locationText.textContent =
      "VOTING ROOM";

  } else {

    locationText.textContent =
      "AFTERLIGHT FACILITY";
  }
}


/* =========================================================
   PLAYER SYSTEM
========================================================= */

function createPlayer(
  data
) {

  if (
    !data ||
    !data.id
  ) {
    return null;
  }

  const isLocal =
    data.id === localPlayerId;

  const player =
    new AfterlightPlayer(
      scene,
      data,
      isLocal
    );

  player.updateFromServer(
    data
  );

  players.set(
    data.id,
    player
  );

  if (isLocal) {
    localPlayer =
      player;
  }

  return player;
}


function updatePlayer(
  data
) {

  if (
    !data ||
    !data.id
  ) {
    return;
  }

  let player =
    players.get(
      data.id
    );

  if (!player) {
    player =
      createPlayer(
        data
      );
  }

  if (!player) {
    return;
  }

  player.updateFromServer(
    data
  );

  if (
    data.id === localPlayerId
  ) {
    localPlayer =
      player;
  }
}


function updatePlayers(
  serverPlayers
) {

  if (
    !Array.isArray(
      serverPlayers
    )
  ) {
    return;
  }

  const ids =
    new Set();

  for (
    const data
    of serverPlayers
  ) {

    if (!data || !data.id) {
      continue;
    }

    ids.add(
      data.id
    );

    updatePlayer(
      data
    );
  }


  for (
    const [id, player]
    of players
  ) {

    if (
      !ids.has(id)
    ) {

      player.remove();

      players.delete(
        id
      );

      if (
        id === localPlayerId
      ) {
        localPlayer = null;
      }
    }
  }


  playerCountElement.textContent =
    `${serverPlayers.length}/${MAX_PLAYERS}`;

  renderCompetitorList(
    serverPlayers
  );
}


function renderCompetitorList(
  list
) {

  competitorsElement.innerHTML =
    "";

  if (
    !Array.isArray(list)
  ) {
    return;
  }

  for (
    const player
    of list
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "competitor";

    if (
      player.alive === false
    ) {
      row.classList.add(
        "dead"
      );
    }

    const name =
      document.createElement(
        "span"
      );

    name.className =
      "competitorName";

    name.textContent =
      player.id === localPlayerId
        ? `${player.name || "YOU"} ★`
        : player.name || "Competitor";

    const role =
      document.createElement(
        "span"
      );

    role.className =
      "competitorRole";

    role.textContent =
      player.role ||
      "Competitor";

    row.appendChild(
      name
    );

    row.appendChild(
      role
    );

    competitorsElement.appendChild(
      row
    );
  }
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(
  delta
) {

  if (!localPlayer) {
    return;
  }

  const group =
    localPlayer.group;

  if (!group) {
    return;
  }

  const target =
    new THREE.Vector3(
      group.position.x,
      group.position.y + 5.5,
      group.position.z + 9
    );

  camera.position.lerp(
    target,
    Math.min(
      1,
      delta * 5
    )
  );

  const lookTarget =
    new THREE.Vector3(
      group.position.x,
      group.position.y + 1.2,
      group.position.z
    );

  camera.lookAt(
    lookTarget
  );
}


/* =========================================================
   MOVEMENT
========================================================= */

function updateMovement(
  delta
) {

  if (
    !localPlayer ||
    !localPlayer.group
  ) {
    return;
  }

  movement.set(
    0,
    0,
    0
  );

  if (
    keys.w ||
    keys.ArrowUp
  ) {
    movement.z -= 1;
  }

  if (
    keys.s ||
    keys.ArrowDown
  ) {
    movement.z += 1;
  }

  if (
    keys.a ||
    keys.ArrowLeft
  ) {
    movement.x -= 1;
  }

  if (
    keys.d ||
    keys.ArrowRight
  ) {
    movement.x += 1;
  }

  if (
    movement.lengthSq() === 0
  ) {
    return;
  }

  movement.normalize();

  const speed =
    6 * delta;

  const current =
    localPlayer.group.position;

  const nextX =
    THREE.MathUtils.clamp(
      current.x +
        movement.x *
        speed,
      -22,
      22
    );

  const nextZ =
    THREE.MathUtils.clamp(
      current.z +
        movement.z *
        speed,
      -22,
      22
    );

  localPlayer.setLocalPosition(
    nextX,
    current.y,
    nextZ
  );

  send({
    type: "move",
    x: nextX,
    y: current.y,
    z: nextZ
  });
}


/* =========================================================
   WEBSOCKET
========================================================= */

function connect() {

  if (
    socket &&
    (
      socket.readyState ===
      WebSocket.OPEN ||
      socket.readyState ===
      WebSocket.CONNECTING
    )
  ) {
    return;
  }

  connectionStatus.textContent =
    "Connecting to AFTERLIGHT...";

  try {

    socket =
      new WebSocket(
        SERVER_URL
      );

  } catch {

    connectionStatus.textContent =
      "Unable to connect.";

    scheduleReconnect();

    return;
  }


  socket.addEventListener(
    "open",
    () => {

      connected = true;

      connectionStatus.textContent =
        "Connected to AFTERLIGHT.";

      addLog(
        "Connection established."
      );

      if (
        joinRequested
      ) {
        sendJoin();
      }
    }
  );


  socket.addEventListener(
    "message",
    event => {

      let message;

      try {

        message =
          JSON.parse(
            event.data
          );

      } catch {

        return;
      }

      handleMessage(
        message
      );
    }
  );


  socket.addEventListener(
    "close",
    () => {

      connected = false;

      connectionStatus.textContent =
        "Connection lost. Reconnecting...";

      addLog(
        "Connection lost."
      );

      scheduleReconnect();
    }
  );


  socket.addEventListener(
    "error",
    () => {

      connected = false;

      connectionStatus.textContent =
        "Connection error.";
    }
  );
}


function scheduleReconnect() {

  if (
    reconnectTimer
  ) {
    return;
  }

  reconnectTimer =
    setTimeout(
      () => {

        reconnectTimer =
          null;

        connect();

      },
      4000
    );
}


function send(
  message
) {

  if (
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ) {
    return false;
  }

  try {

    socket.send(
      JSON.stringify(
        message
      )
    );

    return true;

  } catch {

    return false;
  }
}


function sendJoin() {

  if (!connected) {
    return;
  }

  const name =
    nameInput.value.trim()
    || "Competitor";

  send({
    type: "join",
    name
  });
}


/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleMessage(
  message
) {

  if (!message) {
    return;
  }


  if (
    message.type ===
    "welcome"
  ) {

    localPlayerId =
      message.id ||
      message.playerId ||
      message.player?.id ||
      localPlayerId;

    showGame();

    addLog(
      "Welcome to AFTERLIGHT."
    );

    if (
      Array.isArray(
        message.players
      )
    ) {

      updatePlayers(
        message.players
      );
    }

    if (
      message.state
    ) {

      updatePhase(
        message.state
      );

      updateStats(
        message.state.self ||
        message.state.player ||
        message.state
      );
    }

    return;
  }


  if (
    message.type ===
    "players"
  ) {

    updatePlayers(
      message.players
    );

    return;
  }


  if (
    message.type ===
    "state"
  ) {

    const state =
      message.state ||
      message;

    updatePhase(
      state
    );

    updateStats(
      state.self ||
      state.player ||
      state
    );

    if (
      Array.isArray(
        state.players
      )
    ) {

      updatePlayers(
        state.players
      );
    }

    if (
      state.message
    ) {

      addLog(
        state.message
      );
    }

    return;
  }


  if (
    message.type ===
    "log"
  ) {

    addLog(
      message.message ||
      message.text
    );

    return;
  }


  if (
    message.type ===
    "error"
  ) {

    addLog(
      `ERROR: ${message.message || "Unknown error"}`
    );

    return;
  }


  if (
    Array.isArray(
      message.players
    )
  ) {

    updatePlayers(
      message.players
    );
  }

  if (
    message.state
  ) {

    updatePhase(
      message.state
    );

    updateStats(
      message.state.self ||
      message.state.player ||
      message.state
    );
  }

  if (
    message.message
  ) {

    addLog(
      message.message
    );
  }
}

function bindMobileButton(
  elementId,
  key
) {

  const button =
    document.getElementById(
      elementId

  button.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();

      keys[key] = true;
    }
  );

  button.addEventListener(
    "pointerup",
    event => {

      event.preventDefault();

      keys[key] = false;
    }
  );

  button.addEventListener(
    "pointercancel",
    event => {

      event.preventDefault();

      keys[key] = false;
    }
  );

  button.addEventListener(
    "pointerleave",
    event => {

      event.preventDefault();

      keys[key] = false;
    }
  );
}
