<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTERLIGHT — Multiplayer</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02070a;
  color: #e9ffff;
  font-family: Arial, Helvetica, sans-serif;
}

canvas {
  display: block;
}

#game {
  position: fixed;
  inset: 0;
}

#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.topbar {
  position: absolute;
  top: 16px;
  left: 16px;
  right: 16px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.logo {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 5px;
  color: #9effff;
  text-shadow: 0 0 18px #00eaff;
}

.status {
  margin-top: 5px;
  font-size: 11px;
  color: #74a9ad;
  letter-spacing: 2px;
}

.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: flex-end;
}

.stat {
  min-width: 78px;
  padding: 8px 10px;
  background: rgba(2, 13, 17, .82);
  border: 1px solid rgba(0, 238, 255, .3);
  border-radius: 8px;
  text-align: center;
}

.stat small {
  display: block;
  color: #6c9da1;
  font-size: 9px;
  letter-spacing: 1px;
}

.stat strong {
  display: block;
  margin-top: 3px;
  color: #bfffff;
}

.panel {
  position: absolute;
  background: rgba(2, 10, 14, .9);
  border: 1px solid rgba(0, 238, 255, .25);
  border-radius: 10px;
  box-shadow: 0 0 30px rgba(0, 200, 255, .08);
  pointer-events: auto;
  backdrop-filter: blur(10px);
}

#phasePanel {
  top: 95px;
  left: 16px;
  width: 270px;
  padding: 14px;
}

.phaseTitle {
  color: #00eaff;
  font-size: 11px;
  letter-spacing: 2px;
}

.phaseName {
  margin-top: 5px;
  font-size: 22px;
  font-weight: 800;
}

.challengeName {
  margin-top: 8px;
  color: #a8c9cc;
  font-size: 12px;
}

#playersPanel {
  top: 95px;
  right: 16px;
  width: 240px;
  max-height: 48vh;
  overflow: auto;
  padding: 12px;
}

.panelTitle {
  color: #00eaff;
  font-size: 10px;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.player {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 7px 5px;
  border-bottom: 1px solid rgba(255,255,255,.06);
  font-size: 11px;
}

.player.dead {
  opacity: .35;
}

.playerName {
  color: #dfffff;
}

.playerRole {
  color: #628c90;
  font-size: 9px;
}

#controls {
  position: absolute;
  left: 16px;
  bottom: 16px;
  width: 330px;
  padding: 12px;
}

button {
  appearance: none;
  border: 1px solid rgba(0,238,255,.35);
  background: rgba(3, 24, 29, .92);
  color: #bfffff;
  border-radius: 7px;
  padding: 9px 11px;
  margin: 3px;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
}

button:hover {
  background: rgba(0, 190, 210, .2);
  border-color: #00eaff;
}

button.primary {
  background: rgba(0, 205, 220, .18);
  border-color: #00eaff;
}

button.danger {
  border-color: rgba(255,70,100,.6);
  color: #ff9eaa;
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
}

.row {
  display: flex;
  flex-wrap: wrap;
  margin: 3px -3px;
}

#logPanel {
  position: absolute;
  right: 16px;
  bottom: 16px;
  width: 330px;
  max-height: 180px;
  overflow: auto;
  padding: 12px;
}

.log {
  font-size: 10px;
  line-height: 1.5;
  color: #86aeb1;
  border-bottom: 1px solid rgba(255,255,255,.04);
  padding: 4px 0;
}

#crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 12px;
  height: 12px;
  transform: translate(-50%, -50%);
}

#crosshair::before,
#crosshair::after {
  content: "";
  position: absolute;
  background: rgba(180,255,255,.8);
}

#crosshair::before {
  width: 12px;
  height: 1px;
  top: 5px;
  left: 0;
}

#crosshair::after {
  width: 1px;
  height: 12px;
  top: 0;
  left: 5px;
}

#join {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0, 5, 8, .9);
  pointer-events: auto;
  z-index: 10;
}

.joinBox {
  width: min(420px, calc(100% - 30px));
  padding: 30px;
  background: rgba(3, 15, 20, .96);
  border: 1px solid rgba(0,238,255,.35);
  border-radius: 14px;
  text-align: center;
  box-shadow: 0 0 70px rgba(0,200,255,.1);
}

.joinLogo {
  font-size: 35px;
  font-weight: 900;
  letter-spacing: 7px;
  color: #a9ffff;
  text-shadow: 0 0 25px #00eaff;
}

.joinSubtitle {
  margin: 12px 0 25px;
  color: #719da1;
  font-size: 11px;
  letter-spacing: 2px;
}

input {
  width: 100%;
  padding: 13px;
  border-radius: 7px;
  border: 1px solid rgba(0,238,255,.3);
  background: #020a0d;
  color: white;
  outline: none;
  margin-bottom: 10px;
}

input:focus {
  border-color: #00eaff;
}

#message {
  margin-top: 10px;
  color: #719da1;
  font-size: 10px;
}

#mobileControls {
  display: none;
  position: absolute;
  bottom: 20px;
  right: 20px;
  pointer-events: auto;
}

.mobileBtn {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  padding: 0;
  font-size: 16px;
}

@media (max-width: 800px) {
  .stats {
    max-width: 55%;
  }

  .stat {
    min-width: 60px;
    padding: 6px;
  }

  #playersPanel {
    width: 180px;
  }

  #phasePanel {
    width: 210px;
  }

  #logPanel {
    width: 230px;
  }
}

@media (max-width: 600px) {
  .logo {
    font-size: 18px;
  }

  #playersPanel {
    display: none;
  }

  #phasePanel {
    top: 75px;
    width: 190px;
  }

  #controls {
    width: calc(100% - 32px);
  }

  #logPanel {
    display: none;
  }

  #mobileControls {
    display: block;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

  <div class="topbar">
    <div>
      <div class="logo">AFTERLIGHT</div>
      <div class="status" id="connection">CONNECTING</div>
    </div>

    <div class="stats">
      <div class="stat">
        <small>CREDITS</small>
        <strong id="credits">500</strong>
      </div>

      <div class="stat">
        <small>INFLUENCE</small>
        <strong id="influence">10</strong>
      </div>

      <div class="stat">
        <small>TRUST</small>
        <strong id="trust">50</strong>
      </div>

      <div class="stat">
        <small>ENERGY</small>
        <strong id="energy">100</strong>
      </div>

      <div class="stat">
        <small>PLAYERS</small>
        <strong id="playerCount">0/16</strong>
      </div>
    </div>
  </div>

  <div id="phasePanel" class="panel">
    <div class="phaseTitle">CURRENT PHASE</div>
    <div class="phaseName" id="phase">LOBBY</div>
    <div class="challengeName" id="challenge">
      Waiting for competitors...
    </div>
  </div>

  <div id="playersPanel" class="panel">
    <div class="panelTitle">COMPETITORS</div>
    <div id="players"></div>
  </div>

  <div id="controls" class="panel">

    <div class="panelTitle">GAME ACTIONS</div>

    <div class="row">
      <button id="readyBtn" class="primary">READY</button>
      <button id="startBtn" class="primary">START GAME</button>
    </div>

    <div class="row">
      <button data-challenge="safe">SAFE</button>
      <button data-challenge="risk">RISK</button>
      <button data-challenge="observe">OBSERVE</button>
    </div>

    <div class="row">
      <button data-social="talk">TALK</button>
      <button data-social="accuse">ACCUSE</button>
      <button data-social="deal">DEAL</button>
      <button data-social="end">END SOCIAL</button>
    </div>

    <div class="row">
      <button id="missionBtn">SECRET MISSION</button>
      <button id="parallelBtn">PARALLEL WORLD</button>
      <button id="architectBtn">ARCHITECT</button>
      <button id="heistBtn">SHADOW PROTOCOL</button>
      <button id="vacationBtn">VACATION</button>
    </div>

    <div class="panelTitle" style="margin-top:10px">
      POWER STORE
    </div>

    <div class="row" id="powers"></div>

    <div class="panelTitle" style="margin-top:10px">
      VOTING
    </div>

    <div class="row" id="voteButtons"></div>

  </div>

  <div id="logPanel" class="panel">
    <div class="panelTitle">AFTERLIGHT LOG</div>
    <div id="logs"></div>
  </div>

  <div id="crosshair"></div>

  <div id="mobileControls">
    <div>
      <button class="mobileBtn" data-move="forward">▲</button>
    </div>
    <div>
      <button class="mobileBtn" data-move="left">◀</button>
      <button class="mobileBtn" data-move="back">▼</button>
      <button class="mobileBtn" data-move="right">▶</button>
    </div>
  </div>

</div>

<div id="join">

  <div class="joinBox">

    <div class="joinLogo">AFTERLIGHT</div>

    <div class="joinSubtitle">
      THE CHALLENGE IS ONLY HALF THE GAME
    </div>

    <input
      id="nameInput"
      maxlength="20"
      placeholder="Enter competitor name"
      value="YOU"
    >

    <button
      id="joinBtn"
      class="primary"
      style="width:100%; padding:13px"
    >
      ENTER AFTERLIGHT
    </button>

    <div id="message">
      Connecting to the AFTERLIGHT network...
    </div>

  </div>

</div>

<script type="module">

import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

/* =========================================================
   CONFIGURATION
========================================================= */

const SERVER =
  "wss://afterlightgame.sajjubhat99.workers.dev/ws";

/* =========================================================
   THREE.JS WORLD
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x02070a);

scene.fog = new THREE.FogExp2(
  0x02070a,
  0.035
);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  500
);

camera.position.set(
  0,
  2.5,
  8
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.shadowMap.enabled = true;

document
  .getElementById("game")
  .appendChild(renderer.domElement);

/* =========================================================
   LIGHTING
========================================================= */

const ambient = new THREE.AmbientLight(
  0x4d777a,
  1.2
);

scene.add(ambient);

const coreLight = new THREE.PointLight(
  0x00eaff,
  12,
  35
);

coreLight.position.set(
  0,
  5,
  0
);

scene.add(coreLight);

const redLight = new THREE.PointLight(
  0xff174f,
  5,
  20
);

redLight.position.set(
  0,
  3,
  -18
);

scene.add(redLight);

/* =========================================================
   MATERIALS
========================================================= */

const floorMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x071417,
    metalness: 0.8,
    roughness: 0.3
  });

const wallMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x0a1c20,
    metalness: 0.7,
    roughness: 0.35
  });

const glassMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x07333a,
    transparent: true,
    opacity: 0.5,
    metalness: 0.8,
    roughness: 0.1
  });

const cyanMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x00eaff,
    emissive: 0x00aabb,
    emissiveIntensity: 3,
    metalness: 0.5,
    roughness: 0.2
  });

/* =========================================================
   FLOOR
========================================================= */

const floor = new THREE.Mesh(
  new THREE.BoxGeometry(
    52,
    0.5,
    52
  ),
  floorMaterial
);

floor.position.y = -0.25;

floor.receiveShadow = true;

scene.add(floor);

/* =========================================================
   GRID
========================================================= */

const grid = new THREE.GridHelper(
  50,
  50,
  0x0b5960,
  0x06272b
);

grid.position.y = 0.02;

scene.add(grid);

/* =========================================================
   WALLS
========================================================= */

function createWall(
  x,
  y,
  z,
  width,
  height,
  depth
) {

  const wall = new THREE.Mesh(
    new THREE.BoxGeometry(
      width,
      height,
      depth
    ),
    wallMaterial
  );

  wall.position.set(
    x,
    y,
    z
  );

  wall.castShadow = true;
  wall.receiveShadow = true;

  scene.add(wall);

  return wall;
}

createWall(
  0,
  5,
  -25,
  52,
  10,
  1
);

createWall(
  0,
  5,
  25,
  52,
  10,
  1
);

createWall(
  -25,
  5,
  0,
  1,
  10,
  52
);

createWall(
  25,
  5,
  0,
  1,
  10,
  52
);

/* =========================================================
   ARCHITECTURE
========================================================= */

function createColumn(x, z) {

  const column = new THREE.Mesh(
    new THREE.BoxGeometry(
      1.2,
      8,
      1.2
    ),
    wallMaterial
  );

  column.position.set(
    x,
    4,
    z
  );

  scene.add(column);

  const light = new THREE.PointLight(
    0x00eaff,
    2,
    8
  );

  light.position.set(
    x,
    6,
    z
  );

  scene.add(light);
}

for (let x = -18; x <= 18; x += 9) {

  createColumn(
    x,
    -18
  );

  createColumn(
    x,
    18
  );
}

/* =========================================================
   AFTERLIGHT CORE
========================================================= */

const coreGroup =
  new THREE.Group();

scene.add(coreGroup);

const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(
    2.2,
    2
  ),
  cyanMaterial
);

core.position.y = 3;

coreGroup.add(core);

for (let i = 0; i < 3; i++) {

  const ring = new THREE.Mesh(
    new THREE.TorusGeometry(
      3.2 + i * 1.1,
      0.08,
      16,
      80
    ),
    cyanMaterial
  );

  ring.position.y = 3;

  ring.rotation.x =
    Math.PI / 2 +
    i * 0.5;

  coreGroup.add(ring);
}

/* =========================================================
   PLAYER SYSTEM
========================================================= */

const players = new Map();

let myId = null;

let myPlayer = null;

const playerMeshes =
  new Map();

function createPlayerMesh(
  color = 0x00eaff
) {

  const group =
    new THREE.Group();

  const body = new THREE.Mesh(
    new THREE.CapsuleGeometry(
      0.45,
      1.1,
      8,
      16
    ),
    new THREE.MeshStandardMaterial({
      color,
      emissive: color,
      emissiveIntensity: 0.3,
      metalness: 0.4,
      roughness: 0.4
    })
  );

  body.position.y = 1;

  body.castShadow = true;

  group.add(body);

  return group;
}

function updatePlayerMesh(
  data
) {

  let mesh =
    playerMeshes.get(data.id);

  if (!mesh) {

    const color =
      data.id === myId
        ? 0x00eaff
        : 0xff3f91;

    mesh =
      createPlayerMesh(color);

    scene.add(mesh);

    playerMeshes.set(
      data.id,
      mesh
    );
  }

  mesh.position.set(
    data.x,
    data.y - 1,
    data.z
  );

  if (!data.alive) {
    mesh.visible = false;
  } else {
    mesh.visible = true;
  }
}

/* =========================================================
   CAMERA / MOVEMENT
========================================================= */

const keys = {};

let yaw = 0;
let pitch = 0;

const speed = 0.13;

window.addEventListener(
  "keydown",
  event => {
    keys[event.code] = true;
  }
);

window.addEventListener(
  "keyup",
  event => {
    keys[event.code] = false;
  }
);

renderer.domElement.addEventListener(
  "click",
  () => {

    if (
      document.pointerLockElement !==
      renderer.domElement
    ) {

      renderer.domElement.requestPointerLock();
    }
  }
);

document.addEventListener(
  "mousemove",
  event => {

    if (
      document.pointerLockElement !==
      renderer.domElement
    ) {
      return;
    }

    yaw -= event.movementX * 0.002;

    pitch -= event.movementY * 0.002;

    pitch = Math.max(
      -1.2,
      Math.min(
        1.2,
        pitch
      )
    );
  }
);

function updateMovement() {

  if (!myPlayer) {
    return;
  }

  let dx = 0;
  let dz = 0;

  if (
    keys["KeyW"] ||
    keys["ArrowUp"]
  ) {
    dz -= 1;
  }

  if (
    keys["KeyS"] ||
    keys["ArrowDown"]
  ) {
    dz += 1;
  }

  if (
    keys["KeyA"] ||
    keys["ArrowLeft"]
  ) {
    dx -= 1;
  }

  if (
    keys["KeyD"] ||
    keys["ArrowRight"]
  ) {
    dx += 1;
  }

  if (
    dx === 0 &&
    dz === 0
  ) {
    return;
  }

  const length =
    Math.sqrt(
      dx * dx +
      dz * dz
    );

  dx /= length;
  dz /= length;

  const sin =
    Math.sin(yaw);

  const cos =
    Math.cos(yaw);

  const worldX =
    dx * cos -
    dz * sin;

  const worldZ =
    dx * sin +
    dz * cos;

  myPlayer.x +=
    worldX * speed;

  myPlayer.z +=
    worldZ * speed;

  myPlayer.x =
    Math.max(
      -22,
      Math.min(
        22,
        myPlayer.x
      )
    );

  myPlayer.z =
    Math.max(
      -22,
      Math.min(
        22,
        myPlayer.z
      )
    );

  send({
    type: "move",
    x: myPlayer.x,
    y: myPlayer.y,
    z: myPlayer.z
  });
}

function updateCamera() {

  if (!myPlayer) {
    return;
  }

  const target =
    new THREE.Vector3(
      myPlayer.x,
      myPlayer.y + 1.3,
      myPlayer.z
    );

  camera.position.lerp(
    target,
    0.15
  );

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    yaw;

  camera.rotation.x =
    pitch;
}

/* =========================================================
   WEBSOCKET
========================================================= */

let socket = null;

function connect() {

  socket =
    new WebSocket(SERVER);

  socket.addEventListener(
    "open",
    () => {

      document
        .getElementById(
          "connection"
        )
        .textContent =
        "CONNECTED";

      document
        .getElementById(
          "message"
        )
        .textContent =
        "Connected. Enter your competitor identity.";

    }
  );

  socket.addEventListener(
    "message",
    event => {

      let message;

      try {
        message =
          JSON.parse(
            event.data
          );
      } catch {
        return;
      }

      if (
        message.type ===
        "welcome"
      ) {

        myId =
          message.id;

        myPlayer =
          message.player;

        updateRoom(
          message.room
        );

        document
          .getElementById(
            "message"
          )
          .textContent =
          "Connection established.";
      }

      if (
        message.type ===
        "state"
      ) {

        updateRoom(
          message.room
        );
      }

    }
  );

  socket.addEventListener(
    "close",
    () => {

      document
        .getElementById(
          "connection"
        )
        .textContent =
        "DISCONNECTED";
    }
  );

  socket.addEventListener(
    "error",
    () => {

      document
        .getElementById(
          "connection"
        )
        .textContent =
        "CONNECTION ERROR";
    }
  );
}

function send(message) {

  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify(
        message
      )
    );
  }
}

/* =========================================================
   ROOM STATE
========================================================= */

function updateRoom(room) {

  if (!room) {
    return;
  }

  document
    .getElementById(
      "phase"
    )
    .textContent =
    room.phase;

  document
    .getElementById(
      "playerCount"
    )
    .textContent =
    `${room.players.length}/16`;

  if (
    room.challenge
  ) {

    document
      .getElementById(
        "challenge"
      )
      .textContent =
      room.challenge.name;
  } else {

    document
      .getElementById(
        "challenge"
      )
      .textContent =
      "No active challenge";
  }

  room.players.forEach(
    player => {

      players.set(
        player.id,
        player
      );

      updatePlayerMesh(
        player
      );

      if (
        player.id === myId
      ) {

        myPlayer =
          player;

        document
          .getElementById(
            "credits"
          )
          .textContent =
          player.credits;

        document
          .getElementById(
            "influence"
          )
          .textContent =
          player.influence;

        document
          .getElementById(
            "trust"
          )
          .textContent =
          player.trust;

        document
          .getElementById(
            "energy"
          )
          .textContent =
          player.energy;
      }
    }
  );

  renderPlayers(
    room.players
  );

  renderVotes(
    room.players,
    room.phase
  );

  renderLogs(
    room.log
  );
}

/* =========================================================
   UI
========================================================= */

function renderPlayers(
  list
) {

  const container =
    document.getElementById(
      "players"
    );

  container.innerHTML = "";

  list.forEach(
    player => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "player" +
        (
          player.alive
            ? ""
            : " dead"
        );

      row.innerHTML = `
        <div>
          <div class="playerName">
            ${escapeHTML(player.name)}
          </div>
          <div class="playerRole">
            ${escapeHTML(player.role)}
          </div>
        </div>
        <div>
          ${player.alive ? "ALIVE" : "OUT"}
        </div>
      `;

      container.appendChild(
        row
      );
    }
  );
}

function renderVotes(
  list,
  phase
) {

  const container =
    document.getElementById(
      "voteButtons"
    );

  container.innerHTML = "";

  if (
    phase !== "VOTING"
  ) {
    return;
  }

  list.forEach(
    player => {

      if (
        !player.alive ||
        player.id === myId
      ) {
        return;
      }

      const button =
        document.createElement(
          "button"
        );

      button.textContent =
        `VOTE ${player.name}`;

      button.addEventListener(
        "click",
        () => {

          send({
            type: "vote",
            targetId:
              player.id
          });

        }
      );

      container.appendChild(
        button
      );
    }
  );
}

function renderLogs(
  log
) {

  const container =
    document.getElementById(
      "logs"
    );

  container.innerHTML = "";

  const items =
    Array.isArray(log)
      ? log.slice(-12)
      : [];

  items.forEach(
    item => {

      const row =
        document.createElement(
          "div"
        );

      row.className =
        "log";

      row.textContent =
        typeof item ===
        "string"
          ? item
          : item.text;

      container.appendChild(
        row
      );
    }
  );

  container.scrollTop =
    container.scrollHeight;
}

function escapeHTML(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    );
}

/* =========================================================
   MOBILE MOVEMENT
========================================================= */

document
  .querySelectorAll(
    "[data-move]"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const direction =
            button.dataset
              .move;

          if (!myPlayer) {
            return;
          }

          const amount =
            1;

          if (
            direction ===
            "forward"
          ) {
            myPlayer.z -= amount;
          }

          if (
            direction ===
            "back"
          ) {
            myPlayer.z += amount;
          }

          if (
            direction ===
            "left"
          ) {
            myPlayer.x -= amount;
          }

          if (
            direction ===
            "right"
          ) {
            myPlayer.x += amount;
          }

          myPlayer.x =
            Math.max(
              -22,
              Math.min(
                22,
                myPlayer.x
              )
            );

          myPlayer.z =
            Math.max(
              -22,
              Math.min(
                22,
                myPlayer.z
              )
            );

          send({
            type: "move",
            x: myPlayer.x,
            y: myPlayer.y,
            z: myPlayer.z
          });

        }
      );
    }
  );

/* =========================================================
   ANIMATION
========================================================= */

const clock =
  new THREE.Clock();

function animate() {

  requestAnimationFrame(
    animate
  );

  const elapsed =
    clock.getElapsedTime();

  core.rotation.y =
    elapsed * 0.35;

  core.rotation.x =
    Math.sin(elapsed * 0.7) *
    0.2;

  coreGroup.children
    .forEach(
      (object, index) => {

        if (
          object !== core
        ) {

          object.rotation.z =
            elapsed *
            (0.25 +
              index *
              0.1);
        }

      }
    );

  updateMovement();

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);

/* =========================================================
   START
========================================================= */

connect();

animate();
