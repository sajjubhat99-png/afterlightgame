<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTERLIGHT</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02050a;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
}

/* =====================================================
   JOIN SCREEN
   ===================================================== */

#joinScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at center,
      rgba(0, 210, 255, 0.08),
      transparent 45%
    ),
    #02050a;
}

.joinBox {
  width: min(380px, 92vw);

  padding: 30px 28px;

  text-align: center;

  border: 1px solid rgba(0, 220, 255, 0.3);

  background:
    rgba(4, 12, 20, 0.96);

  border-radius: 16px;

  box-shadow:
    0 0 35px rgba(0, 210, 255, 0.1);
}

/* SMALLER AFTERLIGHT LOGO */

.logo {
  font-size: 32px;
  line-height: 1;

  font-weight: 800;

  letter-spacing: 5px;

  margin: 0 0 12px;

  color: #eaffff;

  text-shadow:
    0 0 15px rgba(0, 220, 255, 0.4);
}

.tagline {
  margin-bottom: 28px;

  color: #69cbdc;

  font-size: 10px;

  letter-spacing: 1.8px;

  line-height: 1.5;
}

.joinTitle {
  margin-bottom: 14px;

  color: #ffffff;

  font-size: 17px;

  font-weight: 600;
}

#nameInput {
  width: 100%;
  height: 50px;

  padding: 0 15px;

  border-radius: 9px;

  border: 1px solid rgba(0, 220, 255, 0.4);

  outline: none;

  background: #07111b;

  color: #ffffff;

  font-size: 16px;

  margin-bottom: 10px;
}

#nameInput::placeholder {
  color: #6e858e;
}

#nameInput:focus {
  border-color: #00d9ff;

  box-shadow:
    0 0 14px rgba(0, 217, 255, 0.15);
}

#joinButton {
  width: 100%;
  height: 48px;

  border: none;

  border-radius: 9px;

  background:
    linear-gradient(
      90deg,
      #00a9c7,
      #00ddff
    );

  color: #001018;

  font-size: 13px;

  font-weight: 800;

  cursor: pointer;
}

#joinButton:hover {
  filter: brightness(1.08);
}

#joinButton:active {
  transform: translateY(1px);
}

#connectionStatus {
  min-height: 18px;

  margin-top: 12px;

  color: #79aeb9;

  font-size: 11px;

  line-height: 1.4;
}

/* =====================================================
   HUD
   ===================================================== */

#hud {
  position: fixed;
  inset: 0;

  z-index: 100;

  display: none;

  pointer-events: none;
}

.panel {
  background:
    rgba(3, 10, 17, 0.84);

  border:
    1px solid rgba(0, 220, 255, 0.22);

  border-radius: 11px;

  backdrop-filter: blur(8px);
}

/* =====================================================
   TOP BAR
   ===================================================== */

#topBar {
  position: absolute;

  top: 14px;
  left: 14px;
  right: 14px;

  display: flex;

  justify-content: space-between;

  align-items: flex-start;

  gap: 12px;
}

.stats {
  display: flex;

  gap: 7px;

  flex-wrap: wrap;
}

.stat {
  min-width: 78px;

  padding: 8px 10px;
}

.statLabel {
  color: #718991;

  font-size: 8px;

  text-transform: uppercase;

  letter-spacing: 0.5px;
}

.statValue {
  margin-top: 3px;

  font-size: 14px;

  font-weight: bold;
}

#phasePanel {
  min-width: 150px;

  padding: 9px 12px;
}

#phase {
  margin-top: 2px;

  color: #00d9ff;

  font-size: 13px;

  font-weight: bold;
}

#challenge {
  margin-top: 3px;

  color: #91a9b1;

  font-size: 10px;
}

/* =====================================================
   COMPETITORS
   ===================================================== */

#competitors {
  position: absolute;

  top: 76px;
  left: 14px;

  width: 205px;

  padding: 12px;
}

.panelTitle {
  margin-bottom: 9px;

  color: #00d9ff;

  font-size: 10px;

  font-weight: bold;

  letter-spacing: 1px;
}

#competitorList {
  max-height: 270px;

  overflow-y: auto;
}

.competitor {
  padding: 6px 4px;

  border-bottom:
    1px solid rgba(255, 255, 255, 0.06);

  font-size: 10px;
}

.competitorRole {
  margin-top: 2px;

  color: #708790;

  font-size: 8px;
}

/* =====================================================
   ACTIONS
   ===================================================== */

#actions {
  position: absolute;

  right: 14px;
  bottom: 14px;

  width: 180px;

  display: grid;

  gap: 6px;

  pointer-events: auto;
}

.actionButton {
  min-height: 36px;

  padding: 7px;

  border:
    1px solid rgba(0, 220, 255, 0.23);

  border-radius: 8px;

  background:
    rgba(4, 15, 23, 0.9);

  color: #d8faff;

  cursor: pointer;

  font-size: 10px;

  font-weight: bold;

  transition:
    background 0.15s,
    border-color 0.15s;
}

.actionButton:hover {
  border-color: #00d9ff;

  background:
    rgba(0, 217, 255, 0.12);
}

.actionButton:active {
  transform: translateY(1px);
}

/* =====================================================
   LOG
   ===================================================== */

#logPanel {
  position: absolute;

  left: 14px;
  bottom: 14px;

  width: 290px;

  max-height: 145px;

  padding: 11px;
}

#log {
  max-height: 100px;

  overflow-y: auto;

  color: #91aab2;

  font-size: 9px;

  line-height: 1.5;
}

.logLine {
  margin-bottom: 3px;
}

/* =====================================================
   MOBILE CONTROLS
   ===================================================== */

#mobileControls {
  position: absolute;

  left: 16px;
  bottom: 16px;

  display: none;

  pointer-events: auto;
}

.mobilePad {
  display: grid;

  grid-template-columns:
    46px 46px 46px;

  grid-template-rows:
    46px 46px;

  gap: 5px;
}

.mobileButton {
  border:
    1px solid rgba(0, 220, 255, 0.35);

  background:
    rgba(3, 15, 23, 0.86);

  color: #ffffff;

  border-radius: 9px;

  font-size: 17px;
}

.up {
  grid-column: 2;
}

.left {
  grid-column: 1;
}

.down {
  grid-column: 2;
}

.right {
  grid-column: 3;
}

/* =====================================================
   MOBILE
   ===================================================== */

@media (max-width: 700px) {

  .joinBox {
    width: min(350px, 92vw);

    padding: 26px 20px;
  }

  .logo {
    font-size: 28px;

    letter-spacing: 4px;
  }

  .tagline {
    font-size: 9px;

    letter-spacing: 1.4px;
  }

  #competitors {
    display: none;
  }

  #logPanel {
    width: 205px;

    left: 10px;
    bottom: 10px;
  }

  #actions {
    width: 145px;

    right: 10px;
    bottom: 10px;
  }

  .stat {
    min-width: 67px;

    padding: 7px 8px;
  }

  .statValue {
    font-size: 12px;
  }

  #phasePanel {
    min-width: 125px;

    padding: 8px;
  }

  #mobileControls {
    display: block;
  }
}

@media (max-width: 430px) {

  .joinBox {
    padding: 24px 18px;
  }

  .logo {
    font-size: 25px;

    letter-spacing: 3px;
  }

  .tagline {
    margin-bottom: 22px;

    font-size: 8px;
  }

  .joinTitle {
    font-size: 16px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- =====================================================
     JOIN SCREEN
     ===================================================== -->

<div id="joinScreen">

  <div class="joinBox">

    <div class="logo">
      AFTERLIGHT
    </div>

    <div class="tagline">
      THE CHALLENGE IS ONLY HALF THE GAME
    </div>

    <div class="joinTitle">
      ENTER AFTERLIGHT
    </div>

    <input
      id="nameInput"
      type="text"
      maxlength="18"
      autocomplete="off"
      spellcheck="false"
      placeholder="Enter your name"
    >

    <button
      id="joinButton"
      type="button"
    >
      ENTER GAME
    </button>

    <div id="connectionStatus">
      Connecting to AFTERLIGHT...
    </div>

  </div>

</div>


<!-- =====================================================
     GAME HUD
     ===================================================== -->

<div id="hud">

  <div id="topBar">

    <div class="stats">

      <div class="panel stat">
        <div class="statLabel">
          Credits
        </div>

        <div
          class="statValue"
          id="credits"
        >
          500
        </div>
      </div>

      <div class="panel stat">
        <div class="statLabel">
          Influence
        </div>

        <div
          class="statValue"
          id="influence"
        >
          10
        </div>
      </div>

      <div class="panel stat">
        <div class="statLabel">
          Trust
        </div>

        <div
          class="statValue"
          id="trust"
        >
          50
        </div>
      </div>

      <div class="panel stat">
        <div class="statLabel">
          Energy
        </div>

        <div
          class="statValue"
          id="energy"
        >
          100
        </div>
      </div>

      <div class="panel stat">
        <div class="statLabel">
          Players
        </div>

        <div
          class="statValue"
          id="playerCount"
        >
          0
        </div>
      </div>

    </div>


    <div
      id="phasePanel"
      class="panel"
    >

      <div class="statLabel">
        CURRENT PHASE
      </div>

      <div id="phase">
        LOBBY
      </div>

      <div id="challenge">
        Waiting for competitors...
      </div>

    </div>

  </div>


  <!-- COMPETITORS -->

  <div
    id="competitors"
    class="panel"
  >

    <div class="panelTitle">
      COMPETITORS
    </div>

    <div id="competitorList"></div>

  </div>


  <!-- LOG -->

  <div
    id="logPanel"
    class="panel"
  >

    <div class="panelTitle">
      AFTERLIGHT LOG
    </div>

    <div id="log"></div>

  </div>


  <!-- ACTIONS -->

  <div id="actions">

    <button
      class="actionButton"
      data-action="ready"
    >
      READY
    </button>

    <button
      class="actionButton"
      data-action="challenge"
    >
      CHALLENGE
    </button>

    <button
      class="actionButton"
      data-action="social"
    >
      SOCIAL PHASE
    </button>

    <button
      class="actionButton"
      data-action="mission"
    >
      SECRET MISSION
    </button>

    <button
      class="actionButton"
      data-action="parallel"
    >
      PARALLEL WORLD
    </button>

    <button
      class="actionButton"
      data-action="architect"
    >
      INVESTIGATE
    </button>

    <button
      class="actionButton"
      data-action="heist"
    >
      THE HEIST
    </button>

    <button
      class="actionButton"
      data-action="vacation"
    >
      VACATION
    </button>

    <button
      class="actionButton"
      data-action="power"
    >
      POWER STORE
    </button>

    <button
      class="actionButton"
      data-action="vote"
    >
      VOTE
    </button>

  </div>


  <!-- MOBILE MOVEMENT -->

  <div id="mobileControls">

    <div class="mobilePad">

      <button
        class="mobileButton up"
        data-key="w"
      >
        ▲
      </button>

      <button
        class="mobileButton left"
        data-key="a"
      >
        ◀
      </button>

      <button
        class="mobileButton down"
        data-key="s"
      >
        ▼
      </button>

      <button
        class="mobileButton right"
        data-key="d"
      >
        ▶
      </button>

    </div>

  </div>

</div>


<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { AfterlightWorld }
from "./world.js";

import { AfterlightPlayer }
from "./player.js";


/* =====================================================
   SERVER
   ===================================================== */

const SERVER_URL =
"wss://afterlightgame.sajjubhat99.workers.dev/ws";


/* =====================================================
   ELEMENTS
   ===================================================== */

const game =
document.getElementById("game");

const joinScreen =
document.getElementById("joinScreen");

const hud =
document.getElementById("hud");

const nameInput =
document.getElementById("nameInput");

const joinButton =
document.getElementById("joinButton");

const connectionStatus =
document.getElementById(
  "connectionStatus"
);


/* =====================================================
   THREE.JS
   ===================================================== */

const scene =
new THREE.Scene();

scene.background =
new THREE.Color(0x02050a);

scene.fog =
new THREE.Fog(
  0x02050a,
  25,
  100
);


const camera =
new THREE.PerspectiveCamera(
  60,
  window.innerWidth /
  window.innerHeight,
  0.1,
  200
);

camera.position.set(
  0,
  8,
  12
);


const renderer =
new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "low-power"
});

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    1.5
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

game.appendChild(
  renderer.domElement
);


/* =====================================================
   WORLD
   ===================================================== */

const world =
new AfterlightWorld(scene);


/* =====================================================
   PLAYERS
   ===================================================== */

const players =
new Map();

let localPlayerId =
null;


/* =====================================================
   CONNECTION
   ===================================================== */

let socket =
null;

let joined =
false;

let reconnectTimer =
null;


/* =====================================================
   INPUT
   ===================================================== */

const keys = {
  w: false,
  a: false,
  s: false,
  d: false
};


/* =====================================================
   CONNECT
   ===================================================== */

function connect() {

  if (
    socket &&
    (
      socket.readyState ===
      WebSocket.OPEN ||

      socket.readyState ===
      WebSocket.CONNECTING
    )
  ) {
    return;
  }


  connectionStatus.textContent =
    "Connecting to AFTERLIGHT...";


  try {

    socket =
      new WebSocket(
        SERVER_URL
      );

  } catch {

    connectionStatus.textContent =
      "Connection failed.";

    scheduleReconnect();

    return;
  }


  socket.addEventListener(
    "open",
    () => {

      connectionStatus.textContent =
        "Connected. Enter your name.";

      /*
       * Keep the join screen open.
       * Keep the input active.
       */

      nameInput.focus();

    }
  );


  socket.addEventListener(
    "close",
    () => {

      if (!joined) {

        connectionStatus.textContent =
          "Connection lost. Reconnecting...";

        scheduleReconnect();

      }

    }
  );


  socket.addEventListener(
    "error",
    () => {

      if (!joined) {

        connectionStatus.textContent =
          "Connection error. Retrying...";

      }

    }
  );


  socket.addEventListener(
    "message",
    event => {

      let message;

      try {

        message =
          JSON.parse(
            event.data
          );

      } catch {

        return;

      }

      handleMessage(
        message
      );

    }
  );

}


/* =====================================================
   RECONNECT
   ===================================================== */

function scheduleReconnect() {

  if (reconnectTimer) {
    return;
  }


  reconnectTimer =
    setTimeout(
      () => {

        reconnectTimer =
          null;

        connect();

      },
      3000
    );

}


/* =====================================================
   JOIN GAME
   ===================================================== */

function joinGame() {

  const name =
    nameInput.value.trim();


  if (!name) {

    connectionStatus.textContent =
      "Please enter your name.";

    nameInput.focus();

    return;

  }


  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    connectionStatus.textContent =
      "Still connecting...";

    return;

  }


  connectionStatus.textContent =
    "Entering AFTERLIGHT...";


  socket.send(
    JSON.stringify({
      type: "join",
      name: name
    })
  );

}


/* =====================================================
   JOIN BUTTON
   ===================================================== */

joinButton.addEventListener(
  "click",
  joinGame
);


/* =====================================================
   ENTER KEY
   ===================================================== */

nameInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      event.preventDefault();

      joinGame();

    }

  }
);


/* =====================================================
   SERVER MESSAGES
   ===================================================== */

function handleMessage(
  message
) {

  switch (
    message.type
  ) {

    case "welcome":

      joined = true;

      localPlayerId =
        message.player?.id ||
        message.id ||
        null;


      /*
       * ONLY hide the join
       * screen after the server
       * confirms the player.
       */

      joinScreen.style.display =
        "none";

      hud.style.display =
        "block";


      addLog(
        "Welcome to AFTERLIGHT."
      );

      break;


    case "players":

      updatePlayers(
        message.players || []
      );

      break;


    case "state":

      updateGameState(
        message
      );

      break;


    case "log":

      addLog(
        message.message ||
        message.text ||
        ""
      );

      break;


    case "error":

      connectionStatus.textContent =
        message.message ||
        "Unable to join.";

      addLog(
        message.message ||
        "Server error."
      );

      break;

  }

}


/* =====================================================
   UPDATE PLAYERS
   ===================================================== */

function updatePlayers(
  serverPlayers
) {

  document.getElementById(
    "playerCount"
  ).textContent =
    serverPlayers.length;


  const activeIds =
    new Set();


  for (
    const data
    of serverPlayers
  ) {

    activeIds.add(
      data.id
    );


    let player =
      players.get(
        data.id
      );


    if (!player) {

      player =
        new AfterlightPlayer(
          scene,
          data,
          data.id ===
          localPlayerId
        );


      players.set(
        data.id,
        player
      );

    } else {

      player.updateFromServer(
        data
      );

    }

  }


  for (
    const [
      id,
      player
    ]
    of players
  ) {

    if (
      !activeIds.has(id)
    ) {

      player.remove();

      players.delete(id);

    }

  }


  updateCompetitorList(
    serverPlayers
  );

}


/* =====================================================
   COMPETITOR LIST
   ===================================================== */

function updateCompetitorList(
  list
) {

  const container =
    document.getElementById(
      "competitorList"
    );


  container.innerHTML =
    "";


  list.forEach(
    player => {

      const row =
        document.createElement(
          "div"
        );


      row.className =
        "competitor";


      row.innerHTML = `
        <div>
          ${escapeHTML(
            player.name ||
            "Unknown"
          )}
        </div>

        <div class="competitorRole">
          ${escapeHTML(
            player.role ||
            "Competitor"
          )}
        </div>
      `;


      container.appendChild(
        row
      );

    }
  );

}


/* =====================================================
   GAME STATE
   ===================================================== */

function updateGameState(
  data
) {

  if (data.phase) {

    document.getElementById(
      "phase"
    ).textContent =
      data.phase;

  }


  if (data.challenge) {

    document.getElementById(
      "challenge"
    ).textContent =
      data.challenge;

  }


  const me =
    data.players?.find(
      player =>
        player.id ===
        localPlayerId
    );


  if (!me) {
    return;
  }


  document.getElementById(
    "credits"
  ).textContent =
    me.credits ??
    500;


  document.getElementById(
    "influence"
  ).textContent =
    me.influence ??
    10;


  document.getElementById(
    "trust"
  ).textContent =
    me.trust ??
    50;


  document.getElementById(
    "energy"
  ).textContent =
    me.energy ??
    100;

}


/* =====================================================
   ACTIONS
   ===================================================== */

function sendAction(
  action,
  extra = {}
) {

  if (
    !socket ||
    socket.readyState !==
    WebSocket.OPEN
  ) {

    addLog(
      "Not connected."
    );

    return;

  }


  socket.send(
    JSON.stringify({
      type: action,
      ...extra
    })
  );

}


document
  .querySelectorAll(
    ".actionButton"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          const action =
            button.dataset.action;


          switch (action) {

            case "ready":

              sendAction(
                "ready"
              );

              break;


            case "challenge":

              sendAction(
                "challenge",
                {
                  choice:
                    "risk"
                }
              );

              break;


            case "social":

              sendAction(
                "social"
              );

              break;


            case "mission":

              sendAction(
                "mission"
              );

              break;


            case "parallel":

              sendAction(
                "parallel"
              );

              break;


            case "architect":

              sendAction(
                "architect"
              );

              break;


            case "heist":

              sendAction(
                "heist"
              );

              break;


            case "vacation":

              sendAction(
                "vacation"
              );

              break;


            case "power":

              sendAction(
                "buyPower",
                {
                  power:
                    "Shield Band"
                }
              );

              break;


            case "vote":

              sendAction(
                "vote",
                {
                  target:
                    null
                }
              );

              break;

          }

        }
      );

    }
  );


/* =====================================================
   LOG
   ===================================================== */

function addLog(
  text
) {

  if (!text) {
    return;
  }


  const log =
    document.getElementById(
      "log"
    );


  const line =
    document.createElement(
      "div"
    );


  line.className =
    "logLine";


  line.textContent =
    text;


  log.appendChild(
    line
  );


  while (
    log.children.length >
    30
  ) {

    log.removeChild(
      log.firstChild
    );

  }


  log.scrollTop =
    log.scrollHeight;

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(
  value
) {

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   KEYBOARD
   ===================================================== */

window.addEventListener(
  "keydown",
  event => {

    /*
     * NEVER capture movement
     * while the player is typing.
     */

    if (
      document.activeElement ===
      nameInput
    ) {

      return;

    }


    const key =
      event.key.toLowerCase();


    if (
      Object.prototype.hasOwnProperty
        .call(
          keys,
          key
        )
    ) {

      keys[key] =
        true;

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    const key =
      event.key.toLowerCase();


    if (
      Object.prototype.hasOwnProperty
        .call(
          keys,
          key
        )
    ) {

      keys[key] =
        false;

    }

  }
);


/* =====================================================
   MOBILE CONTROLS
   ===================================================== */

document
  .querySelectorAll(
    ".mobileButton"
  )
  .forEach(
    button => {

      const key =
        button.dataset.key;


      button.addEventListener(
        "pointerdown",
        event => {

          event.preventDefault();

          keys[key] =
            true;

        }
      );


      button.addEventListener(
        "pointerup",
        () => {

          keys[key] =
            false;

        }
      );


      button.addEventListener(
        "pointercancel",
        () => {

          keys[key] =
            false;

        }
      );


      button.addEventListener(
        "pointerleave",
        () => {

          keys[key] =
            false;

        }
      );

    }
  );


/* =====================================================
   MOVEMENT
   ===================================================== */

function updateMovement(
  delta
) {

  if (!localPlayerId) {
    return;
  }


  const player =
    players.get(
      localPlayerId
    );


  if (!player) {
    return;
  }


  const speed =
    6;


  let dx =
    0;

  let dz =
    0;


  if (keys.w) {
    dz -= 1;
  }

  if (keys.s) {
    dz += 1;
  }

  if (keys.a) {
    dx -= 1;
  }

  if (keys.d) {
    dx += 1;
  }


  if (
    dx === 0 &&
    dz === 0
  ) {

    return;

  }


  const length =
    Math.sqrt(
      dx * dx +
      dz * dz
    );


  dx /= length;
  dz /= length;


  const movement =
    speed * delta;


  player.group.position.x +=
    dx * movement;

  player.group.position.z +=
    dz * movement;


  player.group.position.x =
    THREE.MathUtils.clamp(
      player.group.position.x,
      -22,
      22
    );


  player.group.position.z =
    THREE.MathUtils.clamp(
      player.group.position.z,
      -22,
      22
    );


  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify({
        type: "move",

        x:
          player.group.position.x,

        y:
          player.group.position.y,

        z:
          player.group.position.z
      })
    );

  }

}


/* =====================================================
   CAMERA
   ===================================================== */

function updateCamera(
  delta
) {

  if (!localPlayerId) {
    return;
  }


  const player =
    players.get(
      localPlayerId
    );


  if (!player) {
    return;
  }


  const target =
    new THREE.Vector3(
      player.group.position.x,
      player.group.position.y + 8,
      player.group.position.z + 11
    );


  camera.position.lerp(
    target,
    Math.min(
      1,
      delta * 4
    )
  );


  camera.lookAt(
    player.group.position.x,
    player.group.position.y + 1.5,
    player.group.position.z
  );

}


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =====================================================
   GAME LOOP
   ===================================================== */

let previousTime =
performance.now();


function animate(
  time
) {

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      0.05,
      (
        time -
        previousTime
      ) / 1000
    );


  previousTime =
    time;


  world.update(
    delta
  );


  for (
    const player
    of players.values()
  ) {

    player.update(
      delta
    );

  }


  updateMovement(
    delta
  );

  updateCamera(
    delta
  );


  renderer.render(
    scene,
    camera
  );

}


connect();

animate(
  performance.now()
);

</script>

</body>
</html>
