<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>AFTERLIGHT — Multiplayer</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02060b;
      color: #e8fbff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    #game {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    /* ---------------- JOIN SCREEN ---------------- */

    #joinScreen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(0,210,255,.10), transparent 35%),
        linear-gradient(135deg,#02060b,#06111b 55%,#010306);
    }

    .join-card {
      width: min(440px,92vw);
      padding: 34px;
      border: 1px solid rgba(90,230,255,.35);
      background: rgba(3,13,21,.88);
      box-shadow:
        0 0 60px rgba(0,210,255,.12),
        inset 0 0 30px rgba(0,210,255,.035);
      border-radius: 18px;
      text-align: center;
    }

    .logo {
      font-size: 42px;
      letter-spacing: 10px;
      font-weight: 800;
      color: #dffaff;
      text-shadow: 0 0 25px rgba(0,220,255,.65);
      margin-bottom: 5px;
    }

    .tagline {
      color: #69d9ef;
      font-size: 11px;
      letter-spacing: 4px;
      margin-bottom: 35px;
    }

    .join-card input {
      width: 100%;
      height: 48px;
      border-radius: 9px;
      border: 1px solid rgba(100,230,255,.28);
      background: rgba(0,0,0,.4);
      color: white;
      padding: 0 15px;
      outline: none;
      margin-bottom: 12px;
    }

    .join-card input:focus {
      border-color: #5deaff;
      box-shadow: 0 0 18px rgba(0,220,255,.15);
    }

    .primary {
      width: 100%;
      height: 48px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(90deg,#00aeca,#37e6ff);
      color: #001018;
      font-weight: 800;
      cursor: pointer;
      letter-spacing: 1px;
    }

    .primary:hover {
      filter: brightness(1.12);
    }

    #connectionText {
      margin-top: 15px;
      color: #78929b;
      font-size: 12px;
    }

    /* ---------------- HUD ---------------- */

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
    }

    .hud-panel {
      position: absolute;
      pointer-events: auto;
      background: rgba(2,10,16,.76);
      border: 1px solid rgba(86,220,246,.22);
      backdrop-filter: blur(10px);
      box-shadow: 0 0 30px rgba(0,0,0,.25);
      border-radius: 12px;
    }

    #topBar {
      top: 14px;
      left: 14px;
      right: 14px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 15px;
      gap: 15px;
    }

    .brand-small {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
      white-space: nowrap;
    }

    .phase-box {
      text-align: center;
      flex: 1;
    }

    .phase-label {
      color: #71939d;
      font-size: 9px;
      letter-spacing: 3px;
    }

    #phase {
      font-size: 16px;
      font-weight: 700;
      color: #72edff;
      margin-top: 3px;
    }

    .stats {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 72px;
      padding: 7px 10px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.025);
      border-radius: 7px;
    }

    .stat-label {
      color: #67818b;
      font-size: 8px;
      letter-spacing: 1px;
    }

    .stat-value {
      margin-top: 2px;
      font-size: 14px;
      font-weight: 700;
    }

    /* ---------------- LEFT PANEL ---------------- */

    #competitors {
      left: 14px;
      top: 94px;
      width: 235px;
      max-height: 52vh;
      overflow: auto;
      padding: 12px;
    }

    .panel-title {
      font-size: 10px;
      letter-spacing: 2px;
      color: #6c909b;
      margin-bottom: 9px;
      text-transform: uppercase;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      margin-bottom: 4px;
      border-radius: 7px;
      cursor: pointer;
      transition: .15s;
    }

    .player-row:hover,
    .player-row.selected {
      background: rgba(65,225,255,.09);
      border-left: 2px solid #55e8ff;
    }

    .player-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #46e5ff;
      box-shadow: 0 0 9px #46e5ff;
      flex: 0 0 auto;
    }

    .player-dot.dead {
      background: #5b6266;
      box-shadow: none;
    }

    .player-name {
      flex: 1;
      font-size: 12px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .player-role {
      font-size: 8px;
      color: #63838d;
    }

    /* ---------------- RIGHT PANEL ---------------- */

    #actions {
      right: 14px;
      top: 94px;
      width: 245px;
      padding: 12px;
    }

    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .action {
      min-height: 38px;
      border: 1px solid rgba(90,225,255,.18);
      border-radius: 7px;
      background: rgba(15,45,55,.48);
      color: #bdebf3;
      cursor: pointer;
      font-size: 10px;
      transition: .15s;
    }

    .action:hover {
      background: rgba(30,120,140,.45);
      border-color: rgba(90,225,255,.5);
      color: white;
    }

    .action.danger {
      border-color: rgba(255,90,110,.25);
    }

    .action.special {
      border-color: rgba(174,117,255,.3);
    }

    .action:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    /* ---------------- CONTEXT ---------------- */

    #context {
      left: 50%;
      bottom: 90px;
      transform: translateX(-50%);
      min-width: 260px;
      max-width: 80vw;
      padding: 12px 18px;
      text-align: center;
      opacity: 0;
      transition: .2s;
    }

    #context.visible {
      opacity: 1;
    }

    #contextTitle {
      font-size: 13px;
      font-weight: 700;
      color: #7eefff;
    }

    #contextText {
      margin-top: 4px;
      color: #9cb4ba;
      font-size: 10px;
    }

    /* ---------------- LOG ---------------- */

    #logPanel {
      left: 14px;
      bottom: 14px;
      width: 330px;
      max-height: 145px;
      padding: 11px;
    }

    #log {
      max-height: 105px;
      overflow-y: auto;
      font-size: 10px;
      line-height: 1.6;
      color: #8caab2;
    }

    .log-line {
      border-bottom: 1px solid rgba(255,255,255,.025);
      padding: 2px 0;
    }

    /* ---------------- TARGET ---------------- */

    #targetPanel {
      right: 14px;
      bottom: 14px;
      width: 245px;
      padding: 12px;
      display: none;
    }

    #targetPanel.visible {
      display: block;
    }

    #targetName {
      font-size: 15px;
      font-weight: 700;
      color: #7eefff;
    }

    #targetRole {
      color: #78939c;
      font-size: 10px;
      margin-top: 3px;
    }

    /* ---------------- MOBILE ---------------- */

    #mobileControls {
      position: fixed;
      left: 20px;
      bottom: 25px;
      z-index: 30;
      display: none;
      pointer-events: auto;
    }

    .mobile-pad {
      width: 150px;
      height: 150px;
      position: relative;
    }

    .move-btn {
      position: absolute;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      border: 1px solid rgba(90,225,255,.25);
      background: rgba(4,22,31,.75);
      color: #aeefff;
      font-size: 20px;
    }

    .move-btn.up { left: 51px; top: 0; }
    .move-btn.down { left: 51px; bottom: 0; }
    .move-btn.left { left: 0; top: 51px; }
    .move-btn.right { right: 0; top: 51px; }

    #toast {
      position: fixed;
      top: 92px;
      left: 50%;
      transform: translateX(-50%) translateY(-15px);
      z-index: 80;
      opacity: 0;
      pointer-events: none;
      padding: 10px 17px;
      border: 1px solid rgba(90,225,255,.3);
      border-radius: 8px;
      background: rgba(2,15,23,.9);
      color: #aeefff;
      font-size: 11px;
      transition: .2s;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media(max-width:850px) {
      #topBar {
        flex-wrap: wrap;
      }

      .phase-box {
        order: 3;
        flex-basis: 100%;
      }

      #competitors {
        width: 185px;
      }

      #actions {
        width: 185px;
      }

      #logPanel {
        width: 260px;
      }
    }

    @media(max-width:650px) {
      #competitors {
        display: none;
      }

      #actions {
        right: 8px;
        top: auto;
        bottom: 185px;
        width: 180px;
      }

      #logPanel {
        left: 8px;
        bottom: 8px;
        width: 205px;
        max-height: 105px;
      }

      #mobileControls {
        display: block;
      }

      .stat {
        min-width: 58px;
      }

      .brand-small {
        font-size: 14px;
      }

      #targetPanel {
        right: 8px;
        bottom: 8px;
        width: 180px;
      }
    }
  </style>
</head>

<body>

<div id="game"></div>

<!-- JOIN -->
<div id="joinScreen">
  <div class="join-card">
    <div class="logo">AFTERLIGHT</div>
    <div class="tagline">THE CHALLENGE IS ONLY HALF THE GAME</div>

    <input id="nameInput"
           maxlength="18"
           autocomplete="off"
           placeholder="Enter your competitor name">

    <button class="primary" id="joinButton">
      ENTER AFTERLIGHT
    </button>

    <div id="connectionText">
      Connecting to AFTERLIGHT network...
    </div>
  </div>
</div>

<!-- HUD -->
<div id="hud" style="display:none">

  <div id="topBar" class="hud-panel">

    <div class="brand-small">AFTERLIGHT</div>

    <div class="phase-box">
      <div class="phase-label">CURRENT PHASE</div>
      <div id="phase">LOBBY</div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">CREDITS</div>
        <div class="stat-value" id="credits">500</div>
      </div>

      <div class="stat">
        <div class="stat-label">INFLUENCE</div>
        <div class="stat-value" id="influence">10</div>
      </div>

      <div class="stat">
        <div class="stat-label">TRUST</div>
        <div class="stat-value" id="trust">50</div>
      </div>

      <div class="stat">
        <div class="stat-label">ENERGY</div>
        <div class="stat-value" id="energy">100</div>
      </div>
    </div>

  </div>

  <!-- competitors -->
  <div id="competitors" class="hud-panel">
    <div class="panel-title">
      Competitors — <span id="competitorCount">0</span>
    </div>
    <div id="competitorList"></div>
  </div>

  <!-- actions -->
  <div id="actions" class="hud-panel">

    <div class="panel-title">AFTERLIGHT SYSTEM</div>

    <div class="action-grid">

      <button class="action" id="readyBtn">READY</button>

      <button class="action" id="challengeBtn">
        CHALLENGE
      </button>

      <button class="action" id="socialBtn">
        SOCIAL
      </button>

      <button class="action" id="storeBtn">
        POWER STORE
      </button>

      <button class="action" id="missionBtn">
        MISSION
      </button>

      <button class="action special" id="parallelBtn">
        PARALLEL WORLD
      </button>

      <button class="action special" id="architectBtn">
        ARCHITECT
      </button>

      <button class="action special" id="heistBtn">
        THE HEIST
      </button>

      <button class="action" id="vacationBtn">
        VACATION
      </button>

      <button class="action" id="tradeBtn">
        TRADE
      </button>

      <button class="action" id="pactBtn">
        SECRET PACT
      </button>

      <button class="action" id="protectBtn">
        PROTECT
      </button>

      <button class="action danger" id="accuseBtn">
        ACCUSE
      </button>

      <button class="action danger" id="voteBtn">
        VOTE
      </button>

    </div>
  </div>

  <!-- contextual interaction -->
  <div id="context" class="hud-panel">
    <div id="contextTitle">FACILITY</div>
    <div id="contextText">Explore the facility.</div>
  </div>

  <!-- log -->
  <div id="logPanel" class="hud-panel">
    <div class="panel-title">AFTERLIGHT LOG</div>
    <div id="log"></div>
  </div>

  <!-- target -->
  <div id="targetPanel" class="hud-panel">

    <div class="panel-title">SELECTED COMPETITOR</div>

    <div id="targetName">None</div>
    <div id="targetRole">No target selected</div>

    <div class="action-grid" style="margin-top:10px">
      <button class="action" id="targetTalk">TALK</button>
      <button class="action" id="targetDeal">DEAL</button>
      <button class="action danger" id="targetAccuse">ACCUSE</button>
      <button class="action" id="targetTrade">TRADE</button>
    </div>

  </div>

</div>

<!-- toast -->
<div id="toast"></div>

<!-- mobile movement -->
<div id="mobileControls">

  <div class="mobile-pad">

    <button class="move-btn up" data-dir="up">▲</button>
    <button class="move-btn down" data-dir="down">▼</button>
    <button class="move-btn left" data-dir="left">◀</button>
    <button class="move-btn right" data-dir="right">▶</button>

  </div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";
import { AfterlightWorld } from "./world.js";
import { AfterlightPlayer } from "./player.js";


/* =========================================================
   CONFIG
========================================================= */

const SERVER_URL =
  "wss://afterlightgame.sajjubhat99.workers.dev/ws";

const MAX_PLAYERS = 16;


/* =========================================================
   GLOBAL STATE
========================================================= */

let socket = null;

let joined = false;
let localPlayerId = null;

let roomState = {
  phase: "LOBBY",
  players: [],
  competitors: [],
  logs: []
};

let localPlayer = null;
let selectedPlayerId = null;

const remotePlayers = new Map();

const keys = {
  w:false,
  a:false,
  s:false,
  d:false,
  arrowup:false,
  arrowdown:false,
  arrowleft:false,
  arrowright:false
};

let lastMoveSent = 0;

let scene;
let camera;
let renderer;
let world;

let raycaster;
let mouse;

let clock;


/* =========================================================
   DOM
========================================================= */

const joinScreen = document.getElementById("joinScreen");
const joinButton = document.getElementById("joinButton");
const nameInput = document.getElementById("nameInput");
const connectionText = document.getElementById("connectionText");

const hud = document.getElementById("hud");

const phaseEl = document.getElementById("phase");
const creditsEl = document.getElementById("credits");
const influenceEl = document.getElementById("influence");
const trustEl = document.getElementById("trust");
const energyEl = document.getElementById("energy");

const competitorList =
  document.getElementById("competitorList");

const competitorCount =
  document.getElementById("competitorCount");

const logEl = document.getElementById("log");

const context =
  document.getElementById("context");

const contextTitle =
  document.getElementById("contextTitle");

const contextText =
  document.getElementById("contextText");

const targetPanel =
  document.getElementById("targetPanel");

const targetName =
  document.getElementById("targetName");

const targetRole =
  document.getElementById("targetRole");

const toastEl =
  document.getElementById("toast");


/* =========================================================
   THREE.JS INITIALIZATION
========================================================= */

function init3D() {

  scene = new THREE.Scene();

  scene.background =
    new THREE.Color(0x02070c);

  scene.fog =
    new THREE.FogExp2(0x02070c,0.018);

  camera = new THREE.PerspectiveCamera(
    62,
    window.innerWidth / window.innerHeight,
    0.1,
    500
  );

  camera.position.set(
    0,
    12,
    18
  );

  renderer = new THREE.WebGLRenderer({
    antialias:false,
    powerPreference:"low-power"
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,1.5)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  renderer.outputColorSpace =
    THREE.SRGBColorSpace;

  document
    .getElementById("game")
    .appendChild(renderer.domElement);

  world = new AfterlightWorld(scene);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  clock = new THREE.Clock();

  window.addEventListener(
    "resize",
    resize
  );

  renderer.domElement.addEventListener(
    "pointerdown",
    handleWorldClick
  );

  animate();
}


/* =========================================================
   ANIMATION
========================================================= */

function animate() {

  requestAnimationFrame(animate);

  const time = clock.getElapsedTime();

  if (world && world.update) {
    world.update(time);
  }

  updateMovement(time);

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

  if (!localPlayer) return;

  const target =
    localPlayer.group.position;

  const desired = new THREE.Vector3(
    target.x,
    target.y + 9,
    target.z + 13
  );

  camera.position.lerp(
    desired,
    0.08
  );

  const look = new THREE.Vector3(
    target.x,
    target.y + 1.8,
    target.z
  );

  camera.lookAt(look);
}


/* =========================================================
   RESIZE
========================================================= */

function resize() {

  if (!camera || !renderer) return;

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}


/* =========================================================
   CONNECTION
========================================================= */

function connect() {

  connectionText.textContent =
    "Connecting to AFTERLIGHT network...";

  socket = new WebSocket(SERVER_URL);

  socket.addEventListener(
    "open",
    () => {

      connectionText.textContent =
        "Network connected.";

      showToast(
        "AFTERLIGHT NETWORK CONNECTED"
      );
    }
  );

  socket.addEventListener(
    "message",
    event => {

      let data;

      try {
        data = JSON.parse(event.data);
      } catch {
        return;
      }

      handleServerMessage(data);
    }
  );

  socket.addEventListener(
    "close",
    () => {

      connectionText.textContent =
        "Connection lost. Refresh to reconnect.";

      showToast(
        "CONNECTION LOST"
      );
    }
  );

  socket.addEventListener(
    "error",
    () => {

      connectionText.textContent =
        "Network error.";

      showToast(
        "NETWORK ERROR"
      );
    }
  );
}


/* =========================================================
   SERVER MESSAGES
========================================================= */

function handleServerMessage(data) {

  if (data.type === "welcome") {

    localPlayerId =
      data.player?.id ||
      data.id;

    joined = true;

    joinScreen.style.display =
      "none";

    hud.style.display =
      "block";

    addLog(
      "Connected to AFTERLIGHT."
    );

    return;
  }

  if (
    data.type === "state" ||
    data.type === "room" ||
    data.type === "update"
  ) {

    roomState =
      data.state ||
      data.room ||
      data;

    updateGameState();

    return;
  }

  if (data.type === "error") {

    showToast(
      data.message ||
      "ACTION FAILED"
    );

    addLog(
      data.message ||
      "System rejected the action."
    );

    return;
  }

  if (data.type === "log") {

    addLog(
      data.message
    );

    return;
  }
}


/* =========================================================
   JOIN
========================================================= */

joinButton.addEventListener(
  "click",
  joinGame
);

nameInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {
      joinGame();
    }
  }
);


function joinGame() {

  const name =
    nameInput.value.trim();

  if (!name) {

    showToast(
      "ENTER YOUR COMPETITOR NAME"
    );

    nameInput.focus();

    return;
  }

  if (!socket ||
      socket.readyState !== WebSocket.OPEN) {

    connect();

    setTimeout(
      () => send({
        type:"join",
        name
      }),
      400
    );

    return;
  }

  send({
    type:"join",
    name
  });
}


/* =========================================================
   SEND
========================================================= */

function send(message) {

  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    return;
  }

  socket.send(
    JSON.stringify(message)
  );
}


/* =========================================================
   GAME STATE
========================================================= */

function updateGameState() {

  const players =
    roomState.players ||
    roomState.competitors ||
    [];

  const me =
    players.find(
      p => p.id === localPlayerId
    );

  if (me) {

    creditsEl.textContent =
      me.credits ?? 500;

    influenceEl.textContent =
      me.influence ?? 10;

    trustEl.textContent =
      me.trust ?? 50;

    energyEl.textContent =
      me.energy ?? 100;
  }

  phaseEl.textContent =
    roomState.phase ||
    "LOBBY";

  competitorCount.textContent =
    players.length;

  updatePlayers(
    players
  );

  updateCompetitorList(
    players
  );

  updateLogs(
    roomState.logs ||
    []
  );

  updateContext();
}


/* =========================================================
   PLAYERS
========================================================= */

function updatePlayers(players) {

  const ids =
    new Set(
      players.map(
        p => p.id
      )
    );

  for (
    const [id,player] of remotePlayers
  ) {

    if (!ids.has(id)) {

      scene.remove(
        player.group
      );

      if (player.remove) {
        player.remove();
      }

      remotePlayers.delete(id);
    }
  }

  for (const data of players) {

    let player =
      remotePlayers.get(
        data.id
      );

    if (!player) {

      player =
        new AfterlightPlayer(
          data.id,
          data.name,
          data.role,
          data.id === localPlayerId
        );

      scene.add(
        player.group
      );

      remotePlayers.set(
        data.id,
        player
      );
    }

    if (player.setServerState) {

      player.setServerState({
        x: data.x || 0,
        y: data.y || 0,
        z: data.z || 0
      });
    } else {

      player.group.position.set(
        data.x || 0,
        data.y || 0,
        data.z || 0
      );
    }

    if (data.id === localPlayerId) {
      localPlayer = player;
    }
  }
}

function updateCompetitorList(players) {

  competitorList.innerHTML = "";

  for (const player of players) {

          : ""

/* =========================================================
   PLAYER SELECTION
========================================================= */

function selectPlayer(id) {

  if (id === localPlayerId) {
    return;
  }

  const players =
    roomState.players ||
    roomState.competitors ||
    [];

  const player =
    players.find(
      p => p.id === id
    );

  if (!player) return;

  selectedPlayerId =
    id;

  targetPanel.classList.add(
    "visible"
  );

  targetName.textContent =
    player.name ||
    "Unknown";

  targetRole.textContent =
    player.role ||
    "Competitor";

  updateCompetitorList(
    players
  );

  showToast(
    `TARGET SELECTED: ${player.name}`
  );
}


/* =========================================================
   3D PLAYER CLICK
========================================================= */

function handleWorldClick(event) {

  if (!renderer) return;

  const rect =
    renderer.domElement.getBoundingClientRect();

  mouse.x =
    ((event.clientX - rect.left) /
      rect.width) * 2 - 1;

  mouse.y =
    -((event.clientY - rect.top) /
      rect.height) * 2 + 1;

  raycaster.setFromCamera(
    mouse,
    camera
  );

  const objects = [];

  for (
    const player of remotePlayers.values()
  ) {

    player.group.traverse(
      object => {

        if (
          object.isMesh ||
          object.isSprite
        ) {
          objects.push(object);
        }
      }
    );
  }

  const hits =
    raycaster.intersectObjects(
      objects,
      true
    );

  if (!hits.length) return;

  let object =
    hits[0].object;

  while (
    object &&
    object.parent
  ) {

    if (object.userData?.playerId) {

      selectPlayer(
        object.userData.playerId
      );

      return;
    }

    object =
      object.parent;
  }

  // fallback: identify closest group
  for (
    const [id,player] of remotePlayers
  ) {

    if (
      player.group ===
      hits[0].object.parent
    ) {

      selectPlayer(id);

      break;
    }
  }
}

window.addEventListener(

      keys[key] = true;
    }
  }
);

window.addEventListener(

  event => {

    const key =
      event.key.toLowerCase();

    if (keys.hasOwnProperty(key)) {
      keys[key] = false;
    }
  }
);


function updateMovement(time) {

  if (!localPlayer ||
      !joined) {
    return;
  }

  let dx = 0;
  let dz = 0;

  if (keys.w ||
      keys.arrowup) {
    dz -= 1;
  }

  if (keys.s ||
      keys.arrowdown) {
    dz += 1;
  }

  if (keys.a ||
      keys.arrowleft) {
    dx -= 1;
  }

  if (keys.d ||
      keys.arrowright) {
    dx += 1;
  }

  if (dx === 0 &&
      dz === 0) {
    return;
  }

  const length =
    Math.sqrt(
      dx * dx +
      dz * dz
    );

  dx /= length;
  dz /= length;

  const speed =
    0.13;

  const position =
    localPlayer.group.position;

  position.x +=
    dx * speed;

  position.z +=
    dz * speed;

  position.x =
    THREE.MathUtils.clamp(
      position.x,
      -22,
      22
    );

  position.z =
    THREE.MathUtils.clamp(
      position.z,
      -22,
      22
    );

  if (
    time - lastMoveSent >
    0.08
  ) {

    lastMoveSent =
      time;

    send({
      type:"move",
      x:position.x,
      y:position.y,
      z:position.z
    });
  }
}


/* =========================================================
   CONTEXTUAL FACILITY INTERACTION
========================================================= */

function updateContext() {

  if (!localPlayer) {
    return;
  }

  const p =
    localPlayer.group.position;

  const distance =
    Math.sqrt(
      p.x * p.x +
      p.z * p.z
    );

  let title =
    "AFTERLIGHT FACILITY";

  let description =
    "Explore the facility.";

  if (distance < 6) {

    title =
      "AFTERLIGHT CORE";

    description =
      "The central system is watching every decision.";

  } else if (
    p.x < -18 &&
    p.z < 5
  ) {

    title =
      "DINING HALL";

    description =
      "Talk, negotiate, form alliances and gather information.";

  } else if (
    p.x > 18 &&
    p.z < 5
  ) {

    title =
      "POWER STORE";

    description =
      "BUY • EARN • TRADE futuristic powers.";

  } else if (
    p.z < -18
  ) {

    title =
      "CHALLENGE DECK";

    description =
      "Prepare for the next AFTERLIGHT challenge.";

  } else if (
    p.z > 18
  ) {

    title =
      "SOCIAL ROOM";

    description =
      "Deals, accusations, pacts and secret missions.";

  }

  contextTitle.textContent =
    title;

  contextText.textContent =
    description;

  context.classList.add(
    "visible"
  );
}

/* =========================================================
   LOGGING
========================================================= */

function addLog(message) {

  if (!message) return;

  const line =
    document.createElement("div");

  line.className =
    "log-line";

  line.textContent =
    message;

  logEl.prepend(
    line
  );

  while (
    logEl.children.length > 40
  ) {
    logEl.lastChild.remove();
  }
}


function updateLogs(logs) {

  if (!Array.isArray(logs)) {
    return;
  }

  logEl.innerHTML = "";

  for (
    const item of logs.slice(-40)
  ) {

    const message =
      typeof item === "string"
        ? item
        : item.message;

    if (!message) continue;

    const line =
      document.createElement("div");

    line.className =
      "log-line";

    line.textContent =
      message;

    logEl.appendChild(
      line
    );
  }

  logEl.scrollTop =
    logEl.scrollHeight;
}


/* =========================================================
   MOBILE MOVEMENT
========================================================= */

document
  .querySelectorAll(".move-btn")
  .forEach(button => {

    const dir =
      button.dataset.dir;

    const down = event => {

      event.preventDefault();

      if (dir === "up")
        keys.w = true;

      if (dir === "down")
        keys.s = true;

      if (dir === "left")
        keys.a = true;

      if (dir === "right")
        keys.d = true;
    };

    const up = event => {

      event.preventDefault();

      if (dir === "up")
        keys.w = false;

      if (dir === "down")
        keys.s = false;

      if (dir === "left")
        keys.a = false;

      if (dir === "right")
        keys.d = false;
    };

    button.addEventListener(
      "pointerdown",
      down
    );

    button.addEventListener(
      "pointerup",
      up
    );

    button.addEventListener(
      "pointercancel",
      up
    );

    button.addEventListener(
      "pointerleave",
      up
    );
  });


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(message) {

  toastEl.textContent =
    message;

  toastEl.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {

        toastEl.classList.remove(
          "show"
        );

      },
      1800
    );
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
