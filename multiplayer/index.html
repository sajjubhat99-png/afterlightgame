<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  >

  <title>AFTERLIGHT — Multiplayer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02050a;
      color: #dffaff;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #join {
      position: fixed;
      inset: 0;
      z-index: 50;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at center,
          rgba(18, 86, 108, 0.25),
          rgba(1, 4, 8, 0.96) 65%
        );
    }

    .join-card {
      width: min(520px, 92vw);
      padding: 38px;

      border: 1px solid rgba(
        72,
        222,
        255,
        0.3
      );

      background:
        rgba(4, 12, 20, 0.92);

      box-shadow:
        0 0 80px rgba(
          25,
          230,
          255,
          0.12
        );

      backdrop-filter: blur(15px);
    }

    .logo {
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 12px;
      color: #dffaff;
    }

    .subtitle {
      margin-top: 8px;
      color: #62eaff;
      letter-spacing: 3px;
      font-size: 12px;
    }

    .join-card p {
      color: #8299a5;
      line-height: 1.7;
    }

    input {
      width: 100%;
      height: 52px;
      margin-top: 18px;
      padding: 0 16px;

      border: 1px solid #244452;
      outline: none;

      background: #08131c;
      color: white;

      font-size: 16px;
    }

    input:focus {
      border-color: #19e6ff;
    }

    button {
      border: 1px solid rgba(
        80,
        230,
        255,
        0.35
      );

      background:
        linear-gradient(
          135deg,
          #0b303b,
          #07151d
        );

      color: #dffaff;

      padding: 12px 18px;

      cursor: pointer;

      font-weight: 700;

      transition:
        transform 0.15s,
        border-color 0.15s,
        background 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: #19e6ff;
    }

    button:active {
      transform: scale(0.97);
    }

    #joinButton {
      width: 100%;
      height: 54px;
      margin-top: 14px;

      font-size: 16px;
      letter-spacing: 2px;
    }

    #hud {
      position: fixed;
      inset: 0;
      z-index: 10;

      pointer-events: none;
    }

    .panel {
      pointer-events: auto;

      position: absolute;

      background:
        rgba(4, 12, 19, 0.78);

      border: 1px solid rgba(
        81,
        218,
        255,
        0.2
      );

      backdrop-filter: blur(10px);

      box-shadow:
        0 8px 30px rgba(
          0,
          0,
          0,
          0.3
        );
    }

    #stats {
      left: 18px;
      top: 18px;

      padding: 15px;

      width: 245px;
    }

    .stat {
      display: flex;
      justify-content: space-between;

      padding: 6px 0;

      border-bottom:
        1px solid rgba(
          255,
          255,
          255,
          0.04
        );

      font-size: 13px;
    }

    .value {
      color: #68eaff;
      font-weight: 800;
    }

    #phase {
      left: 50%;
      top: 18px;

      transform:
        translateX(-50%);

      padding:
        11px 22px;

      letter-spacing: 3px;
      font-size: 12px;
      font-weight: 800;
    }

    #players {
      right: 18px;
      top: 18px;

      width: 245px;
      max-height: 360px;

      overflow: auto;

      padding: 12px;
    }

    .player {
      display: flex;
      justify-content: space-between;

      padding: 8px 5px;

      border-bottom:
        1px solid rgba(
          255,
          255,
          255,
          0.05
        );

      font-size: 12px;

      cursor: pointer;
    }

    .player:hover {
      background:
        rgba(
          25,
          230,
          255,
          0.08
        );
    }

    .dead {
      opacity: 0.35;
    }

    #actions {
      left: 18px;
      bottom: 18px;

      width: 330px;

      padding: 12px;

      display: grid;
      grid-template-columns:
        repeat(2, 1fr);

      gap: 8px;
    }

    #actions button {
      min-height: 44px;
    }

    #log {
      right: 18px;
      bottom: 18px;

      width: 330px;
      height: 170px;

      padding: 12px;

      overflow-y: auto;

      color: #8ba5b0;

      font-size: 11px;
      line-height: 1.55;
    }

    #toast {
      position: fixed;

      left: 50%;
      bottom: 205px;

      transform:
        translateX(-50%)
        translateY(20px);

      opacity: 0;

      padding:
        12px 22px;

      background:
        rgba(
          3,
          15,
          22,
          0.94
        );

      border:
        1px solid
        rgba(
          25,
          230,
          255,
          0.4
        );

      color: #dffaff;

      z-index: 100;

      transition:
        opacity 0.2s,
        transform 0.2s;
    }

    #toast.show {
      opacity: 1;

      transform:
        translateX(-50%)
        translateY(0);
    }

    #mobile {
      position: fixed;

      left: 20px;
      bottom: 20px;

      z-index: 20;

      display: none;
    }

    .mobile-row {
      display: flex;
      justify-content: center;
    }

    .mobile-button {
      width: 54px;
      height: 54px;

      margin: 3px;

      border-radius: 50%;

      background:
        rgba(
          8,
          24,
          32,
          0.85
        );
    }

    #challenge {
      position: fixed;
      inset: 0;

      z-index: 40;

      pointer-events: none;

      display: none;
    }

    #challenge.active {
      display: block;
    }

    #challenge-title {
      position: absolute;

      top: 70px;
      left: 50%;

      transform:
        translateX(-50%);

      padding:
        14px 28px;

      background:
        rgba(
          3,
          12,
          18,
          0.88
        );

      border:
        1px solid
        rgba(
          25,
          230,
          255,
          0.45
        );

      letter-spacing: 3px;
    }

    #challenge-info {
      position: absolute;

      top: 130px;
      left: 50%;

      transform:
        translateX(-50%);

      color: #70edff;
    }

    @media (max-width: 800px) {
      #stats {
        width: 180px;
      }

      #players {
        width: 180px;
      }

      #actions {
        width: 280px;
      }

      #log {
        display: none;
      }

      #mobile {
        display: block;
      }

      .logo {
        font-size: 34px;
        letter-spacing: 7px;
      }
    }

    @media (max-width: 560px) {
      #players {
        top: 105px;
        right: 10px;

        width: 160px;
        max-height: 230px;
      }

      #stats {
        left: 10px;
        top: 10px;
        width: 160px;
      }

      #actions {
        left: 10px;
        bottom: 10px;
        width: 250px;
      }

      #phase {
        top: 10px;
      }
    }
  </style>
</head>

<body>

<div id="game"></div>

<div id="join">
  <div class="join-card">

    <div class="logo">
      AFTERLIGHT
    </div>

    <div class="subtitle">
      THE CHALLENGE IS ONLY HALF THE GAME
    </div>

    <p>
      16 competitors enter the facility.
      Every decision changes what happens next.
    </p>

    <input
      id="name"
      maxlength="18"
      placeholder="Enter your competitor name"
      autocomplete="off"
    >

    <button id="joinButton">
      ENTER AFTERLIGHT
    </button>

  </div>
</div>

<div id="hud">

  <div id="stats" class="panel">

    <div class="stat">
      <span>Credits</span>
      <span id="credits" class="value">500</span>
    </div>

    <div class="stat">
      <span>Influence</span>
      <span id="influence" class="value">10</span>
    </div>

    <div class="stat">
      <span>Trust</span>
      <span id="trust" class="value">50</span>
    </div>

    <div class="stat">
      <span>Energy</span>
      <span id="energy" class="value">100</span>
    </div>

    <div class="stat">
      <span>Prize Pool</span>
      <span id="prize" class="value">16,000</span>
    </div>

  </div>

  <div id="phase" class="panel">
    LOBBY
  </div>

  <div id="players" class="panel">
    <strong>COMPETITORS</strong>
    <div id="playerList"></div>
  </div>

  <div id="actions" class="panel">

    <button id="ready">
      READY
    </button>

    <button id="challenge">
      CHALLENGE
    </button>

    <button id="social">
      SOCIAL
    </button>

    <button id="mission">
      MISSION
    </button>

    <button id="power">
      POWER STORE
    </button>

    <button id="parallel">
      PARALLEL
    </button>

    <button id="architect">
      ARCHITECT
    </button>

    <button id="heist">
      HEIST
    </button>

    <button id="vacation">
      VACATION
    </button>

    <button id="trade">
      TRADE
    </button>

    <button id="pact">
      SECRET PACT
    </button>

    <button id="protect">
      PROTECT
    </button>

    <button id="vote">
      VOTE
    </button>

  </div>

  <div id="log" class="panel">
    <strong>AFTERLIGHT LOG</strong>
    <div id="logContent"></div>
  </div>

</div>

<div id="mobile">

  <div class="mobile-row">
    <button class="mobile-button" data-key="w">
      ▲
    </button>
  </div>

  <div class="mobile-row">

    <button class="mobile-button" data-key="a">
      ◀
    </button>

    <button class="mobile-button" data-key="s">
      ▼
    </button>

    <button class="mobile-button" data-key="d">
      ▶
    </button>

  </div>

</div>

<div id="challenge">

  <div id="challenge-title">
    FLOATING BRIDGE
  </div>

  <div id="challenge-info">
    CHALLENGE ACTIVE
  </div>

</div>

<div id="toast"></div>

<script type="module">

import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { AfterlightWorld } from
  "./world.js";

import { AfterlightPlayer } from
  "./player.js";

const SERVER_URL =
  "wss://afterlightgame.sajjubhat99.workers.dev/ws";

const container =
  document.getElementById("game");

const join =
  document.getElementById("join");

const nameInput =
  document.getElementById("name");

const joinButton =
  document.getElementById("joinButton");

const scene =
  new THREE.Scene();

const camera =
  new THREE.PerspectiveCamera(
    65,
    innerWidth / innerHeight,
    0.1,
    250
  );

camera.position.set(
  0,
  8,
  14
);

const renderer =
  new THREE.WebGLRenderer({
    antialias: true,
    powerPreference: "high-performance"
  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    1.5
  )
);

renderer.setSize(
  innerWidth,
  innerHeight
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
  THREE.PCFSoftShadowMap;

container.appendChild(
  renderer.domElement
);

const world =
  new AfterlightWorld(scene);

let socket = null;

let connected = false;

let localPlayerId = null;

let players = new Map();

let selectedPlayerId = null;

const keys = {};

const clock =
  new THREE.Clock();

function showToast(message) {

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  setTimeout(() => {
    toast.classList.remove(
      "show"
    );
  }, 2200);
}

function send(message) {

  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    return;
  }

  socket.send(
    JSON.stringify(message)
  );
}

function connect() {

  socket =
    new WebSocket(
      SERVER_URL
    );

  socket.onopen = () => {

    connected = true;

    showToast(
      "Connected to AFTERLIGHT."
    );

    send({
      type: "join",
      name:
        nameInput.value.trim()
    });
  };

  socket.onmessage = event => {

    let message;

    try {
      message =
        JSON.parse(
          event.data
        );
    } catch {
      return;
    }

    handleMessage(message);
  };

  socket.onerror = () => {

    showToast(
      "Connection error."
    );
  };

  socket.onclose = () => {

    connected = false;

    showToast(
      "Connection closed."
    );
  };
}

function handleMessage(message) {

  if (
    message.type ===
    "connected"
  ) {
    return;
  }

  if (
    message.type ===
    "welcome"
  ) {

    localPlayerId =
      message.player.id;

    join.style.display =
      "none";

    showToast(
      "Welcome to AFTERLIGHT."
    );

    return;
  }

  if (
    message.type ===
    "state"
  ) {

    applyState(
      message.state
    );

    return;
  }

  if (
    message.type ===
    "log"
  ) {

    addLog(
      message.message
    );

    return;
  }

  if (
    message.type ===
    "error"
  ) {

    showToast(
      message.message
    );

    return;
  }

  if (
    message.type ===
    "challengeStart"
  ) {

    document
      .getElementById(
        "challenge"
      )
      .classList.add(
        "active"
      );

    showToast(
      "Floating Bridge started."
    );

    return;
  }

  if (
    message.type ===
    "challengeResult"
  ) {

    if (message.success) {

      showToast(
        message.finished
          ? "Bridge completed!"
          : "Safe panel."
      );

    } else {

      showToast(
        "Unstable panel."
      );
    }

    return;
  }

  if (
    message.type ===
    "challengeEnd"
  ) {

    document
      .getElementById(
        "challenge"
      )
      .classList.remove(
        "active"
      );

    return;
  }

  if (
    message.type ===
    "winner"
  ) {

    showToast(
      `${message.winner.name} wins AFTERLIGHT!`
    );
  }
}

function applyState(state) {

  document.getElementById(
    "phase"
  ).textContent =
    state.phase;

  document.getElementById(
    "prize"
  ).textContent =
    Number(
      state.prizePool || 0
    ).toLocaleString();

  const incoming =
    new Map();

  for (
    const data
    of state.players || []
  ) {

    incoming.set(
      data.id,
      data
    );

    let player =
      players.get(
        data.id
      );

    if (!player) {

      player =
        new AfterlightPlayer(
          data,
          data.id === localPlayerId
        );

      scene.add(
        player.group
      );

      players.set(
        data.id,
        player
      );
    }

    player.update(
      data,
      clock.getDelta()
    );

    if (
      data.id ===
      localPlayerId
    ) {

      updateLocalHUD(
        data
      );
    }

    player.setVisible(
      data.alive !== false
    );
  }

  for (
    const [id, player]
    of players
  ) {

    if (
      !incoming.has(id)
    ) {

      player.remove();

      players.delete(id);
    }
  }

  renderPlayerList(
    state.players || []
  );
}

function updateLocalHUD(data) {

  document.getElementById(
    "credits"
  ).textContent =
    data.credits;

  document.getElementById(
    "influence"
  ).textContent =
    data.influence;

  document.getElementById(
    "trust"
  ).textContent =
    data.trust;

  document.getElementById(
    "energy"
  ).textContent =
    data.energy;
}

function renderPlayerList(list) {

  const element =
    document.getElementById(
      "playerList"
    );

  element.innerHTML = "";

  for (
    const player
    of list
  ) {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "player";

    if (
      !player.alive
    ) {
      row.classList.add(
        "dead"
      );
    }

    row.innerHTML = `
      <span>
        ${escapeHTML(player.name)}
      </span>
      <span>
        ${escapeHTML(player.role)}
      </span>
    `;

    row.addEventListener(
      "click",
      () => {

        selectedPlayerId =
          player.id;

        showToast(
          `${player.name} selected.`
        );
      }
    );

    element.appendChild(
      row
    );
  }
}

function addLog(message) {

  const content =
    document.getElementById(
      "logContent"
    );

  const row =
    document.createElement(
      "div"
    );

  row.textContent =
    message;

  content.appendChild(
    row
  );

  while (
    content.children.length >
    30
  ) {

    content.removeChild(
      content.firstChild
    );
  }

  const log =
    document.getElementById(
      "log"
    );

  log.scrollTop =
    log.scrollHeight;
}

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function localPlayer() {

  return players.get(
    localPlayerId
  );
}

function move() {

  const player =
    localPlayer();

  if (!player) {
    return;
  }

  let dx = 0;
  let dz = 0;

  if (
    keys.w ||
    keys.ArrowUp
  ) {
    dz -= 1;
  }

  if (
    keys.s ||
    keys.ArrowDown
  ) {
    dz += 1;
  }

  if (
    keys.a ||
    keys.ArrowLeft
  ) {
    dx -= 1;
  }

  if (
    keys.d ||
    keys.ArrowRight
  ) {
    dx += 1;
  }

  if (
    dx === 0 &&
    dz === 0
  ) {
    return;
  }

  const length =
    Math.sqrt(
      dx * dx +
      dz * dz
    );

  dx /= length;
  dz /= length;

  const speed = 0.18;

  player.target.x +=
    dx * speed;

  player.target.z +=
    dz * speed;

  player.target.x =
    THREE.MathUtils.clamp(
      player.target.x,
      -39,
      39
    );

  player.target.z =
    THREE.MathUtils.clamp(
      player.target.z,
      -39,
      39
    );

  send({
    type: "move",
    x: player.target.x,
    y: 0,
    z: player.target.z
  });
}

function updateCamera() {

  const player =
    localPlayer();

  if (!player) {
    return;
  }

  const target =
    player.group.position;

  const desired =
    new THREE.Vector3(
      target.x,
      target.y + 7,
      target.z + 11
    );

  camera.position.lerp(
    desired,
    0.06
  );

  camera.lookAt(
    target.x,
    target.y + 2.2,
    target.z
  );
}

window.addEventListener(
  "keydown",
  event => {

    keys[
      event.key
    ] = true;
  }
);

window.addEventListener(
  "keyup",
  event => {

    keys[
      event.key
    ] = false;
  }
);

document
  .querySelectorAll(
    ".mobile-button"
  )
  .forEach(button => {

    const key =
      button.dataset.key;

    button.addEventListener(
      "pointerdown",
      () => {
        keys[key] = true;
      }
    );

    button.addEventListener(
      "pointerup",
      () => {
        keys[key] = false;
      }
    );

    button.addEventListener(
      "pointerleave",
      () => {
        keys[key] = false;
      }
    );
  });

joinButton.addEventListener(
  "click",
  () => {

    if (
      nameInput.value.trim()
        .length === 0
    ) {

      nameInput.value =
        "Player";

    }

    connect();
  }
);

nameInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      joinButton.click();
    }
  }
);

document
  .getElementById("ready")
  .onclick = () => {

    send({
      type: "ready"
    });
  };

document
  .getElementById("challenge")
  .onclick = () => {

    send({
      type: "challengeStart"
    });
  };

document
  .getElementById("social")
  .onclick = () => {

    send({
      type: "social",
      action: "talk"
    });
  };

document
  .getElementById("mission")
  .onclick = () => {

    send({
      type: "mission"
    });
  };

document
  .getElementById("power")
  .onclick = () => {

    const power =
      prompt(
        "Enter power name:\n\nPower Ring\nPulse Watch\nGravity Shoes\nSpectra Visor\nPhase Jacket\nSignal Band\nInfluence Chip\nShadow Pack\nOracle Lens\nShield Band"
      );

    if (!power) {
      return;
    }

    send({
      type: "buyPower",
      power
    });
  };

document
  .getElementById("parallel")
  .onclick = () => {

    send({
      type: "parallel"
    });
  };

document
  .getElementById("architect")
  .onclick = () => {

    send({
      type: "architect"
    });
  };

document
  .getElementById("heist")
  .onclick = () => {

    send({
      type: "heist"
    });
  };

document
  .getElementById("vacation")
  .onclick = () => {

    send({
      type: "vacation"
    });
  };

document
  .getElementById("trade")
  .onclick = () => {

    if (!selectedPlayerId) {

      showToast(
        "Select a competitor first."
      );

      return;
    }

    send({
      type: "trade",
      targetId:
        selectedPlayerId,
      amount: 50
    });
  };

document
  .getElementById("pact")
  .onclick = () => {

    if (!selectedPlayerId) {

      showToast(
        "Select a competitor first."
      );

      return;
    }

    send({
      type: "pact",
      targetId:
        selectedPlayerId
    });
  };

document
  .getElementById("protect")
  .onclick = () => {

    send({
      type: "protect",
      targetId:
        selectedPlayerId ||
        localPlayerId
    });
  };

document
  .getElementById("vote")
  .onclick = () => {

    if (!selectedPlayerId) {

      showToast(
        "Select a competitor first."
      );

      return;
    }

    send({
      type: "vote",
      targetId:
        selectedPlayerId
    });
  };

function animate() {

  requestAnimationFrame(
    animate
  );

  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );

  const time =
    performance.now();

  move();

  for (
    const player
    of players.values()
  ) {

    player.update(
      null,
      delta
    );
  }

  world.update(
    time
  );

  updateCamera();

  renderer.render(
    scene,
    camera
  );
}

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      innerWidth /
      innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      innerWidth,
      innerHeight
    );
  }
);

animate();

</script>

</body>
</html>
