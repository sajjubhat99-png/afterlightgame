<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AFTERLIGHT</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #03070c;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
}

/* =========================
   JOIN SCREEN
========================= */

#joinScreen {
  position: fixed;
  inset: 0;
  z-index: 10000;

  display: flex;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(
      circle at center,
      rgba(0, 229, 255, 0.08),
      rgba(3, 7, 12, 0.98) 65%
    );
}

.joinBox {
  width: min(380px, calc(100vw - 36px));
  padding: 30px 26px;

  text-align: center;

  background: rgba(5, 13, 22, 0.94);
  border: 1px solid rgba(0, 229, 255, 0.35);
  border-radius: 16px;

  box-shadow:
    0 0 40px rgba(0, 229, 255, 0.08);
}

.logo {
  margin-bottom: 8px;

  font-size: 27px;
  line-height: 1;

  font-weight: 800;
  letter-spacing: 7px;

  color: #ffffff;

  text-shadow:
    0 0 12px rgba(0, 229, 255, 0.5);
}

.tagline {
  margin-bottom: 28px;

  font-size: 11px;
  letter-spacing: 2px;

  color: #6e9ba8;
}

.joinTitle {
  margin-bottom: 14px;

  font-size: 15px;
  letter-spacing: 1px;

  color: #dffaff;
}

#nameInput {
  width: 100%;
  height: 46px;

  padding: 0 14px;

  border: 1px solid rgba(0, 229, 255, 0.35);
  border-radius: 8px;

  outline: none;

  background: rgba(0, 0, 0, 0.35);
  color: white;

  font-size: 16px;
}

#nameInput:focus {
  border-color: #00e5ff;
  box-shadow: 0 0 15px rgba(0, 229, 255, 0.15);
}

#joinButton {
  width: 100%;
  height: 46px;

  margin-top: 12px;

  border: 0;
  border-radius: 8px;

  background: #00d9f5;
  color: #001015;

  font-size: 14px;
  font-weight: 800;
  letter-spacing: 1px;

  cursor: pointer;
}

#joinButton:hover {
  background: #55edff;
}

#joinButton:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

#connectionStatus {
  min-height: 18px;

  margin-top: 14px;

  font-size: 12px;
  color: #6e9ba8;
}

/* =========================
   HUD
========================= */

#hud {
  position: fixed;
  inset: 0;

  z-index: 100;

  pointer-events: none;

  display: none;
}

.hudPanel {
  position: absolute;

  background: rgba(3, 10, 17, 0.78);

  border: 1px solid rgba(0, 229, 255, 0.22);
  border-radius: 10px;

  backdrop-filter: blur(8px);
}

#stats {
  top: 16px;
  left: 16px;

  padding: 12px 16px;

  display: flex;
  gap: 18px;
}

.stat {
  min-width: 55px;
}

.statLabel {
  font-size: 9px;
  color: #65808a;
  letter-spacing: 1px;
}

.statValue {
  margin-top: 3px;

  font-size: 15px;
  font-weight: 700;

  color: #eaffff;
}

#phasePanel {
  top: 16px;
  left: 50%;

  transform: translateX(-50%);

  padding: 9px 18px;

  text-align: center;
}

.phaseLabel {
  font-size: 8px;
  color: #63828b;
  letter-spacing: 2px;
}

#phase {
  margin-top: 3px;

  font-size: 14px;
  font-weight: 700;

  color: #00e5ff;
}

#competitors {
  top: 16px;
  right: 16px;

  padding: 10px 14px;

  font-size: 11px;
  color: #b7d7df;
}

#log {
  left: 16px;
  bottom: 16px;

  width: 310px;
  max-height: 145px;

  padding: 12px;

  overflow: hidden;

  font-family: monospace;
  font-size: 10px;

  color: #86aeb8;
}

.logLine {
  margin-bottom: 5px;
}

/* =========================
   ACTIONS
========================= */

#actions {
  position: absolute;

  right: 16px;
  bottom: 16px;

  display: flex;
  flex-direction: column;

  gap: 7px;

  pointer-events: auto;
}

.actionButton {
  min-width: 145px;

  padding: 9px 12px;

  border: 1px solid rgba(0, 229, 255, 0.3);
  border-radius: 7px;

  background: rgba(3, 13, 21, 0.9);

  color: #bdebf2;

  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.7px;

  cursor: pointer;
}

.actionButton:hover {
  background: rgba(0, 229, 255, 0.12);
  border-color: #00e5ff;
  color: white;
}

/* =========================
   MOBILE CONTROLS
========================= */

#mobileControls {
  position: absolute;

  left: 16px;
  bottom: 18px;

  display: none;

  pointer-events: auto;
}

.moveGrid {
  display: grid;

  grid-template-columns: 48px 48px 48px;
  grid-template-rows: 48px 48px;

  gap: 5px;
}

.moveButton {
  border: 1px solid rgba(0, 229, 255, 0.25);
  border-radius: 8px;

  background: rgba(3, 13, 21, 0.85);

  color: #bdebf2;

  font-size: 18px;
}

.up {
  grid-column: 2;
}

.left {
  grid-column: 1;
}

.down {
  grid-column: 2;
}

.right {
  grid-column: 3;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

  #stats {
    gap: 9px;
    padding: 9px 10px;
  }

  .stat {
    min-width: 42px;
  }

  .statValue {
    font-size: 12px;
  }

  #phasePanel {
    top: 70px;
  }

  #competitors {
    top: 70px;
  }

  #log {
    width: 220px;
    max-height: 100px;
  }

  #actions {
    right: 10px;
    bottom: 10px;
  }

  .actionButton {
    min-width: 115px;
    padding: 8px;
    font-size: 9px;
  }

  #mobileControls {
    display: block;
  }
}

@media (max-width: 430px) {

  .joinBox {
    padding: 25px 20px;
  }

  .logo {
    font-size: 23px;
    letter-spacing: 5px;
  }

  .tagline {
    font-size: 9px;
  }

  #stats {
    left: 8px;
    top: 8px;
  }

  #competitors {
    right: 8px;
    top: 8px;
  }

  #log {
    display: none;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- =========================
     JOIN SCREEN
========================= -->

<div id="joinScreen">

  <div class="joinBox">

    <div class="logo">
      AFTERLIGHT
    </div>

    <div class="tagline">
      THE CHALLENGE IS ONLY HALF THE GAME
    </div>

    <div class="joinTitle">
      ENTER YOUR NAME
    </div>

    <input
      id="nameInput"
      type="text"
      maxlength="18"
      autocomplete="off"
      spellcheck="false"
      placeholder="Your player name"
    />

    <button
      id="joinButton"
      type="button"
      disabled
    >
      JOIN AFTERLIGHT
    </button>

    <div id="connectionStatus">
      Connecting...
    </div>

  </div>

</div>

<!-- =========================
     GAME HUD
========================= -->

<div id="hud">

  <div
    id="stats"
    class="hudPanel"
  >

    <div class="stat">
      <div class="statLabel">CREDITS</div>
      <div
        class="statValue"
        id="credits"
      >
        500
      </div>
    </div>

    <div class="stat">
      <div class="statLabel">INFLUENCE</div>
      <div
        class="statValue"
        id="influence"
      >
        10
      </div>
    </div>

    <div class="stat">
      <div class="statLabel">TRUST</div>
      <div
        class="statValue"
        id="trust"
      >
        50
      </div>
    </div>

    <div class="stat">
      <div class="statLabel">ENERGY</div>
      <div
        class="statValue"
        id="energy"
      >
        100
      </div>
    </div>

  </div>

  <div
    id="phasePanel"
    class="hudPanel"
  >

    <div class="phaseLabel">
      CURRENT PHASE
    </div>

    <div id="phase">
      LOBBY
    </div>

  </div>

  <div
    id="competitors"
    class="hudPanel"
  >
    COMPETITORS:
    <span id="competitorCount">0</span>
  </div>

  <div
    id="log"
    class="hudPanel"
  >
    <div class="logLine">
      System online.
    </div>

    <div class="logLine">
      Waiting for competitors...
    </div>
  </div>

  <div id="actions">

    <button
      class="actionButton"
      data-action="ready"
    >
      READY
    </button>

    <button
      class="actionButton"
      data-action="challenge"
    >
      ENTER CHALLENGE
    </button>

    <button
      class="actionButton"
      data-action="social"
    >
      SOCIAL PHASE
    </button>

    <button
      class="actionButton"
      data-action="mission"
    >
      SECRET MISSION
    </button>

    <button
      class="actionButton"
      data-action="parallel"
    >
      PARALLEL WORLD
    </button>

    <button
      class="actionButton"
      data-action="architect"
    >
      INVESTIGATE
    </button>

    <button
      class="actionButton"
      data-action="heist"
    >
      THE HEIST
    </button>

    <button
      class="actionButton"
      data-action="vacation"
    >
      VACATION
    </button>

    <button
      class="actionButton"
      data-action="power"
    >
      POWER STORE
    </button>

    <button
      class="actionButton"
      data-action="vote"
    >
      VOTE
    </button>

  </div>

  <div id="mobileControls">

    <div class="moveGrid">

      <button
        class="moveButton up"
        data-move="up"
      >
        ▲
      </button>

      <button
        class="moveButton left"
        data-move="left"
      >
        ◀
      </button>

      <button
        class="moveButton down"
        data-move="down"
      >
        ▼
      </button>

      <button
        class="moveButton right"
        data-move="right"
      >
        ▶
      </button>

    </div>

  </div>

</div>

<script type="module">

import * as THREE from
  "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import {
  AfterlightWorld
} from "./world.js";

import {
  AfterlightPlayer
} from "./player.js";

/* =========================
   SERVER
========================= */

const SERVER_URL =
  "wss://afterlightgame.sajjubhat99.workers.dev/ws";

/* =========================
   DOM
========================= */

const gameContainer =
  document.getElementById("game");

const joinScreen =
  document.getElementById("joinScreen");

const nameInput =
  document.getElementById("nameInput");

const joinButton =
  document.getElementById("joinButton");

const connectionStatus =
  document.getElementById("connectionStatus");

const hud =
  document.getElementById("hud");

/* =========================
   STATE
========================= */

let socket = null;

let connected = false;

let joined = false;

let localPlayerId = null;

let reconnectTimer = null;

let players = new Map();

let world = null;

let scene = null;

let camera = null;

let renderer = null;

let clock = new THREE.Clock();

let keys = {};

let movementSpeed = 5;

/* =========================
   NAME INPUT
========================= */

function updateJoinButton() {

  const name =
    nameInput.value.trim();

  joinButton.disabled =
    !connected ||
    name.length < 2 ||
    joined;
}

nameInput.addEventListener(
  "input",
  updateJoinButton
);

/*
 * IMPORTANT:
 * Keyboard input must NOT affect the game
 * while typing the player name.
 */

nameInput.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      event.preventDefault();

      if (!joinButton.disabled) {
        joinGame();
      }

    }

    event.stopPropagation();
  }
);

/* =========================
   THREE.JS
========================= */

function createGame() {

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(0x03070c);

  scene.fog =
    new THREE.FogExp2(
      0x03070c,
      0.018
    );

  camera =
    new THREE.PerspectiveCamera(
      65,
      window.innerWidth /
      window.innerHeight,
      0.1,
      500
    );

  camera.position.set(
    0,
    8,
    12
  );

  renderer =
    new THREE.WebGLRenderer({
      antialias: true,
      powerPreference: "high-performance"
    });

  renderer.setPixelRatio(
    Math.min(
      window.devicePixelRatio,
      1.5
    )
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  gameContainer.appendChild(
    renderer.domElement
  );

  world =
    new AfterlightWorld(scene);

  window.addEventListener(
    "resize",
    onResize
  );

  animate();
}

/* =========================
   RESIZE
========================= */

function onResize() {

  if (!camera || !renderer) {
    return;
  }

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}

/* =========================
   CONNECTION
========================= */

function connect() {

  /*
   * Do not create another socket
   * while one already exists.
   */

  if (
    socket &&
    (
      socket.readyState ===
      WebSocket.OPEN ||

      socket.readyState ===
      WebSocket.CONNECTING
    )
  ) {
    return;
  }

  connectionStatus.textContent =
    "Connecting...";

  try {

    socket =
      new WebSocket(
        SERVER_URL
      );

  } catch (error) {

    connectionStatus.textContent =
      "Connection failed.";

    scheduleReconnect();

    return;
  }

  socket.onopen =
    function() {

      connected = true;

      connectionStatus.textContent =
        "Connected. Enter your name.";

      /*
       * CRITICAL:
       * Never hide joinScreen here.
       */

      joinScreen.style.display =
        "flex";

      updateJoinButton();

      setTimeout(
        function() {

          if (
            !joined &&
            document.activeElement !==
            nameInput
          ) {
            nameInput.focus();
          }

        },
        100
      );
    };

  socket.onmessage =
    function(event) {

      let message;

      try {

        message =
          JSON.parse(
            event.data
          );

      } catch {

        return;
      }

      handleMessage(message);
    };

  socket.onerror =
    function() {

      connected = false;

      connectionStatus.textContent =
        "Connection error.";

      updateJoinButton();
    };

  socket.onclose =
    function() {

      connected = false;

      updateJoinButton();

      /*
       * If the player has NOT joined,
       * the name screen stays visible.
       */

      if (!joined) {

        joinScreen.style.display =
          "flex";

        connectionStatus.textContent =
          "Connection lost. Reconnecting...";

        scheduleReconnect();

      } else {

        connectionStatus.textContent =
          "Disconnected. Reconnecting...";

        scheduleReconnect();
      }
    };
}

/* =========================
   RECONNECT
========================= */

function scheduleReconnect() {

  if (reconnectTimer) {
    return;
  }

  reconnectTimer =
    setTimeout(
      function() {

        reconnectTimer = null;

        connect();

      },
      3000
    );
}

/* =========================
   JOIN
========================= */

function joinGame() {

  if (!connected) {
    return;
  }

  if (joined) {
    return;
  }

  const name =
    nameInput.value.trim();

  if (name.length < 2) {

    connectionStatus.textContent =
      "Enter at least 2 characters.";

    nameInput.focus();

    return;
  }

  /*
   * Do NOT hide the screen yet.
   */

  joinButton.disabled = true;

  connectionStatus.textContent =
    "Joining AFTERLIGHT...";

  socket.send(
    JSON.stringify({
      type: "join",
      name: name
    })
  );
}

joinButton.addEventListener(
  "click",
  joinGame
);

/* =========================
   SERVER MESSAGES
========================= */

function handleMessage(message) {

  switch (message.type) {

    case "welcome":

      handleWelcome(message);

      break;

    case "players":

      updatePlayers(
        message.players ||
        []
      );

      break;

    case "state":

      updateState(
        message
      );

      break;

    case "log":

      addLog(
        message.message ||
        ""
      );

      break;

    case "error":

      handleServerError(
        message
      );

      break;

    default:

      break;
  }
}

/* =========================
   WELCOME
========================= */

function handleWelcome(message) {

  /*
   * THIS is the only place where
   * the join screen is allowed to close.
   */

  joined = true;

  localPlayerId =
    message.player?.id ||
    message.id ||
    null;

  connectionStatus.textContent =
    "Welcome to AFTERLIGHT.";

  joinScreen.style.display =
    "none";

  hud.style.display =
    "block";

  addLog(
    "Welcome to AFTERLIGHT."
  );
}

/* =========================
   ERROR
========================= */

function handleServerError(message) {

  /*
   * If joining failed, keep the
   * name screen open.
   */

  if (!joined) {

    joinScreen.style.display =
      "flex";

    joinButton.disabled =
      false;

    connectionStatus.textContent =
      message.message ||
      "Unable to join.";

    updateJoinButton();

  } else {

    addLog(
      message.message ||
      "Server error."
    );
  }
}

/* =========================
   PLAYERS
========================= */

function updatePlayers(list) {

  for (
    const data of list
  ) {

    let player =
      players.get(data.id);

    if (!player) {

      player =
        new AfterlightPlayer(
          scene,
          data,
          data.id ===
          localPlayerId
        );

      players.set(
        data.id,
        player
      );

    } else {

      player.updateFromServer(
        data
      );
    }
  }

  /*
   * Remove players that no longer
   * exist on the server.
   */

  const serverIds =
    new Set(
      list.map(
        player => player.id
      )
    );

  for (
    const [id, player]
    of players
  ) {

    if (
      !serverIds.has(id)
    ) {

      player.remove();

      players.delete(id);
    }
  }

  document.getElementById(
    "competitorCount"
  ).textContent =
    list.length;
}

/* =========================
   STATE
========================= */

function updateState(message) {

  if (message.phase) {

    document.getElementById(
      "phase"
    ).textContent =
      message.phase;
  }

  if (message.player) {

    const p =
      message.player;

    document.getElementById(
      "credits"
    ).textContent =
      p.credits ?? 500;

    document.getElementById(
      "influence"
    ).textContent =
      p.influence ?? 10;

    document.getElementById(
      "trust"
    ).textContent =
      p.trust ?? 50;

    document.getElementById(
      "energy"
    ).textContent =
      p.energy ?? 100;
  }
}

/* =========================
   LOG
========================= */

function addLog(message) {

  if (!message) {
    return;
  }

  const log =
    document.getElementById(
      "log"
    );

  const line =
    document.createElement(
      "div"
    );

  line.className =
    "logLine";

  line.textContent =
    message;

  log.appendChild(line);

  while (
    log.children.length > 10
  ) {

    log.removeChild(
      log.firstChild
    );
  }

  log.scrollTop =
    log.scrollHeight;
}

/* =========================
   ACTIONS
========================= */

document
  .querySelectorAll(
    ".actionButton"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          if (
            !socket ||
            socket.readyState !==
            WebSocket.OPEN ||
            !joined
          ) {
            return;
          }

          const action =
            button.dataset.action;

          sendAction(action);
        }
      );
    }
  );

function sendAction(action) {

  let message = {
    type: action
  };

  if (
    action === "ready"
  ) {
    message.type = "ready";
  }

  if (
    action === "challenge"
  ) {
    message.type =
      "challenge";
    message.action =
      "risk";
  }

  if (
    action === "social"
  ) {
    message.type =
      "social";
    message.action =
      "talk";
  }

  if (
    action === "mission"
  ) {
    message.type =
      "mission";
  }

  if (
    action === "parallel"
  ) {
    message.type =
      "parallel";
  }

  if (
    action === "architect"
  ) {
    message.type =
      "architect";
  }

  if (
    action === "heist"
  ) {
    message.type =
      "heist";
  }

  if (
    action === "vacation"
  ) {
    message.type =
      "vacation";
  }

  if (
    action === "power"
  ) {
    message.type =
      "buyPower";

    message.power =
      "Shield Band";
  }

  if (
    action === "vote"
  ) {
    message.type =
      "vote";
  }

  socket.send(
    JSON.stringify(message)
  );
}

/* =========================
   KEYBOARD
========================= */

window.addEventListener(
  "keydown",
  function(event) {

    /*
     * NEVER control the game while
     * the user is typing.
     */

    if (
      document.activeElement ===
      nameInput
    ) {
      return;
    }

    keys[event.key.toLowerCase()] =
      true;
  }
);

window.addEventListener(
  "keyup",
  function(event) {

    keys[event.key.toLowerCase()] =
      false;
  }
);

/* =========================
   MOVEMENT
========================= */

function updateMovement(delta) {

  if (!joined) {
    return;
  }

  const player =
    players.get(
      localPlayerId
    );

  if (!player) {
    return;
  }

  let dx = 0;
  let dz = 0;

  if (
    keys["w"] ||
    keys["arrowup"]
  ) {
    dz -= 1;
  }

  if (
    keys["s"] ||
    keys["arrowdown"]
  ) {
    dz += 1;
  }

  if (
    keys["a"] ||
    keys["arrowleft"]
  ) {
    dx -= 1;
  }

  if (
    keys["d"] ||
    keys["arrowright"]
  ) {
    dx += 1;
  }

  if (
    dx === 0 &&
    dz === 0
  ) {
    return;
  }

  const length =
    Math.sqrt(
      dx * dx +
      dz * dz
    );

  dx /= length;
  dz /= length;

  const x =
    player.group.position.x +
    dx *
    movementSpeed *
    delta;

  const z =
    player.group.position.z +
    dz *
    movementSpeed *
    delta;

  const clampedX =
    THREE.MathUtils.clamp(
      x,
      -22,
      22
    );

  const clampedZ =
    THREE.MathUtils.clamp(
      z,
      -22,
      22
    );

  player.setLocalPosition(
    clampedX,
    player.group.position.y,
    clampedZ
  );

  if (
    socket &&
    socket.readyState ===
    WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify({
        type: "move",
        x: clampedX,
        y: player.group.position.y,
        z: clampedZ
      })
    );
  }
}

/* =========================
   MOBILE MOVEMENT
========================= */

document
  .querySelectorAll(
    ".moveButton"
  )
  .forEach(
    button => {

      const move =
        button.dataset.move;

      button.addEventListener(
        "pointerdown",
        function(event) {

          event.preventDefault();

          keys[
            "mobile-" + move
          ] = true;
        }
      );

      button.addEventListener(
        "pointerup",
        function(event) {

          event.preventDefault();

          keys[
            "mobile-" + move
          ] = false;
        }
      );

      button.addEventListener(
        "pointercancel",
        function() {

          keys[
            "mobile-" + move
          ] = false;
        }
      );
    }
  );

/* =========================
   CAMERA
========================= */

function updateCamera() {

  const player =
    players.get(
      localPlayerId
    );

  if (!player) {
    return;
  }

  const target =
    player.group.position;

  const desired =
    new THREE.Vector3(
      target.x,
      target.y + 7,
      target.z + 10
    );

  camera.position.lerp(
    desired,
    0.08
  );

  camera.lookAt(
    target.x,
    target.y + 1.2,
    target.z
  );
}

/* =========================
   GAME LOOP
========================= */

function animate() {

  requestAnimationFrame(
    animate
  );

  const delta =
    Math.min(
      clock.getDelta(),
      0.05
    );

  if (world) {
    world.update(delta);
  }

  updateMovement(delta);

  for (
    const player
    of players.values()
  ) {

    player.update(delta);
  }

  updateCamera();

  if (renderer && scene && camera) {

    renderer.render(
      scene,
      camera
    );
  }
}

/* =========================
   START
========================= */

createGame();

connect();

</script>
