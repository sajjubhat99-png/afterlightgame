<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>AFTERLIGHT — Multiplayer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #02040a;
            color: #eafcff;
            font-family: Arial, Helvetica, sans-serif;
        }

        canvas {
            display: block;
        }

        /* -----------------------------------------
           JOIN SCREEN
        ----------------------------------------- */

        #joinScreen {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(
                    circle at center,
                    rgba(0, 150, 190, 0.12),
                    transparent 45%
                ),
                #02040a;
        }

        .joinBox {
            width: min(430px, 90vw);
            padding: 38px;
            text-align: center;
            border: 1px solid rgba(45, 220, 255, 0.35);
            background: rgba(5, 12, 20, 0.94);
            box-shadow:
                0 0 50px rgba(0, 180, 255, 0.12),
                inset 0 0 30px rgba(0, 180, 255, 0.04);
        }

        .logo {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 8px;
            color: #50eaff;
            margin-bottom: 8px;
        }

        .tagline {
            color: #7595a2;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 35px;
        }

        #nameInput {
            width: 100%;
            padding: 15px;
            background: #08131b;
            border: 1px solid #194957;
            color: white;
            outline: none;
            font-size: 16px;
            text-align: center;
        }

        #nameInput:focus {
            border-color: #35ddff;
            box-shadow: 0 0 15px rgba(53, 221, 255, 0.15);
        }

        #joinButton {
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            border: 0;
            background: #19cbea;
            color: #001018;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 2px;
        }

        #joinButton:hover {
            background: #58eaff;
        }

        #connectionStatus {
            margin-top: 18px;
            font-size: 12px;
            color: #718b96;
        }

        /* -----------------------------------------
           HUD
        ----------------------------------------- */

        #hud {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 20;
        }

        .topBar {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .brand {
            font-weight: 900;
            letter-spacing: 4px;
            color: #4be8ff;
            font-size: 18px;
        }

        .stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .stat {
            min-width: 82px;
            padding: 8px 12px;
            background: rgba(3, 12, 18, 0.84);
            border: 1px solid rgba(45, 220, 255, 0.2);
        }

        .statLabel {
            display: block;
            font-size: 9px;
            color: #75909b;
            letter-spacing: 1px;
        }

        .statValue {
            font-size: 15px;
            font-weight: bold;
        }

        /* -----------------------------------------
           LEFT PANEL
        ----------------------------------------- */

        #leftPanel {
            position: absolute;
            left: 15px;
            top: 85px;
            width: 220px;
            max-height: calc(100% - 105px);
            overflow-y: auto;
            pointer-events: auto;
        }

        .panel {
            background: rgba(3, 10, 16, 0.84);
            border: 1px solid rgba(45, 220, 255, 0.18);
            padding: 14px;
            margin-bottom: 10px;
            backdrop-filter: blur(8px);
        }

        .panelTitle {
            font-size: 11px;
            color: #4deaff;
            letter-spacing: 2px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .phase {
            font-size: 18px;
            font-weight: bold;
        }

        .challenge {
            margin-top: 5px;
            color: #90aab5;
            font-size: 12px;
        }

        /* -----------------------------------------
           ACTIONS
        ----------------------------------------- */

        #actions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            pointer-events: auto;
            width: min(700px, 94vw);
        }

        .actionButton {
            padding: 11px 15px;
            background: rgba(4, 18, 25, 0.9);
            color: #c9f7ff;
            border: 1px solid rgba(45, 220, 255, 0.3);
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .actionButton:hover {
            background: rgba(24, 107, 128, 0.8);
            border-color: #49eaff;
        }

        .actionButton.primary {
            background: #13bcd9;
            color: #001018;
            font-weight: bold;
        }

        /* -----------------------------------------
           LOG
        ----------------------------------------- */

        #log {
            position: absolute;
            right: 15px;
            bottom: 20px;
            width: 270px;
            max-height: 170px;
            overflow-y: auto;
            padding: 12px;
            background: rgba(3, 10, 16, 0.82);
            border: 1px solid rgba(45, 220, 255, 0.16);
            font-size: 11px;
            color: #7896a1;
        }

        .logLine {
            margin-bottom: 6px;
        }

        /* -----------------------------------------
           COMPETITORS
        ----------------------------------------- */

        #playersList {
            font-size: 11px;
        }

        .playerRow {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .alive {
            color: #54e6a7;
        }

        .dead {
            color: #e85d75;
        }

        /* -----------------------------------------
           MOBILE CONTROLS
        ----------------------------------------- */

        #mobileControls {
            display: none;
            position: fixed;
            bottom: 25px;
            left: 20px;
            z-index: 50;
            pointer-events: auto;
        }

        .mobileGrid {
            display: grid;
            grid-template-columns: 52px 52px 52px;
            grid-template-rows: 52px 52px;
            gap: 5px;
        }

        .moveButton {
            border: 1px solid rgba(45, 220, 255, 0.3);
            background: rgba(3, 15, 22, 0.82);
            color: #55eaff;
            font-size: 20px;
            touch-action: none;
        }

        #loading {
            position: fixed;
            inset: 0;
            z-index: 90;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(2, 4, 10, 0.7);
            color: #55eaff;
            letter-spacing: 3px;
        }

        @media (max-width: 800px) {

            .logo {
                font-size: 32px;
            }

            #leftPanel {
                width: 180px;
                top: 75px;
            }

            #log {
                width: 190px;
                max-height: 110px;
            }

            .stats {
                max-width: 230px;
            }

            #mobileControls {
                display: block;
            }

            #actions {
                bottom: 20px;
                left: auto;
                right: 10px;
                transform: none;
                width: 48%;
            }

            .actionButton {
                padding: 9px;
                font-size: 9px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================================
         JOIN SCREEN
    ========================================== -->

    <div id="joinScreen">

        <div class="joinBox">

            <div class="logo">
                AFTERLIGHT
            </div>

            <div class="tagline">
                THE CHALLENGE IS ONLY HALF THE GAME
            </div>

            <input
                id="nameInput"
                type="text"
                maxlength="20"
                placeholder="ENTER YOUR NAME"
                autocomplete="off"
            >

            <button id="joinButton">
                ENTER AFTERLIGHT
            </button>

            <div id="connectionStatus">
                Connecting to AFTERLIGHT...
            </div>

        </div>

    </div>

    <!-- =========================================
         LOADING
    ========================================== -->

    <div id="loading">
        INITIALIZING AFTERLIGHT...
    </div>

    <!-- =========================================
         HUD
    ========================================== -->

    <div id="hud">

        <div class="topBar">

            <div class="brand">
                AFTERLIGHT
            </div>

            <div class="stats">

                <div class="stat">
                    <span class="statLabel">CREDITS</span>
                    <span id="credits" class="statValue">500</span>
                </div>

                <div class="stat">
                    <span class="statLabel">INFLUENCE</span>
                    <span id="influence" class="statValue">10</span>
                </div>

                <div class="stat">
                    <span class="statLabel">TRUST</span>
                    <span id="trust" class="statValue">50</span>
                </div>

                <div class="stat">
                    <span class="statLabel">ENERGY</span>
                    <span id="energy" class="statValue">100</span>
                </div>

                <div class="stat">
                    <span class="statLabel">PLAYERS</span>
                    <span id="playerCount" class="statValue">0</span>
                </div>

            </div>

        </div>

        <!-- LEFT -->

        <div id="leftPanel">

            <div class="panel">

                <div class="panelTitle">
                    CURRENT PHASE
                </div>

                <div id="phase" class="phase">
                    LOBBY
                </div>

                <div id="challenge" class="challenge">
                    Awaiting competitors
                </div>

            </div>

            <div class="panel">

                <div class="panelTitle">
                    COMPETITORS
                </div>

                <div id="playersList"></div>

            </div>

        </div>

        <!-- ACTIONS -->

        <div id="actions">

            <button
                class="actionButton primary"
                data-action="ready"
            >
                READY
            </button>

            <button
                class="actionButton"
                data-action="challenge"
            >
                CHALLENGE
            </button>

            <button
                class="actionButton"
                data-action="social"
            >
                SOCIAL
            </button>

            <button
                class="actionButton"
                data-action="mission"
            >
                SECRET MISSION
            </button>

            <button
                class="actionButton"
                data-action="parallel"
            >
                PARALLEL WORLD
            </button>

            <button
                class="actionButton"
                data-action="architect"
            >
                INVESTIGATE
            </button>

            <button
                class="actionButton"
                data-action="heist"
            >
                HEIST
            </button>

            <button
                class="actionButton"
                data-action="vacation"
            >
                VACATION
            </button>

            <button
                class="actionButton"
                data-action="power"
            >
                POWER STORE
            </button>

        </div>

        <!-- LOG -->

        <div id="log"></div>

    </div>

    <!-- =========================================
         MOBILE CONTROLS
    ========================================== -->

    <div id="mobileControls">

        <div class="mobileGrid">

            <button class="moveButton" data-move="forward">
                ▲
            </button>

            <button class="moveButton" data-move="left">
                ◀
            </button>

            <button class="moveButton" data-move="right">
                ▶
            </button>

            <button class="moveButton" data-move="back">
                ▼
            </button>

        </div>

    </div>

    <!-- =========================================
         GAME
    ========================================== -->

    <script type="module">

        import * as THREE
            from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

        import { AfterlightWorld }
            from "./world.js";

        // -----------------------------------------
        // CONFIG
        // -----------------------------------------

        const WS_URL =
            "wss://afterlightgame.sajjubhat99.workers.dev/ws";

        // -----------------------------------------
        // THREE.JS
        // -----------------------------------------

        const scene =
            new THREE.Scene();

        scene.background =
            new THREE.Color(0x02040a);

        const camera =
            new THREE.PerspectiveCamera(
                70,
                window.innerWidth /
                window.innerHeight,
                0.1,
                200
            );

        camera.position.set(
            0,
            5,
            12
        );

        const renderer =
            new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: "high-performance"
            });

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 1.5)
        );

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.outputColorSpace =
            THREE.SRGBColorSpace;

        document.body.appendChild(
            renderer.domElement
        );

        // -----------------------------------------
        // WORLD
        // -----------------------------------------

        const world =
            new AfterlightWorld(scene);

        // -----------------------------------------
        // STATE
        // -----------------------------------------

        let socket = null;
        let myId = null;
        let myName = "";
        let roomState = null;

        const playerMeshes =
            new Map();

        const keys = {};

        let joined = false;

        let lastTime =
            performance.now();

        let sendTimer = 0;

        // -----------------------------------------
        // DOM
        // -----------------------------------------

        const joinScreen =
            document.getElementById(
                "joinScreen"
            );

        const joinButton =
            document.getElementById(
                "joinButton"
            );

        const nameInput =
            document.getElementById(
                "nameInput"
            );

        const connectionStatus =
            document.getElementById(
                "connectionStatus"
            );

        const phaseElement =
            document.getElementById(
                "phase"
            );

        const challengeElement =
            document.getElementById(
                "challenge"
            );

        const playerCount =
            document.getElementById(
                "playerCount"
            );

        const playersList =
            document.getElementById(
                "playersList"
            );

        const logElement =
            document.getElementById(
                "log"
            );

        // -----------------------------------------
        // LOG
        // -----------------------------------------

        function log(message) {

            const row =
                document.createElement("div");

            row.className =
                "logLine";

            row.textContent =
                message;

            logElement.prepend(row);

            while (
                logElement.children.length > 20
            ) {
                logElement.removeChild(
                    logElement.lastChild
                );
            }
        }

        // -----------------------------------------
        // CONNECT
        // -----------------------------------------

        function connect() {

            connectionStatus.textContent =
                "Connecting...";

            socket =
                new WebSocket(WS_URL);

            socket.addEventListener(
                "open",
                () => {

                    connectionStatus.textContent =
                        "CONNECTED";

                    log(
                        "Connected to AFTERLIGHT."
                    );

                    socket.send(
                        JSON.stringify({
                            type: "join",
                            name: myName
                        })
                    );
                }
            );

            socket.addEventListener(
                "message",
                event => {

                    try {

                        const message =
                            JSON.parse(
                                event.data
                            );

                        handleServerMessage(
                            message
                        );

                    } catch (error) {

                        console.error(
                            error
                        );
                    }
                }
            );

            socket.addEventListener(
                "close",
                () => {

                    connectionStatus.textContent =
                        "DISCONNECTED";

                    log(
                        "Connection lost."
                    );
                }
            );

            socket.addEventListener(
                "error",
                () => {

                    connectionStatus.textContent =
                        "CONNECTION ERROR";

                }
            );
        }

        // -----------------------------------------
        // SERVER MESSAGES
        // -----------------------------------------

        function handleServerMessage(
            message
        ) {

            if (
                message.type ===
                "welcome"
            ) {

                myId =
                    message.id;

                roomState =
                    message;

                joined = true;

                joinScreen.style.display =
                    "none";

                document.getElementById(
                    "loading"
                ).style.display =
                    "none";

                log(
                    "Welcome to AFTERLIGHT."
                );

                updatePlayers(
                    message.players || []
                );

                return;
            }

            if (
                message.type ===
                "state"
            ) {

                roomState =
                    message;

                if (
                    message.players
                ) {
                    updatePlayers(
                        message.players
                    );
                }

                updateUI(
                    message
                );

                return;
            }

            if (
                message.type ===
                "players"
            ) {

                updatePlayers(
                    message.players || []
                );

                return;
            }

            if (
                message.type ===
                "log"
            ) {

                log(
                    message.message || ""
                );

                return;
            }
        }

        // -----------------------------------------
        // PLAYERS
        // -----------------------------------------

        function updatePlayers(
            players
        ) {

            playerCount.textContent =
                players.length;

            playersList.innerHTML = "";

            const activeIds =
                new Set();

            for (
                const player
                of players
            ) {

                activeIds.add(
                    player.id
                );

                const row =
                    document.createElement(
                        "div"
                    );

                row.className =
                    "playerRow";

                const name =
                    document.createElement(
                        "span"
                    );

                name.textContent =
                    player.name ||
                    "Player";

                const status =
                    document.createElement(
                        "span"
                    );

                status.textContent =
                    player.alive === false
                        ? "OUT"
                        : "IN";

                status.className =
                    player.alive === false
                        ? "dead"
                        : "alive";

                row.appendChild(name);
                row.appendChild(status);

                playersList.appendChild(
                    row
                );

                updatePlayerMesh(
                    player
                );
            }

            for (
                const [
                    id,
                    mesh
                ]
                of playerMeshes
            ) {

                if (
                    !activeIds.has(id)
                ) {

                    scene.remove(mesh);

                    playerMeshes.delete(id);
                }
            }
        }

        // -----------------------------------------
        // PLAYER MESH
        // -----------------------------------------

        function updatePlayerMesh(
            player
        ) {

            let mesh =
                playerMeshes.get(
                    player.id
                );

            if (!mesh) {

                mesh =
                    createPlayerMesh(
                        player
                    );

                playerMeshes.set(
                    player.id,
                    mesh
                );

                scene.add(mesh);
            }

            mesh.position.set(
                Number(player.x) || 0,
                Number(player.y) || 1,
                Number(player.z) || 0
            );

            if (
                player.id === myId
            ) {

                mesh.material.color.set(
                    0x55eaff
                );

            } else {

                mesh.material.color.set(
                    0xff4fa3
                );
            }
        }

        function createPlayerMesh(
            player
        ) {

            const group =
                new THREE.Group();

            const body =
                new THREE.Mesh(
                    new THREE.CapsuleGeometry(
                        0.45,
                        1.2,
                        8,
                        16
                    ),
                    new THREE.MeshStandardMaterial({
                        color: 0xff4fa3,
                        metalness: 0.25,
                        roughness: 0.45,
                        emissive: 0x220011,
                        emissiveIntensity: 0.6
                    })
                );

            group.add(body);

            const light =
                new THREE.PointLight(
                    0xff3f9d,
                    1.5,
                    5
                );

            light.position.y =
                0.7;

            group.add(light);

            return group;
        }

        // -----------------------------------------
        // UI
        // -----------------------------------------

        function updateUI(
            state
        ) {

            phaseElement.textContent =
                state.phase ||
                "LOBBY";

            challengeElement.textContent =
                state.challenge ||
                "Awaiting challenge";

            if (
                state.players
            ) {

                const me =
                    state.players.find(
                        p =>
                            p.id === myId
                    );

                if (me) {

                    document.getElementById(
                        "credits"
                    ).textContent =
                        me.credits ?? 500;

                    document.getElementById(
                        "influence"
                    ).textContent =
                        me.influence ?? 10;

                    document.getElementById(
                        "trust"
                    ).textContent =
                        me.trust ?? 50;

                    document.getElementById(
                        "energy"
                    ).textContent =
                        me.energy ?? 100;
                }
            }
        }

        // -----------------------------------------
        // SEND
        // -----------------------------------------

        function send(
            data
        ) {

            if (
                socket &&
                socket.readyState ===
                WebSocket.OPEN
            ) {

                socket.send(
                    JSON.stringify(data)
                );
            }
        }

        // -----------------------------------------
        // ACTIONS
        // -----------------------------------------

        function action(
            type
        ) {

            switch (type) {

                case "ready":

                    send({
                        type: "ready"
                    });

                    log(
                        "Ready status sent."
                    );

                    break;

                case "challenge":

                    send({
                        type: "challenge",
                        action: "observe"
                    });

                    break;

                case "social":

                    send({
                        type: "social",
                        action: "talk"
                    });

                    break;

                case "mission":

                    send({
                        type: "mission"
                    });

                    break;

                case "parallel":

                    send({
                        type: "parallel"
                    });

                    break;

                case "architect":

                    send({
                        type: "architect"
                    });

                    break;

                case "heist":

                    send({
                        type: "heist"
                    });

                    break;

                case "vacation":

                    send({
                        type: "vacation"
                    });

                    break;

                case "power":

                    send({
                        type: "buyPower",
                        power: "Shield Band"
                    });

                    break;
            }
        }

        document
            .querySelectorAll(
                ".actionButton"
            )
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        action(
                            button.dataset.action
                        );
                    }
                );
            });

        // -----------------------------------------
        // JOIN
        // -----------------------------------------

        joinButton.addEventListener(
            "click",
            () => {

                const name =
                    nameInput.value
                        .trim();

                if (!name) {

                    nameInput.focus();

                    return;
                }

                myName =
                    name;

                document.getElementById(
                    "loading"
                ).style.display =
                    "flex";

                connect();
            }
        );

        nameInput.addEventListener(
            "keydown",
            event => {

                if (
                    event.key ===
                    "Enter"
                ) {

                    joinButton.click();
                }
            }
        );

        // -----------------------------------------
        // KEYBOARD MOVEMENT
        // -----------------------------------------

        window.addEventListener(
            "keydown",
            event => {

                keys[
                    event.key.toLowerCase()
                ] = true;
            }
        );

        window.addEventListener(
            "keyup",
            event => {

                keys[
                    event.key.toLowerCase()
                ] = false;
            }
        );

        // -----------------------------------------
        // MOBILE MOVEMENT
        // -----------------------------------------

        document
            .querySelectorAll(
                ".moveButton"
            )
            .forEach(button => {

                const move =
                    button.dataset.move;

                button.addEventListener(
                    "pointerdown",
                    () => {

                        keys[move] = true;
                    }
                );

                button.addEventListener(
                    "pointerup",
                    () => {

                        keys[move] = false;
                    }
                );

                button.addEventListener(
                    "pointercancel",
                    () => {

                        keys[move] = false;
                    }
                );
            });

        // -----------------------------------------
        // LOCAL MOVEMENT
        // -----------------------------------------

        function updateMovement(
            delta
        ) {

            if (!myId) return;

            const mesh =
                playerMeshes.get(
                    myId
                );

            if (!mesh) return;

            const speed =
                7 * delta;

            let moved = false;

            if (
                keys.w ||
                keys.arrowup ||
                keys.forward
            ) {

                mesh.position.z -= speed;

                moved = true;
            }

            if (
                keys.s ||
                keys.arrowdown ||
                keys.back
            ) {

                mesh.position.z += speed;

                moved = true;
            }

            if (
                keys.a ||
                keys.arrowleft ||
                keys.left
            ) {

                mesh.position.x -= speed;

                moved = true;
            }

            if (
                keys.d ||
                keys.arrowright ||
                keys.right
            ) {

                mesh.position.x += speed;

                moved = true;
            }

            mesh.position.x =
                THREE.MathUtils.clamp(
                    mesh.position.x,
                    -30,
                    30
                );

            mesh.position.z =
                THREE.MathUtils.clamp(
                    mesh.position.z,
                    -30,
                    30
                );

            if (moved) {

                sendTimer += delta;

                if (
                    sendTimer >
                    0.08
                ) {

                    sendTimer = 0;

                    send({
                        type: "move",
                        x: mesh.position.x,
                        y: mesh.position.y,
                        z: mesh.position.z
                    });
                }
            }
        }

        // -----------------------------------------
        // CAMERA
        // -----------------------------------------

        function updateCamera() {

            if (!myId) return;

            const mesh =
                playerMeshes.get(
                    myId
                );

            if (!mesh) return;

            const target =
                new THREE.Vector3(
                    mesh.position.x,
                    mesh.position.y + 1.2,
                    mesh.position.z
                );

            const desired =
                new THREE.Vector3(
                    mesh.position.x,
                    mesh.position.y + 6,
                    mesh.position.z + 9
                );

            camera.position.lerp(
                desired,
                0.08
            );

            camera.lookAt(
                target
            );
        }

        // -----------------------------------------
        // RESIZE
        // -----------------------------------------

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );
            }
        );

        // -----------------------------------------
        // GAME LOOP
        // -----------------------------------------

        function animate(
            now
        ) {

            requestAnimationFrame(
                animate
            );

            const delta =
                Math.min(
                    (now - lastTime) /
                    1000,
                    0.05
                );

            lastTime = now;

            updateMovement(
                delta
            );

            updateCamera();

            world.update(
                delta
            );

            renderer.render(
                scene,
                camera
            );
        }

        requestAnimationFrame(
            animate
        );

    </script>

</body>
</html>
