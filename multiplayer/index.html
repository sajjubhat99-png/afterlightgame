<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>AFTERLIGHT — Multiplayer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #03070b;
      color: #eafcff;
      font-family: Arial, Helvetica, sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    #game {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    /* =========================
       JOIN SCREEN
       ========================= */

    #joinScreen {
      position: absolute;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center, rgba(0, 240, 255, 0.08), transparent 35%),
        linear-gradient(135deg, #020509, #07131a 50%, #020509);
    }

    .joinCard {
      width: min(460px, calc(100% - 32px));
      padding: 36px;
      border: 1px solid rgba(0, 240, 255, 0.28);
      background: rgba(4, 13, 18, 0.92);
      box-shadow:
        0 0 50px rgba(0, 220, 255, 0.08),
        inset 0 0 40px rgba(0, 220, 255, 0.03);
      border-radius: 18px;
      text-align: center;
    }

    .logo {
      margin: 0 0 8px;
      font-size: 32px;
      letter-spacing: 8px;
      font-weight: 800;
      color: #dffcff;
    }

    .tagline {
      margin: 0 0 28px;
      color: #74cbd5;
      font-size: 12px;
      letter-spacing: 2px;
    }

    .joinTitle {
      margin-bottom: 18px;
      font-size: 18px;
      letter-spacing: 2px;
    }

    #nameInput {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border-radius: 9px;
      border: 1px solid rgba(0, 240, 255, 0.35);
      background: #071218;
      color: white;
      outline: none;
      text-align: center;
    }

    #nameInput:focus {
      border-color: #00eaff;
      box-shadow: 0 0 20px rgba(0, 234, 255, 0.12);
    }

    #joinButton {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border: 0;
      border-radius: 9px;
      background: linear-gradient(90deg, #00b9d4, #00eaff);
      color: #001015;
      font-weight: 800;
      letter-spacing: 2px;
    }

    #joinButton:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #connectionStatus {
      margin-top: 15px;
      min-height: 18px;
      font-size: 12px;
      color: #78aeb6;
    }

    /* =========================
       HUD
       ========================= */

    #hud {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: none;
      pointer-events: none;
    }

    .topBar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      min-height: 72px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: linear-gradient(
        180deg,
        rgba(2, 8, 12, 0.92),
        rgba(2, 8, 12, 0.45),
        transparent
      );
    }

    .brand {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 4px;
    }

    .phaseBox {
      text-align: center;
      min-width: 140px;
    }

    .phaseLabel {
      font-size: 9px;
      color: #6f9ca5;
      letter-spacing: 2px;
    }

    #phaseValue {
      margin-top: 3px;
      font-size: 14px;
      color: #00eaff;
      font-weight: 800;
    }

    .stats {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat {
      min-width: 75px;
      padding: 7px 10px;
      border: 1px solid rgba(0, 220, 255, 0.16);
      border-radius: 7px;
      background: rgba(3, 13, 18, 0.76);
      text-align: center;
    }

    .statLabel {
      display: block;
      font-size: 8px;
      color: #668d95;
      letter-spacing: 1px;
    }

    .statValue {
      display: block;
      margin-top: 3px;
      font-size: 12px;
      color: #e7fdff;
    }

    /* =========================
       PANELS
       ========================= */

    .panel {
      position: absolute;
      pointer-events: auto;
      border: 1px solid rgba(0, 220, 255, 0.17);
      border-radius: 10px;
      background: rgba(3, 12, 17, 0.86);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
    }

    #leftPanel {
      left: 14px;
      top: 88px;
      width: 205px;
      max-height: calc(100% - 180px);
      overflow: auto;
      padding: 12px;
    }

    #rightPanel {
      right: 14px;
      top: 88px;
      width: 225px;
      max-height: calc(100% - 180px);
      overflow: auto;
      padding: 12px;
    }

    .panelTitle {
      margin-bottom: 9px;
      font-size: 10px;
      color: #6da8b1;
      letter-spacing: 2px;
      font-weight: 800;
    }

    .actionGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
    }

    .actionButton {
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid rgba(0, 220, 255, 0.22);
      border-radius: 7px;
      background: rgba(5, 23, 30, 0.9);
      color: #cceff4;
      font-size: 11px;
      text-align: left;
      transition: 0.15s;
    }

    .actionButton:hover {
      border-color: #00eaff;
      background: rgba(0, 220, 255, 0.09);
      color: white;
    }

    .actionButton:active {
      transform: scale(0.98);
    }

    .actionButton.primary {
      border-color: rgba(0, 234, 255, 0.6);
      background: rgba(0, 190, 220, 0.13);
    }

    .actionButton.danger {
      border-color: rgba(255, 70, 90, 0.4);
    }

    .actionButton:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* =========================
       COMPETITORS
       ========================= */

    .playerRow {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 7px 6px;
      margin-bottom: 4px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.025);
      cursor: pointer;
      pointer-events: auto;
    }

    .playerRow:hover {
      background: rgba(0, 234, 255, 0.08);
    }

    .playerDot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00eaff;
      flex: 0 0 auto;
    }

    .playerDot.dead {
      background: #6d7375;
    }

    .playerInfo {
      min-width: 0;
      flex: 1;
    }

    .playerName {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 10px;
    }

    .playerRole {
      margin-top: 2px;
      color: #638991;
      font-size: 8px;
    }

    .selected {
      outline: 1px solid #00eaff;
      background: rgba(0, 234, 255, 0.08);
    }

    /* =========================
       LOG
       ========================= */

    #logPanel {
      position: absolute;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      width: min(620px, calc(100% - 470px));
      min-width: 300px;
      height: 108px;
      padding: 10px;
      pointer-events: auto;
    }

    #gameLog {
      height: 76px;
      overflow-y: auto;
      font-size: 10px;
      line-height: 1.55;
      color: #8fb8be;
    }

    .logLine {
      border-bottom: 1px solid rgba(255, 255, 255, 0.025);
      padding: 2px 0;
    }

    /* =========================
       BOTTOM ACTIONS
       ========================= */

    #bottomActions {
      position: absolute;
      left: 50%;
      bottom: 137px;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    .bottomButton {
      min-height: 40px;
      padding: 0 14px;
      border-radius: 8px;
      border: 1px solid rgba(0, 234, 255, 0.3);
      background: rgba(3, 15, 20, 0.9);
      color: white;
      font-size: 10px;
      letter-spacing: 0.7px;
    }

    .bottomButton:hover {
      border-color: #00eaff;
    }

    /* =========================
       TARGET
       ========================= */

    #targetInfo {
      margin-top: 8px;
      padding: 8px;
      border-radius: 7px;
      background: rgba(0, 234, 255, 0.05);
      color: #83c8d0;
      font-size: 9px;
      line-height: 1.5;
    }

    /* =========================
       MOBILE CONTROLS
       ========================= */

    #mobileControls {
      position: absolute;
      left: 16px;
      bottom: 145px;
      width: 130px;
      height: 130px;
      pointer-events: auto;
      display: none;
    }

    .moveButton {
      position: absolute;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(0, 234, 255, 0.3);
      background: rgba(3, 18, 24, 0.8);
      color: white;
    }

    #moveUp {
      left: 44px;
      top: 0;
    }

    #moveLeft {
      left: 0;
      top: 44px;
    }

    #moveDown {
      left: 44px;
      top: 88px;
    }

    #moveRight {
      right: 0;
      top: 44px;
    }

    /* =========================
       TOAST
       ========================= */

    #toast {
      position: absolute;
      left: 50%;
      top: 82px;
      transform: translateX(-50%);
      z-index: 30;
      max-width: 80%;
      padding: 9px 14px;
      border: 1px solid rgba(0, 234, 255, 0.3);
      border-radius: 8px;
      background: rgba(2, 12, 17, 0.92);
      color: #d8fbff;
      font-size: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #toast.show {
      opacity: 1;
    }

    /* =========================
       RESPONSIVE
       ========================= */

    @media (max-width: 900px) {
      #leftPanel {
        width: 175px;
      }

      #rightPanel {
        width: 185px;
      }

      #logPanel {
        width: calc(100% - 390px);
      }
    }

    @media (max-width: 700px) {
      .topBar {
        align-items: flex-start;
      }

      .brand {
        font-size: 13px;
      }

      .phaseBox {
        min-width: 80px;
      }

      .stats {
        max-width: 190px;
      }

      .stat {
        min-width: 55px;
        padding: 5px;
      }

      #leftPanel {
        top: auto;
        bottom: 15px;
        left: 155px;
        width: 155px;
        max-height: 175px;
      }

      #rightPanel {
        right: 10px;
        top: 78px;
        width: 165px;
        max-height: 235px;
      }

      #logPanel {
        left: 10px;
        bottom: 10px;
        transform: none;
        width: 135px;
        min-width: 0;
        height: 120px;
      }

      #bottomActions {
        bottom: 190px;
        left: auto;
        right: 10px;
        transform: none;
        width: 160px;
      }

      .bottomButton {
        width: 100%;
      }

      #mobileControls {
        display: block;
      }
    }

    @media (max-width: 480px) {
      .logo {
        font-size: 23px;
      }

      .joinCard {
        padding: 25px;
      }

      .stats {
        display: none;
      }

      #leftPanel {
        display: none;
      }

      #rightPanel {
        width: 155px;
      }

      #bottomActions {
        width: 145px;
      }
    }
  </style>
</head>

<body>

<div id="game">

  <canvas id="gameCanvas"></canvas>

  <!-- =========================
       JOIN
       ========================= -->

  <div id="joinScreen">

    <div class="joinCard">

      <div class="logo">AFTERLIGHT</div>

      <div class="tagline">
        THE CHALLENGE IS ONLY HALF THE GAME
      </div>

      <div class="joinTitle">
        ENTER THE COMPETITION
      </div>

      <input
        id="nameInput"
        type="text"
        maxlength="20"
        autocomplete="off"
        placeholder="Enter your competitor name"
      />

      <button id="joinButton">
        JOIN AFTERLIGHT
      </button>

      <div id="connectionStatus">
        Connecting to AFTERLIGHT...
      </div>

    </div>

  </div>

  <!-- =========================
       HUD
       ========================= -->

  <div id="hud">

    <div class="topBar">

      <div class="brand">
        AFTERLIGHT
      </div>

      <div class="phaseBox">
        <div class="phaseLabel">
          CURRENT PHASE
        </div>

        <div id="phaseValue">
          LOBBY
        </div>
      </div>

      <div class="stats">

        <div class="stat">
          <span class="statLabel">CREDITS</span>
          <span class="statValue" id="creditsValue">500</span>
        </div>

        <div class="stat">
          <span class="statLabel">INFLUENCE</span>
          <span class="statValue" id="influenceValue">10</span>
        </div>

        <div class="stat">
          <span class="statLabel">TRUST</span>
          <span class="statValue" id="trustValue">50</span>
        </div>

        <div class="stat">
          <span class="statLabel">ENERGY</span>
          <span class="statValue" id="energyValue">100</span>
        </div>

      </div>

    </div>

    <!-- LEFT -->

    <div id="leftPanel" class="panel">

      <div class="panelTitle">
        GAME ACTIONS
      </div>

      <div class="actionGrid">

        <button class="actionButton primary" data-action="ready">
          READY / START
        </button>

        <button class="actionButton" data-action="safe">
          Challenge — Safe
        </button>

        <button class="actionButton" data-action="risk">
          Challenge — Risk
        </button>

        <button class="actionButton" data-action="observe">
          Challenge — Observe
        </button>

        <button class="actionButton" data-action="talk">
          Social — Talk
        </button>

        <button class="actionButton" data-action="accuse">
          Social — Accuse
        </button>

        <button class="actionButton" data-action="deal">
          Social — Deal
        </button>

        <button class="actionButton" data-action="endSocial">
          End Social Phase
        </button>

        <button class="actionButton" data-action="mission">
          Reveal / Complete Mission
        </button>

      </div>

    </div>

    <!-- RIGHT -->

    <div id="rightPanel" class="panel">

      <div class="panelTitle">
        COMPETITORS
      </div>

      <div id="competitorsList"></div>

      <div id="targetInfo">
        No competitor selected.
        <br />
        Click a competitor to target them.
      </div>

    </div>

    <!-- BOTTOM -->

    <div id="bottomActions">

      <button class="bottomButton" data-action="store">
        POWER STORE
      </button>

      <button class="bottomButton" data-action="parallel">
        PARALLEL WORLD
      </button>

      <button class="bottomButton" data-action="architect">
        INVESTIGATE ARCHITECT
      </button>

      <button class="bottomButton" data-action="heist">
        THE HEIST
      </button>

      <button class="bottomButton" data-action="vacation">
        VACATION
      </button>

      <button class="bottomButton" data-action="trade">
        TRADE
      </button>

      <button class="bottomButton" data-action="pact">
        SECRET PACT
      </button>

      <button class="bottomButton" data-action="protect">
        PROTECT
      </button>

      <button class="bottomButton" data-action="vote">
        VOTE
      </button>

    </div>

    <!-- LOG -->

    <div id="logPanel" class="panel">

      <div class="panelTitle">
        AFTERLIGHT LOG
      </div>

      <div id="gameLog"></div>

    </div>

    <!-- MOBILE MOVEMENT -->

    <div id="mobileControls">

      <button class="moveButton" id="moveUp">
        ▲
      </button>

      <button class="moveButton" id="moveLeft">
        ◀
      </button>

      <button class="moveButton" id="moveDown">
        ▼
      </button>

      <button class="moveButton" id="moveRight">
        ▶
      </button>

    </div>

    <div id="toast"></div>

  </div>

</div>

<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { AfterlightWorld }
  from "./world.js";

import { AfterlightPlayer }
  from "./player.js";


/* =========================================
   SERVER
   ========================================= */

const SERVER_URL =
  "wss://afterlightgame.sajjubhat99.workers.dev/ws";


/* =========================================
   DOM
   ========================================= */

const canvas =
  document.getElementById("gameCanvas");

const joinScreen =
  document.getElementById("joinScreen");

const nameInput =
  document.getElementById("nameInput");

const joinButton =
  document.getElementById("joinButton");

const connectionStatus =
  document.getElementById("connectionStatus");

const hud =
  document.getElementById("hud");

const phaseValue =
  document.getElementById("phaseValue");

const creditsValue =
  document.getElementById("creditsValue");

const influenceValue =
  document.getElementById("influenceValue");

const trustValue =
  document.getElementById("trustValue");

const energyValue =
  document.getElementById("energyValue");

const competitorsList =
  document.getElementById("competitorsList");

const gameLog =
  document.getElementById("gameLog");

const targetInfo =
  document.getElementById("targetInfo");

const toast =
  document.getElementById("toast");


/* =========================================
   THREE.JS
   ========================================= */

const renderer =
  new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    powerPreference: "high-performance"
  });

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio || 1, 1.5)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;


const scene =
  new THREE.Scene();

scene.background =
  new THREE.Color(0x02070a);

scene.fog =
  new THREE.Fog(
    0x02070a,
    25,
    80
  );


const camera =
  new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    200
  );

camera.position.set(
  0,
  12,
  18
);


/* =========================================
   LIGHT
   ========================================= */

const ambient =
  new THREE.HemisphereLight(
    0x9defff,
    0x020307,
    1.5
  );

scene.add(ambient);


const directional =
  new THREE.DirectionalLight(
    0xffffff,
    1.2
  );

directional.position.set(
  10,
  20,
  10
);

scene.add(directional);


/* =========================================
   WORLD
   ========================================= */

const world =
  new AfterlightWorld(scene);


/* =========================================
   GAME STATE
   ========================================= */

let socket = null;

let connected = false;

let joined = false;

let localPlayerId = null;

let roomState = null;

let localPlayer = null;

let selectedPlayerId = null;

const players = new Map();


/* =========================================
   CONNECT
   ========================================= */

function connect() {

  connectionStatus.textContent =
    "Connecting to AFTERLIGHT...";

  socket =
    new WebSocket(SERVER_URL);

  socket.addEventListener(
    "open",
    () => {

      connected = true;

      connectionStatus.textContent =
        "Connected. Enter your name.";

      updateJoinButton();

    }
  );


  socket.addEventListener(
    "message",
    event => {

      let message;

      try {
        message =
          JSON.parse(event.data);
      } catch {
        return;
      }

      handleServerMessage(message);

    }
  );


  socket.addEventListener(
    "close",
    () => {

      connected = false;

      connectionStatus.textContent =
        "Disconnected. Refresh to reconnect.";

    }
  );


  socket.addEventListener(
    "error",
    () => {

      connected = false;

      connectionStatus.textContent =
        "Connection error.";

    }
  );

}


connect();


/* =========================================
   JOIN
   ========================================= */

function updateJoinButton() {

  joinButton.disabled =
    !connected ||
    joined ||
    nameInput.value.trim().length < 2;

}


nameInput.addEventListener(
  "input",
  updateJoinButton
);


nameInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !joinButton.disabled
    ) {
      joinGame();
    }

  }
);


joinButton.addEventListener(
  "click",
  joinGame
);


function joinGame() {

  if (!connected || joined) {
    return;
  }

  const name =
    nameInput.value.trim();

  if (name.length < 2) {

    connectionStatus.textContent =
      "Enter at least 2 characters.";

    nameInput.focus();

    return;
  }

  joined = true;

  joinButton.disabled = true;

  connectionStatus.textContent =
    "Joining AFTERLIGHT...";

  socket.send(
    JSON.stringify({
      type: "join",
      name
    })
  );

}


/* =========================================
   SERVER MESSAGE
   ========================================= */

function handleServerMessage(message) {

  switch (message.type) {

    case "connected":

      connectionStatus.textContent =
        "Connected. Enter your name.";

      break;


    case "welcome":

      handleWelcome(message);

      break;


    case "nameConfirmed":

      showToast(
        `Welcome ${message.name}`
      );

      break;


    case "state":

      handleState(message.room);

      break;

  }

}


/* =========================================
   WELCOME
   ========================================= */

function handleWelcome(message) {

  localPlayerId =
    message.player?.id ||
    message.id ||
    null;

  joinScreen.style.display =
    "none";

  hud.style.display =
    "block";

  showToast(
    "Welcome to AFTERLIGHT."
  );

}


/* =========================================
   STATE
   ========================================= */

function handleState(room) {

  if (!room) return;

  roomState = room;

  updateHUD();

  updatePlayers();

  updateCompetitors();

  updateLog();

}


/* =========================================
   HUD
   ========================================= */

function updateHUD() {

  phaseValue.textContent =
    roomState.phase || "LOBBY";

  const me =
    findLocalPlayer();

  if (!me) return;

  creditsValue.textContent =
    me.credits ?? 0;

  influenceValue.textContent =
    me.influence ?? 0;

  trustValue.textContent =
    me.trust ?? 0;

  energyValue.textContent =
    me.energy ?? 0;

}


/* =========================================
   FIND LOCAL PLAYER
   ========================================= */

function findLocalPlayer() {

  if (!roomState) {
    return null;
  }

  return (
    roomState.players?.find(
      player =>
        player.id === localPlayerId
    ) ||
    roomState.competitors?.find(
      player =>
        player.id === localPlayerId
    ) ||
    null
  );

}


/* =========================================
   UPDATE 3D PLAYERS
   ========================================= */

function updatePlayers() {

  const serverPlayers =
    roomState.players ||
    roomState.competitors ||
    [];

  const activeIds =
    new Set();

  for (const data of serverPlayers) {

    activeIds.add(data.id);

    let player =
      players.get(data.id);

    if (!player) {

      player =
        new AfterlightPlayer(
          data.id,
          data.name,
          data.role,
          data.id === localPlayerId
        );

      scene.add(player.group);

      players.set(
        data.id,
        player
      );

    }

    player.updateFromServer(data);

    if (data.id === localPlayerId) {

      localPlayer =
        player;

    }

  }


  for (const [id, player] of players) {

    if (!activeIds.has(id)) {

      player.remove();

      scene.remove(
        player.group
      );

      players.delete(id);

    }

  }

}


/* =========================================
   COMPETITOR LIST
   ========================================= */

function updateCompetitors() {

  competitorsList.innerHTML = "";

  const list =
    roomState?.players ||
    roomState?.competitors ||
    [];

  for (const player of list) {

    const row =
      document.createElement("div");

    row.className =
      "playerRow";

    if (
      player.id === selectedPlayerId
    ) {
      row.classList.add("selected");
    }

    const dot =
      document.createElement("div");

    dot.className =
      "playerDot";

    if (!player.alive) {
      dot.classList.add("dead");
    }

    const info =
      document.createElement("div");

    info.className =
      "playerInfo";

    const name =
      document.createElement("div");

    name.className =
      "playerName";

    name.textContent =
      player.name;

    const role =
      document.createElement("div");

    role.className =
      "playerRole";

    role.textContent =
      player.role +
      (player.id === localPlayerId
        ? " • YOU"
        : "");

    info.appendChild(name);
    info.appendChild(role);

    row.appendChild(dot);
    row.appendChild(info);

    row.addEventListener(
      "click",
      () => {

        if (
          player.id === localPlayerId
        ) {
          showToast(
            "You cannot target yourself."
          );

          return;
        }

        selectedPlayerId =
          player.id;

        updateCompetitors();

        updateTargetInfo();

        select3DPlayer(
          player.id
        );

      }
    );

    competitorsList.appendChild(row);

  }

  updateTargetInfo();

}


/* =========================================
   TARGET INFO
   ========================================= */

function updateTargetInfo() {

  const target =
    getPlayerById(
      selectedPlayerId
    );

  if (!target) {

    targetInfo.innerHTML =
      "No competitor selected.<br>Click a competitor to target them.";

    return;
  }

  targetInfo.innerHTML = `
    <strong>${escapeHTML(target.name)}</strong>
    <br>
    Role: ${escapeHTML(target.role)}
    <br>
    Trust: ${target.trust}
    <br>
    Status: ${target.alive ? "ACTIVE" : "ELIMINATED"}
  `;

}


/* =========================================
   3D PLAYER CLICK SELECTION
   ========================================= */

function select3DPlayer(id) {

  selectedPlayerId = id;

  updateCompetitors();

  updateTargetInfo();

  showToast(
    `Target selected: ${getPlayerById(id)?.name || "Player"}`
  );

}


/* =========================================
   LOG
   ========================================= */

function updateLog() {

  gameLog.innerHTML = "";

  const logs =
    roomState.logs || [];

  for (
    const message of logs.slice(-20)
  ) {

    const line =
      document.createElement("div");

    line.className =
      "logLine";

    line.textContent =
      message;

    gameLog.appendChild(line);

  }

  gameLog.scrollTop =
    gameLog.scrollHeight;

}


/* =========================================
   BUTTON ACTIONS
   ========================================= */

document
  .querySelectorAll("[data-action]")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {

        const action =
          button.dataset.action;

        executeAction(action);

      }
    );

  });


function executeAction(action) {

  if (!socket || socket.readyState !== WebSocket.OPEN) {

    showToast(
      "Not connected to the server."
    );

    return;

  }

  switch (action) {

    case "ready":

      send({
        type: "ready"
      });

      break;


    case "safe":

      sendChallenge("safe");

      break;


    case "risk":

      sendChallenge("risk");

      break;


    case "observe":

      sendChallenge("observe");

      break;


    case "talk":

      sendSocial("talk");

      break;


    case "accuse":

      sendSocial("accuse");

      break;


    case "deal":

      sendSocial("deal");

      break;


    case "endSocial":

      sendSocial("end");

      break;


    case "mission":

      send({
        type: "mission"
      });

      break;


    case "store":

      openPowerStore();

      break;


    case "parallel":

      send({
        type: "parallel"
      });

      break;


    case "architect":

      send({
        type: "architect"
      });

      break;


    case "heist":

      send({
        type: "heist"
      });

      break;


    case "vacation":

      send({
        type: "vacation"
      });

      break;


    case "trade":

      targetRequired(
        "trade"
      );

      break;


    case "pact":

      targetRequired(
        "pact"
      );

      break;


    case "protect":

      targetRequired(
        "protect"
      );

      break;


    case "vote":

      targetRequired(
        "vote"
      );

      break;

  }

}


/* =========================================
   CHALLENGE
   ========================================= */

function sendChallenge(action) {

  send({
    type: "challenge",
    action
  });

}


/* =========================================
   SOCIAL
   ========================================= */

function sendSocial(action) {

  send({
    type: "social",
    action
  });

}


/* =========================================
   TARGET ACTION
   ========================================= */

function targetRequired(action) {

  if (!selectedPlayerId) {

    showToast(
      "Select a competitor first."
    );

    return;

  }

  if (
    selectedPlayerId ===
    localPlayerId
  ) {

    showToast(
      "You cannot target yourself."
    );

    return;

  }

  send({
    type: action,
    targetId: selectedPlayerId
  });

}


/* =========================================
   SEND
   ========================================= */

function send(data) {

  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {

    showToast(
      "Server connection unavailable."
    );

    return;

  }

  socket.send(
    JSON.stringify(data)
  );

  showToast(
    actionMessage(data)
  );

}


/* =========================================
   ACTION FEEDBACK
   ========================================= */

function actionMessage(data) {

  switch (data.type) {

    case "ready":
      return "Ready status changed.";

    case "challenge":
      return `Challenge action: ${data.action}`;

    case "social":
      return `Social action: ${data.action}`;

    case "mission":
      return "Mission action submitted.";

    case "parallel":
      return "Entering Parallel World...";

    case "architect":
      return "Investigating the Architect...";

    case "heist":
      return "Shadow Protocol initiated.";

    case "vacation":
      return "Exploring vacation world...";

    case "trade":
      return "Trade submitted.";

    case "pact":
      return "Secret pact submitted.";

    case "protect":
      return "Protection submitted.";

    case "vote":
      return "Vote submitted.";

    default:
      return "Action submitted.";

  }

}


/* =========================================
   POWER STORE
   ========================================= */

function openPowerStore() {

  const powers =
    roomState?.powers || [];

  if (!powers.length) {

    showToast(
      "Power Store unavailable."
    );

    return;

  }

  const choice =
    prompt(
      powers
        .map(
          (power, index) =>
            `${index + 1}. ${power.name} — ${power.cost} Credits\n${power.description}`
        )
        .join("\n\n") +
      "\n\nEnter a number to purchase:"
    );

  if (!choice) {
    return;
  }

  const index =
    Number(choice) - 1;

  if (
    !Number.isInteger(index) ||
    index < 0 ||
    index >= powers.length
  ) {

    showToast(
      "Invalid Power Store selection."
    );

    return;

  }

  send({
    type: "buyPower",
    powerId: powers[index].id
  });

}


/* =========================================
   3D CLICKING
   ========================================= */

const raycaster =
  new THREE.Raycaster();

const pointer =
  new THREE.Vector2();


canvas.addEventListener(
  "pointerdown",
  event => {

    /*
     * Only treat clicks directly on the
     * 3D canvas as world interaction.
     */

    pointer.x =
      (event.clientX /
        window.innerWidth) *
        2 -
      1;

    pointer.y =
      -(event.clientY /
        window.innerHeight) *
        2 +
      1;

    raycaster.setFromCamera(
      pointer,
      camera
    );

    const objects = [];

    for (
      const player of players.values()
    ) {

      if (
        player.group.visible
      ) {

        player.group.traverse(
          object => {

            if (
              object.isMesh ||
              object.isSprite
            ) {
              objects.push(object);
            }

          }
        );

      }

    }

    const hits =
      raycaster.intersectObjects(
        objects,
        true
      );

    if (!hits.length) {
      return;
    }

    let object =
      hits[0].object;

    while (
      object &&
      object.parent
    ) {

      for (
        const [id, player] of players
      ) {

        if (
          player.group === object
        ) {

          if (
            id !== localPlayerId
          ) {

            select3DPlayer(id);

          }

          return;

        }

      }

      object =
        object.parent;

    }

  }
);


/* =========================================
   MOVEMENT
   ========================================= */

const keys =
  new Set();

window.addEventListener(
  "keydown",
  event => {

    if (
      event.target === nameInput
    ) {
      return;
    }

    keys.add(
      event.key.toLowerCase()
    );

  }
);


window.addEventListener(
  "keyup",
  event => {

    keys.delete(
      event.key.toLowerCase()
    );

  }
);


let lastMoveSend = 0;


function updateMovement(time) {

  if (!localPlayer) {
    return;
  }

  if (!joined) {
    return;
  }

  let dx = 0;
  let dz = 0;

  if (
    keys.has("w") ||
    keys.has("arrowup")
  ) {
    dz -= 1;
  }

  if (
    keys.has("s") ||
    keys.has("arrowdown")
  ) {
    dz += 1;
  }

  if (
    keys.has("a") ||
    keys.has("arrowleft")
  ) {
    dx -= 1;
  }

  if (
    keys.has("d") ||
    keys.has("arrowright")
  ) {
    dx += 1;
  }

  if (
    dx === 0 &&
    dz === 0
  ) {
    return;
  }

  const length =
    Math.sqrt(
      dx * dx +
      dz * dz
    );

  dx /= length;
  dz /= length;

  const speed = 0.12;

  const position =
    localPlayer.group.position;

  position.x +=
    dx * speed;

  position.z +=
    dz * speed;

  position.x =
    THREE.MathUtils.clamp(
      position.x,
      -22,
      22
    );

  position.z =
    THREE.MathUtils.clamp(
      position.z,
      -22,
      22
    );

  if (
    time - lastMoveSend >
    80
  ) {

    lastMoveSend =
      time;

    sendSilent({
      type: "move",
      x: position.x,
      y: position.y,
      z: position.z
    });

  }

}


/* =========================================
   MOBILE MOVEMENT
   ========================================= */

function moveMobile(dx, dz) {

  if (!localPlayer) {
    return;
  }

  const position =
    localPlayer.group.position;

  position.x += dx;
  position.z += dz;

  position.x =
    THREE.MathUtils.clamp(
      position.x,
      -22,
      22
    );

  position.z =
    THREE.MathUtils.clamp(
      position.z,
      -22,
      22
    );

  sendSilent({
    type: "move",
    x: position.x,
    y: position.y,
    z: position.z
  });

}


document
  .getElementById("moveUp")
  .addEventListener(
    "click",
    () => moveMobile(0, -1)
  );


document
  .getElementById("moveDown")
  .addEventListener(
    "click",
    () => moveMobile(0, 1)
  );


document
  .getElementById("moveLeft")
  .addEventListener(
    "click",
    () => moveMobile(-1, 0)
  );


document
  .getElementById("moveRight")
  .addEventListener(
    "click",
    () => moveMobile(1, 0)
  );


/* =========================================
   SILENT SEND
   ========================================= */

function sendSilent(data) {

  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    return;
  }

  socket.send(
    JSON.stringify(data)
  );

}


/* =========================================
   TOAST
   ========================================= */

let toastTimer = null;


function showToast(message) {

  toast.textContent =
    message;

  toast.classList.add(
    "show"
  );

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(
      () => {
        toast.classList.remove(
          "show"
        );
      },
      1800
    );

}


/* =========================================
   HELPERS
   ========================================= */

function getPlayerById(id) {

  if (!id || !roomState) {
    return null;
  }

  return (
    roomState.players?.find(
      player => player.id === id
    ) ||
    roomState.competitors?.find(
      player => player.id === id
    ) ||
    null
  );

}


function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* =========================================
   CAMERA
   ========================================= */

function updateCamera() {

  if (!localPlayer) {
    return;
  }

  const target =
    localPlayer.group.position;

  const desired =
    new THREE.Vector3(
      target.x,
      target.y + 10,
      target.z + 14
    );

  camera.position.lerp(
    desired,
    0.08
  );

  camera.lookAt(
    target.x,
    target.y + 1.3,
    target.z
  );

}


/* =========================================
   RESIZE
   ========================================= */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio || 1,
        1.5
      )
    );

  }
);


/* =========================================
   GAME LOOP
   ========================================= */

let previousTime =
  performance.now();


function animate(time) {

  requestAnimationFrame(
    animate
  );

  const delta =
    Math.min(
      0.05,
      (time - previousTime) / 1000
    );

  previousTime =
    time;

  updateMovement(time);

  updateCamera();

  world.update(delta);

  for (
    const player of players.values()
  ) {

    player.update(
      delta
    );

  }

  renderer.render(
    scene,
    camera
  );

}


requestAnimationFrame(
  animate
);

</script>
