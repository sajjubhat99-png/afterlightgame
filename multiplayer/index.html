<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AFTERLIGHT</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #02050a;
  color: white;
  font-family: Arial, Helvetica, sans-serif;
}

#game {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
  width: 100%;
  height: 100%;
}

/* JOIN SCREEN */

#joinScreen {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at center, rgba(0, 220, 255, 0.08), transparent 45%),
    #02050a;
}

.joinBox {
  width: min(420px, 92vw);
  padding: 32px;
  text-align: center;
  border: 1px solid rgba(0, 220, 255, 0.35);
  background: rgba(5, 12, 20, 0.94);
  border-radius: 18px;
  box-shadow: 0 0 40px rgba(0, 220, 255, 0.12);
}

.logo {
  font-size: clamp(42px, 10vw, 64px);
  font-weight: 800;
  letter-spacing: 8px;
  line-height: 1;
  margin-bottom: 14px;
  color: #eaffff;
  text-shadow: 0 0 20px rgba(0, 220, 255, 0.45);
}

.tagline {
  color: #7bdbea;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

.joinTitle {
  font-size: 19px;
  margin-bottom: 16px;
}

#nameInput {
  width: 100%;
  height: 50px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid rgba(0, 220, 255, 0.45);
  outline: none;
  background: #07111b;
  color: white;
  font-size: 16px;
  margin-bottom: 12px;
}

#nameInput:focus {
  border-color: #00d9ff;
  box-shadow: 0 0 15px rgba(0, 217, 255, 0.15);
}

#joinButton {
  width: 100%;
  height: 50px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(90deg, #00a9c7, #00e0ff);
  color: #001018;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

#joinButton:hover {
  filter: brightness(1.1);
}

#connectionStatus {
  min-height: 20px;
  margin-top: 14px;
  color: #78c9d8;
  font-size: 12px;
}

/* HUD */

#hud {
  position: fixed;
  inset: 0;
  z-index: 100;
  pointer-events: none;
  display: none;
}

.panel {
  background: rgba(3, 10, 17, 0.82);
  border: 1px solid rgba(0, 220, 255, 0.25);
  border-radius: 12px;
  backdrop-filter: blur(8px);
}

#topBar {
  position: absolute;
  top: 15px;
  left: 15px;
  right: 15px;
  display: flex;
  justify-content: space-between;
  gap: 12px;
}

.stats {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.stat {
  padding: 9px 12px;
  min-width: 90px;
}

.statLabel {
  color: #6d8994;
  font-size: 9px;
  text-transform: uppercase;
}

.statValue {
  margin-top: 3px;
  font-size: 15px;
  font-weight: bold;
}

#phasePanel {
  padding: 10px 14px;
  min-width: 160px;
}

#phase {
  color: #00d9ff;
  font-weight: bold;
}

#challenge {
  color: #a7c0c8;
  font-size: 11px;
  margin-top: 4px;
}

#competitors {
  position: absolute;
  top: 82px;
  left: 15px;
  width: 210px;
  padding: 14px;
}

.panelTitle {
  color: #00d9ff;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1px;
  margin-bottom: 10px;
}

#competitorList {
  max-height: 280px;
  overflow-y: auto;
}

.competitor {
  padding: 7px 5px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  font-size: 11px;
}

.competitorRole {
  color: #718992;
  font-size: 9px;
  margin-top: 2px;
}

#actions {
  position: absolute;
  right: 15px;
  bottom: 15px;
  width: 190px;
  display: grid;
  gap: 7px;
  pointer-events: auto;
}

.actionButton {
  min-height: 38px;
  border: 1px solid rgba(0, 220, 255, 0.25);
  border-radius: 8px;
  background: rgba(4, 15, 23, 0.9);
  color: #d9faff;
  cursor: pointer;
  font-size: 11px;
  font-weight: bold;
}

.actionButton:hover {
  border-color: #00d9ff;
  background: rgba(0, 217, 255, 0.12);
}

#logPanel {
  position: absolute;
  left: 15px;
  bottom: 15px;
  width: 300px;
  max-height: 150px;
  padding: 12px;
}

#log {
  max-height: 105px;
  overflow-y: auto;
  color: #91aab2;
  font-size: 10px;
  line-height: 1.5;
}

.logLine {
  margin-bottom: 3px;
}

/* MOBILE */

#mobileControls {
  position: absolute;
  left: 18px;
  bottom: 18px;
  display: none;
  pointer-events: auto;
}

.mobilePad {
  display: grid;
  grid-template-columns: 48px 48px 48px;
  grid-template-rows: 48px 48px;
  gap: 5px;
}

.mobileButton {
  border: 1px solid rgba(0,220,255,.35);
  background: rgba(3,15,23,.85);
  color: white;
  border-radius: 10px;
  font-size: 18px;
}

.up {
  grid-column: 2;
}

.left {
  grid-column: 1;
}

.down {
  grid-column: 2;
}

.right {
  grid-column: 3;
}

@media (max-width: 700px) {
  .joinBox {
    padding: 25px 20px;
  }

  .logo {
    font-size: 42px;
    letter-spacing: 5px;
  }

  #competitors {
    display: none;
  }

  #logPanel {
    width: 210px;
    bottom: 15px;
    left: 15px;
  }

  #actions {
    width: 150px;
    right: 10px;
    bottom: 10px;
  }

  #mobileControls {
    display: block;
  }

  .stat {
    min-width: 70px;
    padding: 7px 9px;
  }
}
</style>
</head>

<body>

<div id="game"></div>

<!-- JOIN SCREEN -->
<div id="joinScreen">
  <div class="joinBox">

    <div class="logo">AFTERLIGHT</div>

    <div class="tagline">
      THE CHALLENGE IS ONLY HALF THE GAME
    </div>

    <div class="joinTitle">
      ENTER AFTERLIGHT
    </div>

    <input
      id="nameInput"
      type="text"
      maxlength="18"
      autocomplete="off"
      placeholder="Enter your name"
    >

    <button id="joinButton" type="button">
      ENTER GAME
    </button>

    <div id="connectionStatus">
      Connecting to AFTERLIGHT...
    </div>

  </div>
</div>

<!-- GAME HUD -->
<div id="hud">

  <div id="topBar">

    <div class="stats">

      <div class="panel stat">
        <div class="statLabel">Credits</div>
        <div class="statValue" id="credits">500</div>
      </div>

      <div class="panel stat">
        <div class="statLabel">Influence</div>
        <div class="statValue" id="influence">10</div>
      </div>

      <div class="panel stat">
        <div class="statLabel">Trust</div>
        <div class="statValue" id="trust">50</div>
      </div>

      <div class="panel stat">
        <div class="statLabel">Energy</div>
        <div class="statValue" id="energy">100</div>
      </div>

      <div class="panel stat">
        <div class="statLabel">Players</div>
        <div class="statValue" id="playerCount">0</div>
      </div>

    </div>

    <div id="phasePanel" class="panel">
      <div class="statLabel">Current Phase</div>
      <div id="phase">LOBBY</div>
      <div id="challenge">Waiting for competitors...</div>
    </div>

  </div>

  <div id="competitors" class="panel">
    <div class="panelTitle">COMPETITORS</div>
    <div id="competitorList"></div>
  </div>

  <div id="logPanel" class="panel">
    <div class="panelTitle">AFTERLIGHT LOG</div>
    <div id="log"></div>
  </div>

  <div id="actions">

    <button class="actionButton" data-action="ready">READY</button>
    <button class="actionButton" data-action="challenge">CHALLENGE</button>
    <button class="actionButton" data-action="social">SOCIAL PHASE</button>
    <button class="actionButton" data-action="mission">SECRET MISSION</button>
    <button class="actionButton" data-action="parallel">PARALLEL WORLD</button>
    <button class="actionButton" data-action="architect">INVESTIGATE</button>
    <button class="actionButton" data-action="heist">THE HEIST</button>
    <button class="actionButton" data-action="vacation">VACATION</button>
    <button class="actionButton" data-action="power">POWER STORE</button>
    <button class="actionButton" data-action="vote">VOTE</button>

  </div>

  <div id="mobileControls">

    <div class="mobilePad">
      <button class="mobileButton up" data-key="w">▲</button>
      <button class="mobileButton left" data-key="a">◀</button>
      <button class="mobileButton down" data-key="s">▼</button>
      <button class="mobileButton right" data-key="d">▶</button>
    </div>

  </div>

</div>

<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

import { AfterlightWorld }
from "./world.js";

import { AfterlightPlayer }
from "./player.js";


/* SERVER */

const SERVER_URL =
"wss://afterlightgame.sajjubhat99.workers.dev/ws";


/* ELEMENTS */

const game = document.getElementById("game");
const joinScreen = document.getElementById("joinScreen");
const hud = document.getElementById("hud");

const nameInput = document.getElementById("nameInput");
const joinButton = document.getElementById("joinButton");
const connectionStatus =
document.getElementById("connectionStatus");


/* THREE */

const scene = new THREE.Scene();

scene.background =
new THREE.Color(0x02050a);

scene.fog =
new THREE.Fog(0x02050a, 25, 100);


const camera =
new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  200
);

camera.position.set(0, 8, 12);


const renderer =
new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: "low-power"
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 1.5)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

game.appendChild(renderer.domElement);


/* WORLD */

const world =
new AfterlightWorld(scene);


/* PLAYERS */

const players = new Map();

let localPlayerId = null;


/* CONNECTION */

let socket = null;
let joined = false;
let reconnectTimer = null;


/* INPUT */

const keys = {
  w: false,
  a: false,
  s: false,
  d: false
};


/* JOIN */

function connect() {

  if (
    socket &&
    (
      socket.readyState === WebSocket.OPEN ||
      socket.readyState === WebSocket.CONNECTING
    )
  ) {
    return;
  }

  connectionStatus.textContent =
    "Connecting to AFTERLIGHT...";

  try {

    socket = new WebSocket(SERVER_URL);

  } catch (error) {

    connectionStatus.textContent =
      "Connection failed.";

    scheduleReconnect();

    return;
  }


  socket.addEventListener("open", () => {

    connectionStatus.textContent =
      "Connected. Enter your name.";

    /*
      IMPORTANT:
      Do NOT hide the join screen here.
      The player must be able to type normally.
    */

    nameInput.focus();

  });


  socket.addEventListener("close", () => {

    if (!joined) {

      connectionStatus.textContent =
        "Connection lost. Reconnecting...";

      scheduleReconnect();

    }

  });


  socket.addEventListener("error", () => {

    if (!joined) {

      connectionStatus.textContent =
        "Connection error. Retrying...";

    }

  });


  socket.addEventListener("message", event => {

    let message;

    try {
      message = JSON.parse(event.data);
    } catch {
      return;
    }

    handleMessage(message);

  });

}


/* RECONNECT */

function scheduleReconnect() {

  if (reconnectTimer) return;

  reconnectTimer = setTimeout(() => {

    reconnectTimer = null;
    connect();

  }, 3000);

}


/* SEND JOIN */

function joinGame() {

  const name =
    nameInput.value.trim();

  if (!name) {

    connectionStatus.textContent =
      "Please enter your name.";

    nameInput.focus();

    return;
  }

  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {

    connectionStatus.textContent =
      "Still connecting...";

    return;
  }


  socket.send(JSON.stringify({
    type: "join",
    name: name
  }));

}


/* JOIN BUTTON */

joinButton.addEventListener(
  "click",
  joinGame
);


/* ENTER KEY */

nameInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      event.preventDefault();
      joinGame();

    }

  }
);


/* SERVER MESSAGES */

function handleMessage(message) {

  switch (message.type) {

    case "welcome":

      joined = true;

      localPlayerId =
        message.player?.id ||
        message.id ||
        null;

      joinScreen.style.display = "none";
      hud.style.display = "block";

      addLog(
        "Welcome to AFTERLIGHT."
      );

      break;


    case "players":

      updatePlayers(
        message.players || []
      );

      break;


    case "state":

      updateGameState(message);

      break;


    case "log":

      addLog(
        message.message ||
        message.text ||
        ""
      );

      break;


    case "error":

      addLog(
        message.message ||
        "Server error."
      );

      break;

  }

}


/* PLAYER UPDATE */

function updatePlayers(serverPlayers) {

  document.getElementById(
    "playerCount"
  ).textContent =
    serverPlayers.length;


  const activeIds =
    new Set();


  for (const data of serverPlayers) {

    activeIds.add(data.id);

    let player =
      players.get(data.id);


    if (!player) {

      player =
        new AfterlightPlayer(
          scene,
          data,
          data.id === localPlayerId
        );

      players.set(
        data.id,
        player
      );

    } else {

      player.updateFromServer(data);

    }

  }


  for (
    const [id, player]
    of players
  ) {

    if (!activeIds.has(id)) {

      player.remove();
      players.delete(id);

    }

  }


  updateCompetitorList(
    serverPlayers
  );

}


/* COMPETITOR LIST */

function updateCompetitorList(list) {

  const container =
    document.getElementById(
      "competitorList"
    );

  container.innerHTML = "";


  list.forEach(player => {

    const row =
      document.createElement("div");

    row.className =
      "competitor";


    row.innerHTML = `
      <div>
        ${escapeHTML(player.name || "Unknown")}
      </div>
      <div class="competitorRole">
        ${escapeHTML(player.role || "Competitor")}
      </div>
    `;


    container.appendChild(row);

  });

}


/* GAME STATE */

function updateGameState(data) {

  if (data.phase) {

    document.getElementById(
      "phase"
    ).textContent =
      data.phase;

  }


  if (data.challenge) {

    document.getElementById(
      "challenge"
    ).textContent =
      data.challenge;

  }


  const me =
    data.players?.find(
      p => p.id === localPlayerId
    );


  if (!me) return;


  document.getElementById(
    "credits"
  ).textContent =
    me.credits ?? 500;


  document.getElementById(
    "influence"
  ).textContent =
    me.influence ?? 10;


  document.getElementById(
    "trust"
  ).textContent =
    me.trust ?? 50;


  document.getElementById(
    "energy"
  ).textContent =
    me.energy ?? 100;

}


/* ACTIONS */

function sendAction(action, extra = {}) {

  if (
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ) {
    addLog("Not connected.");
    return;
  }


  socket.send(
    JSON.stringify({
      type: action,
      ...extra
    })
  );

}


document
.querySelectorAll(".actionButton")
.forEach(button => {

  button.addEventListener(
    "click",
    () => {

      const action =
        button.dataset.action;


      switch (action) {

        case "ready":
          sendAction("ready");
          break;

        case "challenge":
          sendAction(
            "challenge",
            { choice: "risk" }
          );
          break;

        case "social":
          sendAction("social");
          break;

        case "mission":
          sendAction("mission");
          break;

        case "parallel":
          sendAction("parallel");
          break;

        case "architect":
          sendAction("architect");
          break;

        case "heist":
          sendAction("heist");
          break;

        case "vacation":
          sendAction("vacation");
          break;

        case "power":
          sendAction(
            "buyPower",
            { power: "Shield Band" }
          );
          break;

        case "vote":
          sendAction(
            "vote",
            { target: null }
          );
          break;

      }

    }
  );

});


/* LOG */

function addLog(text) {

  if (!text) return;


  const log =
    document.getElementById(
      "log"
    );


  const line =
    document.createElement("div");

  line.className =
    "logLine";

  line.textContent =
    text;


  log.appendChild(line);


  while (
    log.children.length > 30
  ) {

    log.removeChild(
      log.firstChild
    );

  }


  log.scrollTop =
    log.scrollHeight;

}


/* SAFE TEXT */

function escapeHTML(value) {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


/* KEYBOARD */

window.addEventListener(
  "keydown",
  event => {

    /*
      Never capture typing inside
      the name input.
    */

    if (
      document.activeElement === nameInput
    ) {
      return;
    }


    const key =
      event.key.toLowerCase();


    if (
      Object.prototype.hasOwnProperty
      .call(keys, key)
    ) {

      keys[key] = true;

    }

  }
);


window.addEventListener(
  "keyup",
  event => {

    const key =
      event.key.toLowerCase();


    if (
      Object.prototype.hasOwnProperty
      .call(keys, key)
    ) {

      keys[key] = false;

    }

  }
);


/* MOBILE CONTROLS */

document
.querySelectorAll(".mobileButton")
.forEach(button => {

  const key =
    button.dataset.key;


  button.addEventListener(
    "pointerdown",
    event => {

      event.preventDefault();
      keys[key] = true;

    }
  );


  button.addEventListener(
    "pointerup",
    () => {

      keys[key] = false;

    }
  );


  button.addEventListener(
    "pointerleave",
    () => {

      keys[key] = false;

    }
  );

});


/* MOVEMENT */

function updateMovement(delta) {

  if (!localPlayerId) return;


  const player =
    players.get(localPlayerId);


  if (!player) return;


  const speed = 6;


  let dx = 0;
  let dz = 0;


  if (keys.w) dz -= 1;
  if (keys.s) dz += 1;
  if (keys.a) dx -= 1;
  if (keys.d) dx += 1;


  if (
    dx === 0 &&
    dz === 0
  ) {
    return;
  }


  const length =
    Math.sqrt(
      dx * dx +
      dz * dz
    );


  dx /= length;
  dz /= length;


  const movement =
    speed * delta;


  player.group.position.x +=
    dx * movement;

  player.group.position.z +=
    dz * movement;


  player.group.position.x =
    THREE.MathUtils.clamp(
      player.group.position.x,
      -22,
      22
    );


  player.group.position.z =
    THREE.MathUtils.clamp(
      player.group.position.z,
      -22,
      22
    );


  if (
    socket &&
    socket.readyState === WebSocket.OPEN
  ) {

    socket.send(
      JSON.stringify({
        type: "move",
        x: player.group.position.x,
        y: player.group.position.y,
        z: player.group.position.z
      })
    );

  }

}


/* CAMERA */

function updateCamera(delta) {

  if (!localPlayerId) return;


  const player =
    players.get(localPlayerId);


  if (!player) return;


  const target =
    new THREE.Vector3(
      player.group.position.x,
      player.group.position.y + 8,
      player.group.position.z + 11
    );


  camera.position.lerp(
    target,
    Math.min(
      1,
      delta * 4
    )
  );


  camera.lookAt(
    player.group.position.x,
    player.group.position.y + 1.5,
    player.group.position.z
  );

}


/* RESIZE */

window.addEventListener(
  "resize",
  () => {

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* LOOP */

let previousTime =
performance.now();


function animate(time) {

  requestAnimationFrame(
    animate
  );


  const delta =
    Math.min(
      0.05,
      (time - previousTime) / 1000
    );


  previousTime = time;


  world.update(delta);


  for (
    const player
    of players.values()
  ) {

    player.update(delta);

  }


  updateMovement(delta);
  updateCamera(delta);


  renderer.render(
    scene,
    camera
  );

}


connect();
animate(performance.now());

</script>

</body>
</html>
